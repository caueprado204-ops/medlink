<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MedLink</title>
<meta name="description" content="MedLink: escalas, equipes, vacinação, estoque e financeiro para instituições de saúde. Demonstração navegável com dados fictícios.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

:root{

  --c-navy:255 255 255; --c-onnavy:16 17 19; --c-teal:197 247 58; --c-tealsoft:46 56 22;
  --c-sky:30 42 70; --c-skyink:150 185 255; --c-amber:255 192 84; --c-amberbg:62 46 16; --c-danger:255 122 110; --c-dangerbg:72 28 25; --c-mint:46 56 22; color-scheme:dark;
}}

#root{min-height:100%}
h1,h2,h3{text-wrap:balance}
.display{font-family:var(--font-display);font-stretch:125%;font-weight:900;letter-spacing:-0.035em;line-height:.86;text-transform:uppercase}
.display-n{font-family:var(--font-display);font-stretch:112%;font-weight:800;letter-spacing:-0.02em}

:focus-visible{outline:2px solid rgb(var(--c-lime));outline-offset:2px;border-radius:10px}

.anim{animation:slidein .18s ease-out}
.spin{animation:spin 18s linear infinite}
.floaty{animation:floaty 6s ease-in-out infinite}
.draw{stroke-dasharray:600;animation:draw 1.4s .2s ease-out both}
.grid-bg{background-image:linear-gradient(rgb(255 255 255 / .07) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255 / .07) 1px,transparent 1px);background-size:56px 56px}
.glass{background:rgb(255 255 255 / .16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgb(255 255 255 / .35)}
.hatch{background-image:repeating-linear-gradient(135deg,rgb(var(--c-line)) 0 1px,transparent 1px 9px)}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}

#boot{padding:48px 16px;color:rgb(var(--c-soft))}

function recompute(S,sid){
  const s=shiftOf(S,sid);if(!s||s.status==='rascunho'||s.status==='cancelado')return s&&s.status;

  const act=a.filter(x=>ACTIVE(x.status)).length,pend=a.filter(x=>x.status==='aguardando_confirmacao').length,sub=a.filter(x=>x.status==='substituicao_solicitada').length;
  s.status=sub?'substituicao_solicitada':act<s.slots?'descoberto':pend?'aguardando_confirmacao':'confirmado';
  return s.status;
}
function checks(S,sh,pid,o={}){
  const B=[],W=[],p=profOf(S,pid);if(!p)return{blocking:['Profissional não encontrado.'],warnings:[]};
  const start=o.start||sh.start,end=o.end||sh.end,s0=+new Date(start),e0=+new Date(end);
  if(sh.status==='cancelado')B.push('Plantão cancelado.');
  if(!p.active)B.push('Profissional inativo.');
  if(p.validation==='rejeitado')B.push('Cadastro rejeitado na validação.');
  if(sh.cat&&sh.cat!==p.cat)B.push(`Este plantão exige ${CAT[sh.cat].toLowerCase()}.`);
  const act=S.asg.filter(a=>a.shift===sh.id&&ACTIVE(a.status));
  if(act.some(a=>a.prof===pid&&a.id!==o.ignore))B.push('Profissional já está neste plantão.');
  if(!o.ignore&&act.length>=sh.slots)B.push('Todas as vagas deste plantão já estão preenchidas.');
  const mine=S.asg.filter(a=>a.prof===pid&&ACTIVE(a.status)&&a.id!==o.ignore).map(a=>shiftOf(S,a.shift)).filter(s=>s&&s.id!==sh.id&&s.status!=='cancelado');
  const rest=S.rules.rest*36e5;
  mine.forEach(s=>{const a=+new Date(s.start),b=+new Date(s.end);
    if(a<e0&&b>s0)B.push(`Sobrepõe outro plantão em ${unitOf(S,s.unit).name} (${D2(s.start)}, ${hm(s.start)}–${hm(s.end)}).`);
    else if(b>s0-rest&&a<e0+rest)W.push(`Descanso menor que ${S.rules.rest}h em relação ao plantão de ${D2(s.start)} às ${hm(s.start)}.`);});
  S.abs.filter(x=>x.prof===pid&&x.from<=dkey(end)&&x.to>=dkey(start)).forEach(x=>{const per=`${D2(x.from)} a ${D2(x.to)}`;
    if(x.kind==='indisponivel')W.push(`Marcou indisponibilidade de ${per}.`);else B.push(`Em ${ABS[x.kind].toLowerCase()} de ${per}.`);});
  const miss=(sh.comps||[]).filter(c=>!p.comps.includes(c));if(miss.length)W.push('Competências não registradas: '+miss.join(', ')+'.');
  if(p.validation==='pendente'||p.validation==='em_analise')W.push('Cadastro profissional ainda não validado.');
  if(p.units.length&&!p.units.includes(sh.unit))W.push('Unidade fora das informadas pelo profissional.');
  if(p.avail.length){const w=new Date(start).getDay(),hs=hm(start),he=hm(end);
    if(!p.avail.some(v=>v.wd===w&&v.s<=hs&&(v.e>v.s?(dkey(end)===dkey(start)&&v.e>=he):true)))W.push('Fora da disponibilidade informada pelo profissional.');}
  const ws=weekStart(dkey(start)),we=addDays(ws,7);
  const wh=mine.filter(s=>dkey(s.start)>=ws&&dkey(s.start)<we).reduce((t,s)=>t+hours(s.start,s.end,s.brk),0)+hours(start,end,sh.brk);
  const lim=p.maxWeek||S.rules.week;if(wh>lim)W.push(`Carga na semana chegaria a ${fmtH(wh)} (referência: ${fmtH(lim)}).`);
  return {blocking:B,warnings:W,weekHours:wh};
}
function enforce(c,reason){
  if(c.blocking.length)throw new Stop('blocking',c.blocking[0],c);
  if(c.warnings.length&&!(reason||'').trim())throw new Stop('warning','Esta alteração gera alertas. Informe uma justificativa para autorizar a exceção.',c);
}

const permsOf=(S,u)=>S.rolePerms[u.role]||[];
const can=(S,u,perm,unit)=>permsOf(S,u).includes(perm)&&(!unit||!u.units||u.units.includes(unit));

const label=s=>`${F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'})}, ${hm(s.start)}–${hm(s.end)}`;
function need(S,u,perm,unit){if(!can(S,u,perm,unit))throw new Stop('permission','Seu perfil não tem permissão para esta ação.')}

/* motor de escalonamento: só profissionais sem bloqueios; menor pontuação vence. */
function proposeSchedule(S,u,from,to,unit,allowWarnings){
  const D=structuredClone(S);const out=[];
  const target=D.shifts.filter(s=>s.status!=='cancelado'&&dkey(s.start)>=from&&dkey(s.start)<=to&&(!unit||s.unit===unit)&&can(D,u,'shifts.manage',s.unit)&&new Date(s.start)>new Date()).sort((a,b)=>a.start.localeCompare(b.start));
  target.forEach(s=>{let open=s.slots-D.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).length;
    while(open>0){
      const cands=D.profs.filter(p=>p.active&&(!s.cat||p.cat===s.cat)).map(p=>({p,c:checks(D,s,p.id)})).filter(x=>!x.c.blocking.length&&(allowWarnings||!x.c.warnings.length));
      if(!cands.length){
        const why=D.profs.filter(p=>p.active&&(!s.cat||p.cat===s.cat)).map(p=>({p,c:checks(D,s,p.id)}));
        const reasons=why.map(x=>`${x.p.name.split(' ')[0]}: ${(x.c.blocking[0]||x.c.warnings[0]||'').replace(/\.$/,'')}`).slice(0,4);
        out.push({shift:s.id,prof:null,reasons:reasons.length?reasons:['Nenhum profissional ativo da categoria exigida.']});break;}
      cands.forEach(x=>{x.score=x.c.warnings.length*20+x.c.weekHours});
      cands.sort((a,b)=>a.score-b.score);const best=cands[0];
      D.asg.push({id:'tmp'+uid(),shift:s.id,prof:best.p.id,status:'aguardando_confirmacao',reason:null,warnings:[],ended:null});
      out.push({shift:s.id,prof:best.p.id,warnings:best.c.warnings,hours:best.c.weekHours});open--;}
  });
  return out;
}

const A={
  saveShift(S,u,f){

    const start=at(f.date,f.start);let end=at(f.date,f.end);if(f.end<=f.start)end=at(addDays(f.date,1),f.end);
    const dur=hours(start,end,0);if(dur>S.rules.maxShift)throw new Stop('validation',`Duração acima do máximo configurado (${S.rules.maxShift}h).`);

    if(start!==old.start||end!==old.end||f.unit!==old.unit||(f.cat||null)!==old.cat){const tmp={...old,unit:f.unit,cat:f.cat||null,brk};let W=[];
      act.forEach(a=>{const c=checks(S,tmp,a.prof,{ignore:a.id,start,end});if(c.blocking.length)enforce(c);W=W.concat(c.warnings.map(w=>profOf(S,a.prof).name.split(' ')[0]+': '+w))});

    a.status='recusado';a.ended=reason;recompute(S,s.id);log(S,u,'decline','asg',s.id,reason,label(s));
    note(S,u,'shifts.manage','Plantão recusado, vaga descoberta',`${u.name}: ${label(s)}. ${reason}`,{page:'escalas',shift:s.id},s.unit);},
  request(S,u,aid,kind,reason){const a=A.myAsg(S,u,aid),s=shiftOf(S,a.shift);
    if(!reason.trim())throw new Stop('validation','Explique o motivo da solicitação.');
    if(S.reqs.some(r=>r.asg===aid&&r.status==='pendente'))throw new Stop('validation','Já existe uma solicitação pendente para este plantão.');
    S.reqs.push({id:'r'+uid(),shift:s.id,asg:aid,prof:a.prof,kind,reason,status:'pendente',prev:a.status,created:nowIso()});
    if(kind==='substituicao'){a.status='substituicao_solicitada';recompute(S,s.id);}
    log(S,u,'request','req',s.id,reason,`${RK[kind]}, ${label(s)}`);
    note(S,u,'requests.decide',`Solicitação de ${RK[kind].toLowerCase()}`,`${u.name}: ${label(s)}`,{page:'solicitacoes'},s.unit);},
  apply(S,u,sid){const s=shiftOf(S,sid),p=profOf(S,u.prof);
    if(!['descoberto','publicado'].includes(s.status)||new Date(s.start)<new Date())throw new Stop('validation','Este plantão não está aberto para candidaturas.');
    if(s.cat&&s.cat!==p.cat)throw new Stop('validation','Este plantão exige outra categoria profissional.');
    if(S.reqs.some(r=>r.shift===sid&&r.prof===p.id&&r.kind==='candidatura'&&r.status==='pendente'))throw new Stop('validation','Você já se candidatou a este plantão.');
    S.reqs.push({id:'r'+uid(),shift:sid,asg:null,prof:p.id,kind:'candidatura',reason:null,status:'pendente',prev:null,created:nowIso()});
    log(S,u,'apply','req',sid,null,label(s));note(S,u,'requests.decide','Nova candidatura a plantão',`${u.name}: ${label(s)}`,{page:'solicitacoes'},s.unit);},
  withdraw(S,u,rid){const r=S.reqs.find(x=>x.id===rid);if(!r||r.prof!==u.prof||r.status!=='pendente')throw new Stop('validation','A solicitação já foi analisada.');
    r.status='cancelada';if(r.kind==='substituicao'){const a=S.asg.find(x=>x.id===r.asg);if(a&&a.status==='substituicao_solicitada')a.status=r.prev||'confirmado';recompute(S,r.shift);}
    log(S,u,'withdraw','req',r.shift,null,RK[r.kind]);},
  decide(S,u,rid,approve,txt,sub,reason){const r=S.reqs.find(x=>x.id===rid),s=shiftOf(S,r.shift);need(S,u,'requests.decide',s.unit);
    if(r.status!=='pendente')throw new Stop('validation','A solicitação já foi analisada.');
    if(!approve&&!txt.trim())throw new Stop('validation','Informe o motivo da recusa.');
    if(approve){
      if(r.kind==='candidatura')A.assign(S,u,s.id,r.prof,reason,true,true);
      else if(r.kind!=='alteracao'){const a=S.asg.find(x=>x.id===r.asg);const prev=a.status;a.status='removido';a.ended=r.kind==='substituicao'?'Substituição aprovada':'Cancelamento aprovado';
        if(sub){try{A.assign(S,u,s.id,sub,reason,false,true)}catch(e){a.status=prev;throw e}}
        if(recompute(S,s.id)==='descoberto')note(S,u,'shifts.manage','Plantão descoberto',label(s),{page:'escalas',shift:s.id},s.unit);}
    }else if(r.kind==='substituicao'){const a=S.asg.find(x=>x.id===r.asg);if(a&&a.status==='substituicao_solicitada')a.status=r.prev||'confirmado';recompute(S,s.id);}
    r.status=approve?'aprovada':'recusada';r.note=txt||null;r.decided=nowIso();r.by=u.name;
    log(S,u,approve?'approve':'reject','req',s.id,txt,`${RK[r.kind]} de ${profOf(S,r.prof).name}`);
    noteProf(S,u,r.prof,approve?'Solicitação aprovada':'Solicitação recusada',txt||label(s));},
  saveProf(S,u,f){need(S,u,'professionals.manage');if((f.name||'').trim().length<3)throw new Stop('validation','Informe o nome completo.');
    if(!f.cat)throw new Stop('validation','Selecione a categoria profissional.');
    if(f.id){const p=profOf(S,f.id);Object.assign(p,{name:f.name,cat:f.cat,council:f.council,num:f.num,uf:f.uf,email:f.email,phone:f.phone,comps:f.comps,units:f.units});log(S,u,'prof_update','prof',p.id,null,p.name);return p.id;}
    const p={id:'p'+uid(),name:f.name.trim(),cat:f.cat,council:f.council||COUNCIL[f.cat],num:f.num,uf:f.uf||'SP',comps:f.comps,validation:'pendente',active:true,email:f.email,phone:f.phone,units:f.units||[],avail:[],maxWeek:null};
    S.profs.push(p);log(S,u,'prof_create','prof',p.id,null,p.name);note(S,u,'documents.verify','Cadastro aguardando validação',p.name+' foi cadastrado(a).',{page:'prof',id:p.id});return p.id;},
  setActive(S,u,pid,v){need(S,u,'professionals.manage');const p=profOf(S,pid);p.active=v;log(S,u,'prof_update','prof',pid,null,`${p.name}: ${v?'reativado':'desativado'}`);},
  validate(S,u,pid,v){need(S,u,'documents.verify');const p=profOf(S,pid);const old=p.validation;p.validation=v;log(S,u,'validate','prof',pid,null,`${p.name}: ${VST[old][0]} → ${VST[v][0]}`);},
  availability(S,u,pid,slots,maxWeek){if(!(u.prof===pid||can(S,u,'professionals.manage')))throw new Stop('permission','Sem permissão.');
    if(slots.find(s=>s.s===s.e))throw new Stop('validation','Início e término não podem ser iguais.');
    const p=profOf(S,pid);p.avail=slots;p.maxWeek=maxWeek||null;log(S,u,'availability','prof',pid,null,p.name);},
  absence(S,u,pid,kind,from,to,txt){if(!(u.prof===pid||can(S,u,'professionals.manage')))throw new Stop('permission','Sem permissão.');
    if(!from||!to)throw new Stop('validation','Informe as datas.');if(to<from)throw new Stop('validation','A data final deve ser igual ou posterior à inicial.');
    S.abs.push({id:uid(),prof:pid,kind,from,to,note:txt});log(S,u,'absence','prof',pid,null,`${ABS[kind]}: ${D2(from)} a ${D2(to)}`);},
  absenceRm(S,u,id){const x=S.abs.find(a=>a.id===id);if(!(u.prof===x.prof||can(S,u,'professionals.manage')))throw new Stop('permission','Sem permissão.');S.abs=S.abs.filter(a=>a.id!==id);log(S,u,'absence_rm','prof',x.prof,null,ABS[x.kind]);},
  rules(S,u,r){need(S,u,'institution.manage');S.rules={rest:+r.rest,week:+r.week,maxShift:+r.maxShift};log(S,u,'rules','inst',null,null,`Descanso ${r.rest}h, semana ${r.week}h, máximo ${r.maxShift}h`);},
  perms(S,u,role,list){need(S,u,'members.manage');if(role==='admin')throw new Stop('permission','As permissões da administradora não podem ser alteradas.');S.rolePerms[role]=list;log(S,u,'perms','inst',null,null,ROLE[role]);},
  readAll(S,u){S.notifs.forEach(n=>{if(n.user===u.id)n.read=true})},
  read(S,u,id){const n=S.notifs.find(x=>x.id===id);if(n)n.read=true},
  /* estoque */
  stockMove(S,u,f){need(S,u,'stock.manage');const it=itemOf(S,f.item);const qty=Math.round(+f.qty);
    if(!qty||qty<=0)throw new Stop('validation','Informe uma quantidade maior que zero.');if(!(f.reason||'').trim())throw new Stop('validation','Informe o motivo ou a referência da movimentação.');
    let lot=f.lot&&lotOf(S,f.lot);
    if(f.type==='entrada'){if(it.lotc&&!f.newLot&&!lot)throw new Stop('validation','Informe o lote.');
      if(f.newLot){if(!f.exp)throw new Stop('validation','Informe a validade do lote.');lot={id:'l'+uid(),item:it.id,lot:f.newLot,exp:f.exp,qty:0,unit:f.unit||'u1',status:'disponivel'};S.lots.push(lot);}
      if(!lot){lot=S.lots.find(l=>l.item===it.id);}
      lot.qty+=qty;}
    else{if(!lot)throw new Stop('validation','Selecione o lote.');if(lot.qty<qty)throw new Stop('validation',`Saldo insuficiente no lote ${lot.lot}: ${lot.qty} ${it.unit}.`);lot.qty-=qty;}
    S.moves.unshift({id:uid(),at:nowIso(),item:it.id,lot:lot.id,type:f.type,qty,reason:f.reason,ref:{entrada:'Entrada',saida:'Consumo',perda:'Perda',ajuste:'Ajuste de inventário'}[f.type],user:u.name});
    log(S,u,'stock_move','stock',null,f.reason,`${f.type} de ${qty} ${it.unit}: ${it.name} (${lot.lot})`);
    if(itemQty(S,it.id)<it.min)note(S,u,'stock.manage','Estoque baixo',`${it.name}: ${itemQty(S,it.id)} ${it.unit} (mínimo ${it.min}).`,{page:'estoque'});},
  immunize(S,u,f){need(S,u,'vaccines.manage');if(!(f.patient||'').trim())throw new Stop('validation','Informe o paciente.');
    const lot=lotOf(S,f.lot);if(!lot)throw new Stop('validation','Selecione o lote utilizado.');
    if(lot.status!=='disponivel')throw new Stop('blocking','Este lote está em avaliação após ocorrência de temperatura e não pode ser usado.');
    if(lot.exp<today())throw new Stop('blocking','Lote vencido. Selecione outro lote.');if(lot.qty<1)throw new Stop('blocking','Lote sem saldo.');
    if(!f.prof)throw new Stop('validation','Informe o profissional responsável.');
    const im={id:'im'+uid(),at:nowIso(),patient:f.patient.trim(),item:lot.item,lot:lot.id,dose:f.dose,via:f.via,site:f.site,prof:f.prof,unit:lot.unit,status:'registrado'};
    S.imm.unshift(im);lot.qty-=1;S.moves.unshift({id:uid(),at:im.at,item:lot.item,lot:lot.id,type:'saida',qty:1,reason:`Aplicação em ${im.patient}`,ref:'Vacinação',user:u.name});
    log(S,u,'immunize','vaccine',im.id,null,`${itemOf(S,lot.item).name}, lote ${lot.lot}`);},
  immunizeCancel(S,u,id,reason){need(S,u,'vaccines.manage');if(!reason.trim())throw new Stop('validation','Informe o motivo do cancelamento.');
    const im=S.imm.find(x=>x.id===id);if(im.status!=='registrado')return;im.status='cancelado';im.cancelReason=reason;const lot=lotOf(S,im.lot);lot.qty+=1;
    S.moves.unshift({id:uid(),at:nowIso(),item:im.item,lot:im.lot,type:'estorno',qty:1,reason:`Estorno: ${reason}`,ref:'Vacinação',user:u.name});
    log(S,u,'immunize_cancel','vaccine',id,reason,`${itemOf(S,im.item).name}, ${im.patient}`);},
  reading(S,u,eq,temp){need(S,u,'coldchain.manage');const e=S.equip.find(x=>x.id===eq);const t=+String(temp).replace(',','.');
    if(Number.isNaN(t))throw new Stop('validation','Informe a temperatura.');
    S.readings.push({id:uid(),eq,at:nowIso(),temp:t,user:u.name});log(S,u,'reading','cold',null,null,`${e.name}: ${t.toLocaleString('pt-BR')} °C`);
    if(t<e.min||t>e.max){const lots=S.lots.filter(l=>l.unit===e.unit&&itemOf(S,l.item).cat==='Vacina'&&l.status==='disponivel').slice(0,2);
      S.occ.unshift({id:'oc'+uid(),eq,at:nowIso(),temp:t,status:'aberta',action:'',lots:lots.map(l=>l.id),note:null});lots.forEach(l=>l.status='em_avaliacao');
      note(S,u,'coldchain.manage','Ocorrência de temperatura',`${e.name}: ${t.toLocaleString('pt-BR')} °C, fora da faixa ${e.min}–${e.max} °C.`,{page:'temperatura'});return 'fora';}
    return 'ok';},
  occurrence(S,u,id,status,txt){need(S,u,'coldchain.manage');const o=S.occ.find(x=>x.id===id);if(!(txt||'').trim())throw new Stop('validation','Descreva as medidas adotadas ou o parecer técnico.');
    o.status=status;o.action=o.action||txt;o.note=txt;
    if(status==='liberado')o.lots.forEach(l=>{const x=lotOf(S,l);if(x)x.status='disponivel'});
    if(status==='descartado')o.lots.forEach(l=>{const x=lotOf(S,l);if(x){S.moves.unshift({id:uid(),at:nowIso(),item:x.item,lot:x.id,type:'perda',qty:x.qty,reason:'Descarte após ocorrência de temperatura',ref:'Perda',user:u.name});x.qty=0;x.status='bloqueado'}});
    log(S,u,'occurrence','cold',id,txt,{em_avaliacao:'Em avaliação',liberado:'Lotes liberados após avaliação técnica',descartado:'Lotes descartados'}[status]);},
  visit(S,u,f){need(S,u,'homecare.manage');if(!f.patient||!f.prof||!f.date||!f.start)throw new Stop('validation','Preencha paciente, profissional, data e horário.');
    const clash=S.visits.find(v=>v.prof===f.prof&&v.date===f.date&&v.status!=='cancelado'&&v.start<f.end&&v.end>f.start);
    if(clash)throw new Stop('blocking',`${profOf(S,f.prof).name} já tem atendimento das ${clash.start} às ${clash.end} neste dia.`);
    S.visits.push({id:'hv'+uid(),...f,status:'agendado',notes:''});log(S,u,'visit','home',null,null,`${S.patients.find(p=>p.id===f.patient).name}, ${D2(f.date)} ${f.start}`);

  pay(S,u,kind,id){need(S,u,'finance.manage');const x=(kind==='pay'?S.pay:S.rec).find(y=>y.id===id);if(kind==='pay')x.paid=today();else x.received=today();

  bill(S,u,kind,f){need(S,u,'finance.manage');const v=+String(f.value).replace(/\./g,'').replace(',','.');if(!v||v<=0)throw new Stop('validation','Informe um valor válido.');
    if(!f.due)throw new Stop('validation','Informe o vencimento.');if(!(f.who||'').trim()||!(f.what||'').trim())throw new Stop('validation','Preencha todos os campos.');
    if(kind==='pay')S.pay.push({id:'py'+uid(),supplier:f.who,desc:f.what,cat:f.cat||'Outros',value:v,due:f.due,paid:null});
    else S.rec.push({id:'rc'+uid(),payer:f.who,service:f.what,value:v,issued:today(),due:f.due,received:null});
    log(S,u,'bill','finance',null,null,`${kind==='pay'?'Conta a pagar':'Conta a receber'}: ${f.what}, ${BRL(v)}`);},
  talent(S,u,id,st){need(S,u,'talent.manage');const c=S.cands.find(x=>x.id===id);c.status=st;log(S,u,'talent','talent',id,null,`${c.name}: ${st.replace('_',' ')}`);},
  opp(S,u,f){need(S,u,'talent.manage');if(!(f.title||'').trim())throw new Stop('validation','Informe o título da oportunidade.');S.opps.unshift({id:'op'+uid(),...f,slots:+f.slots||1,status:'aberta'});log(S,u,'talent','talent',null,null,'Oportunidade publicada: '+f.title);},

function Spark({vals,min,max,lo,hi,w=220,h=56}){
  if(!vals.length)return null;const a=Math.min(min,...vals),b=Math.max(max,...vals);const y=v=>h-4-(v-a)/(b-a||1)*(h-8);const x=i=>vals.length===1?w/2:i/(vals.length-1)*(w-8)+4;
  return html`<svg viewBox=${`0 0 ${w} ${h}`} className="h-14 w-full" preserveAspectRatio="none" role="img" aria-label="Leituras recentes">
    <rect x="0" y=${y(hi)} width=${w} height=${Math.max(0,y(lo)-y(hi))} fill="rgb(var(--c-lime) / .18)"/>
    <polyline fill="none" stroke="rgb(var(--c-ink))" strokeWidth="2" points=${vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')} vectorEffect="non-scaling-stroke"/>
    ${vals.map((v,i)=>(v<lo||v>hi)&&html`<circle key=${i} cx=${x(i)} cy=${y(v)} r="4" fill="rgb(var(--c-danger))"/>`)}</svg>`;
}

function App(){
  const [S,setS]=useState(()=>load()||seed());
  const [uidv,setUid]=useState(()=>{const v=lsGet(UKEY);return ['ana','marcos','helena','carla','paulo'].includes(v)?v:null});
  const [route,setRoute]=useState(()=>uidv?'app':'landing');
  const [page,setPage]=useState({page:'inicio'});
  const [picker,setPicker]=useState(false);
  const [theme,setThemeS]=useState(()=>lsGet(TKEY)||'system');
  const [toasts,setToasts]=useState([]);
  const u=S.users.find(x=>x.id===uidv)||null;
  useEffect(()=>save(S),[S]);
  useEffect(()=>{if(u&&page.page==='inicio'&&!isManager(S,u))setPage({page:'meu'})},[uidv]);
  const setTheme=t=>{setThemeS(t);lsSet(TKEY,t);if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)};
  const toast=(msg,tone='ok')=>{const id=uid();setToasts(t=>[...t,{id,msg,tone}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),tone==='error'?6000:3400)};
  const run=(fn,msg)=>{try{const D=structuredClone(S);const r=fn(D,u);setS(D);if(msg)toast(typeof msg==='function'?msg(r):msg);return{ok:true,data:r}}
    catch(e){if(e instanceof Stop){if(!e.checks)toast(e.msg,'error');return{ok:false,kind:e.kind,msg:e.msg,checks:e.checks}}console.error(e);toast('Algo deu errado nesta ação.','error');return{ok:false}}};

  const reset=()=>{setS(seed());toast('Demonstração reiniciada com os dados originais.')};
  const value={S,u,run,toast,go,page,login,logout,reset,theme,setTheme,openPicker:()=>setPicker(true),setRoute};
  return html`<${Ctx.Provider} value=${value}>

  const doMove=(s,date,reason)=>{if(dkey(s.start)===date)return;const r=run((D,U)=>A.move(D,U,s.id,date,reason),'Plantão movido.');if(r.ok){setPm(null);setPmR('')}else if(r.checks)setPm({s,date,c:r.checks,blocking:r.kind==='blocking'})};

    ${view==='mes'&&html`<div className="overflow-x-auto rounded-[28px] bg-panel p-3"><div className="grid min-w-[760px] grid-cols-7 gap-1.5">

      ${days.map(d=>{const l=byDay[d]||[];const inM=d.slice(0,7)===anchor.slice(0,7);return html`<div key=${d} ...${dnd(d)} className=${cx('min-h-[116px] rounded-[18px] p-1.5',inM?'bg-panel2':'opacity-50',drag===d&&'ring-2 ring-lime')}>

    ${view==='lista'&&html`<${Card} pad=${false} className="p-4"><${Table} cols=${['Data','Horário','Local','Categoria','Escalados','Situação']} empty="Nenhum plantão com estes filtros" minW=${760}

    :html`<div className="space-y-5">
      <div className="grid gap-2 sm:grid-cols-3">${[['Categoria',s.cat?CAT[s.cat]:'Qualquer'],['Vagas',`${act.length} de ${s.slots} preenchidas`],['Competências',s.comps.join(', ')||'Nenhuma']].map(([k,v])=>html`<div key=${k} className="rounded-[18px] bg-panel2 p-3"><p className="text-[12px] text-faint">${k}</p><p className="mt-0.5 text-sm font-bold">${v}</p></div>`)}</div>
      ${s.notes&&html`<p className="rounded-[18px] bg-panel2 px-4 py-3 text-sm">${s.notes}</p>`}${canc&&html`<p className="rounded-[18px] bg-dangerbg px-4 py-3 text-sm text-danger">Cancelado: ${s.cancelReason}</p>`}
      <section><h3 className="mb-2 text-sm font-bold">Escalados</h3>${act.length===0?html`<p className="text-sm text-soft">Ninguém escalado ainda.</p>`:html`<ul className="space-y-2">${act.map(a=>html`<${Assigned} key=${a.id} a=${a} s=${s} manage=${manage}/>`)}</ul>`}
        ${past.length>0&&html`<p className="mt-2 text-xs text-faint">Saíram da escala: ${past.map(a=>`${profOf(S,a.prof).name} (${AST[a.status][0].toLowerCase()})`).join(', ')}</p>`}</section>
      ${manage&&act.length<s.slots&&html`<${Picker} s=${s}/>`}
      ${manage&&html`<div className="flex flex-wrap gap-2 border-t border-line pt-4"><${Btn} size="sm" icon="pencil" onClick=${onEdit}>Editar<//><${Btn} size="sm" icon="copy" onClick=${()=>setPanel(panel==='dup'?null:'dup')}>Duplicar ou repetir<//>
        ${s.status==='rascunho'&&can(S,u,'shifts.publish',s.unit)&&html`<${Btn} size="sm" v="ink" icon="send" onClick=${()=>run((D,U)=>A.publish(D,U,[s.id]),'Plantão publicado. Os escalados foram avisados.')}>Publicar<//>`}
        <${Btn} size="sm" v="danger" icon="ban" className="ml-auto" onClick=${()=>setPanel(panel==='can'?null:'can')}>Cancelar plantão<//></div>`}

}
function Assigned({a,s,manage}){

  return html`<li className="rounded-[20px] bg-panel2 px-3 py-2.5"><div className="flex flex-wrap items-center gap-2.5"><${Avatar} name=${p.name} size=${32}/><span className="min-w-0"><span className="block text-sm font-bold">${p.name}</span><span className="block text-xs text-faint">${CAT[p.cat]}</span></span><${Badge} tone=${AST[a.status][1]}>${AST[a.status][0]}<//>
    ${manage&&!rm&&html`<button className="ml-auto text-[13px] font-semibold text-soft hover:text-danger" onClick=${()=>setRm(true)}>Remover</button>`}</div>
    ${a.reason&&html`<p className="mt-2 flex items-start gap-1 text-xs text-amber"><${Icon} n="alert" s=${12} className="mt-0.5"/>Exceção autorizada: ${a.reason}</p>`}
    ${rm&&html`<div className="mt-2 flex flex-wrap items-center gap-2">${s.status!=='rascunho'&&html`<input className=${inputCls+' h-9 flex-1 bg-panel py-1'} placeholder="Motivo (obrigatório em escala publicada)" value=${r} onInput=${e=>setR(e.target.value)} aria-label="Motivo"/>`}
      <${Btn} size="sm" onClick=${()=>setRm(false)}>Voltar<//><${Btn} size="sm" v="danger" disabled=${s.status!=='rascunho'&&!r.trim()} onClick=${()=>run((D,U)=>A.unassign(D,U,a.id,r),'Profissional removido do plantão.')}>Remover<//></div>`}</li>`;
}
function Picker({s}){
  const {S,run}=useApp();const [q,setQ]=useState('');const [sel,setSel]=useState(null);const [reason,setReason]=useState('');const [conf,setConf]=useState(false);
  const assigned=new Set(S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).map(a=>a.prof));const rank=c=>c.blocking.length?3:c.warnings.length?2:0;
  const pool=S.profs.filter(p=>p.active&&!assigned.has(p.id)&&(!s.cat||p.cat===s.cat)).map(p=>({p,c:checks(S,s,p.id)})).filter(x=>x.p.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>rank(a.c)-rank(b.c)||a.p.name.localeCompare(b.p.name));
  const cur=sel&&pool.find(x=>x.p.id===sel);
  return html`<section className="rounded-[24px] bg-panel2 p-3">
    <div className="flex flex-wrap items-center justify-between gap-2 px-1 pb-2"><h3 className="text-sm font-bold">Escalar profissional</h3><input className=${inputCls+' h-9 w-48 bg-panel py-1 text-sm'} placeholder="Buscar" aria-label="Buscar profissional" value=${q} onInput=${e=>setQ(e.target.value)}/></div>
    ${pool.length===0?html`<p className="px-1 py-3 text-sm text-soft">Nenhum profissional ${s.cat?'da categoria '+CAT[s.cat].toLowerCase():''} disponível.</p>`:html`<ul className="max-h-72 space-y-1 overflow-y-auto">
      ${pool.map(({p,c})=>{const bl=c.blocking.length>0,is=sel===p.id;return html`<li key=${p.id} className=${cx('rounded-[18px] px-2.5 py-2',is?'bg-panel':'')}>
        <div className="flex items-center gap-2.5"><${Avatar} name=${p.name} size=${30}/><div className="min-w-0 flex-1"><p className="truncate text-sm font-semibold">${p.name}</p></div>
          ${bl?html`<${Badge} tone="danger">Indisponível<//>`:c.warnings.length?html`<${Badge} tone="amber">${c.warnings.length} ${c.warnings.length===1?'alerta':'alertas'}<//>`:html`<${Badge} tone="teal"><${Icon} n="check" s=${12}/>Livre<//>`}
          <${Btn} size="sm" v=${is?'ink':'soft'} className=${is?'':'bg-panel'} disabled=${bl} onClick=${()=>{setSel(is?null:p.id);setReason('')}}>${is?'Selecionado':'Selecionar'}<//></div>
        ${(bl||is)&&html`<div className="pl-10"><${Checks} c=${c} compact/></div>`}</li>`})}</ul>`}
    ${cur&&html`<div className="mt-2 space-y-3 rounded-[18px] bg-panel p-3">${cur.c.warnings.length>0&&html`<${Override} c=${{blocking:[],warnings:cur.c.warnings}} reason=${reason} setReason=${setReason}/>`}
      <label className="flex items-center gap-2 text-sm"><input type="checkbox" className="h-4 w-4 accent-[rgb(var(--c-lime))]" checked=${conf} onChange=${e=>setConf(e.target.checked)}/>Presença já combinada (registrar como confirmado)</label>
      <div className="flex justify-end"><${Btn} size="sm" v="lime" disabled=${cur.c.warnings.length>0&&!reason.trim()} onClick=${()=>{const r=run((D,U)=>A.assign(D,U,s.id,cur.p.id,reason,conf),'Profissional escalado.');if(r.ok){setSel(null);setReason('')}}}>${cur.c.warnings.length?'Autorizar e escalar':'Escalar'}<//></div></div>`}</section>`;
}
function Duplicate({s,onDone}){
  const {run}=useApp();const base=dkey(s.start);const [from,setFrom]=useState(addDays(base,1));const [to,setTo]=useState(addDays(base,7));const [days,setDays]=useState([wdOf(base)]);
  const dates=[];if(from&&to&&to>=from)for(let d=from;d<=to&&dates.length<61;d=addDays(d,1))if(days.includes(wdOf(d))&&d!==base)dates.push(d);
  return html`<div className="rounded-[22px] bg-panel2 p-4"><p className="mb-3 text-sm text-soft">Cria cópias em rascunho, no mesmo horário, sem ninguém escalado.</p>
    <div className="grid gap-3 sm:grid-cols-2"><${Field} label="De" id="dup-from"><input id="dup-from" type="date" className=${inputCls+' bg-panel'} value=${from} onChange=${e=>setFrom(e.target.value)}/><//><${Field} label="Até" id="dup-to"><input id="dup-to" type="date" className=${inputCls+' bg-panel'} value=${to} onChange=${e=>setTo(e.target.value)}/><//></div>
    <div className="mt-3 flex flex-wrap gap-1.5">${[1,2,3,4,5,6,0].map(d=>html`<label key=${d} className=${cx('cursor-pointer rounded-full px-3 py-1.5 text-[13px] font-semibold',days.includes(d)?'bg-lime text-onlime':'bg-panel')}><input type="checkbox" className="sr-only" checked=${days.includes(d)} onChange=${e=>setDays(e.target.checked?[...days,d]:days.filter(x=>x!==d))}/>${WDS[d]}</label>`)}</div>
    <div className="mt-3 flex items-center justify-between gap-2"><span className="text-sm text-soft">${dates.length} ${dates.length===1?'cópia':'cópias'}</span><${Btn} size="sm" v="lime" disabled=${!dates.length} onClick=${()=>{const r=run((D,U)=>A.duplicate(D,U,s.id,dates),n=>`${n} ${n===1?'cópia criada':'cópias criadas'} como rascunho.`);if(r.ok)onDone()}}>Criar cópias<//></div></div>`;
}
function CancelPanel({s,onDone}){
  const {S,run}=useApp();const [r,setR]=useState('');const n=S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).length;

}

/* ------------------------------------------------------------------ gerar escala */
function Gerar(){
  const {S,u,run,go}=useApp();const T=today();const nw=addDays(weekStart(T),7);
  const units=S.units.filter(x=>can(S,u,'shifts.manage',x.id));
  const [from,setFrom]=useState(T);const [to,setTo]=useState(addDays(nw,6));const [unit,setUnit]=useState(u.units?u.units[0]:'');const [allow,setAllow]=useState(false);
  const [prop,setProp]=useState(null);const [reason,setReason]=useState('');
  const gen=()=>{setProp(proposeSchedule(S,u,from,to,unit,allow));setReason('')};
  const filled=prop?prop.filter(x=>x.prof):[],uncovered=prop?prop.filter(x=>!x.prof):[];
  const withW=filled.filter(x=>x.warnings&&x.warnings.length);
  const hrs={};filled.forEach(x=>{const s=shiftOf(S,x.shift);hrs[x.prof]=(hrs[x.prof]||0)+hours(s.start,s.end,s.brk)});
  return html`<div className="space-y-5"><${PageHead} title="Gerar escala" desc="O motor preenche as vagas abertas com quem não tem nenhuma restrição obrigatória e distribui as horas de forma equilibrada. Você revisa antes de aplicar."/>
    <${Card}><div className="grid gap-4 md:grid-cols-[1fr_1fr_1fr_auto] md:items-end">
      <${Field} label="De" id="g-from"><input id="g-from" type="date" className=${inputCls} value=${from} onChange=${e=>setFrom(e.target.value)}/><//>
      <${Field} label="Até" id="g-to"><input id="g-to" type="date" className=${inputCls} value=${to} onChange=${e=>setTo(e.target.value)}/><//>
      <${Field} label="Unidade" id="g-unit"><select id="g-unit" className=${inputCls} value=${unit} onChange=${e=>setUnit(e.target.value)} disabled=${!!u.units}>${!u.units&&html`<option value="">Todas que você gerencia</option>`}${units.map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
      <${Btn} v="lime" size="lg" icon="wand" onClick=${gen}>Gerar proposta<//></div>
      <label className="mt-4 flex items-center gap-2 text-sm"><input type="checkbox" className="h-4 w-4" checked=${allow} onChange=${e=>setAllow(e.target.checked)}/>Aceitar candidatos com alertas (exige justificativa ao aplicar)</label>
      <p className="mt-2 text-xs text-faint">Critérios: categoria e vagas, sobreposição, férias e afastamentos, descanso mínimo de ${S.rules.rest}h, carga semanal de ${S.rules.week}h, disponibilidade, competências e menor carga na semana.</p><//>
    ${prop&&html`<div className="grid gap-3 sm:grid-cols-3"><${Stat} label="Vagas analisadas" value=${prop.length}/><${Stat} label="Preenchidas na proposta" value=${filled.length} tone="teal"/><${Stat} label="Sem candidato possível" value=${uncovered.length} tone=${uncovered.length?'danger':null}/></div>
      <div className="grid gap-5 xl:grid-cols-[1.5fr_1fr]">
        <${Card} title="Proposta" sub="Nada é salvo até você aplicar.">${filled.length===0?html`<${Empty} title="Nenhuma vaga preenchida">Tente aceitar candidatos com alertas ou ampliar o período.<//>`:html`<ul className="space-y-1.5">${filled.map((x,i)=>{const s=shiftOf(S,x.shift),p=profOf(S,x.prof);return html`<li key=${i} className="flex flex-wrap items-center gap-3 rounded-[20px] bg-panel2 px-3 py-2.5">
          <span className="w-36 text-sm font-bold">${cap(F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'}))} ${hm(s.start)}</span><span className="hidden min-w-0 flex-1 truncate text-[13px] text-soft sm:block">${unitOf(S,s.unit).name}${s.service?' / '+servOf(S,s.service).name:''}</span>
          <span className="flex items-center gap-2"><${Avatar} name=${p.name} size=${28}/><span className="text-sm font-semibold">${p.name}</span></span>${x.warnings.length>0&&html`<${Badge} tone="amber">${x.warnings.length} alerta${x.warnings.length>1?'s':''}<//>`}</li>`})}</ul>`}
          ${filled.length>0&&html`<div className="mt-4 space-y-3">${withW.length>0&&html`<${Override} c=${{blocking:[],warnings:[...new Set(withW.flatMap(x=>x.warnings))].slice(0,5)}} reason=${reason} setReason=${setReason}/>`}
            <div className="flex flex-wrap justify-end gap-2"><${Btn} onClick=${()=>setProp(null)}>Descartar<//><${Btn} v="lime" icon="check" disabled=${withW.length>0&&!reason.trim()} onClick=${()=>{const r=run((D,U)=>A.applyProposal(D,U,prop,reason),n=>`${n} profissionais escalados. Confirmações pendentes até publicar.`);if(r.ok){setProp(null);go({page:'escalas',d:from})}}}>Aplicar proposta<//></div></div>`}<//>
        <div className="space-y-5"><${Card} title="Horas por profissional"><${BarList} rows=${Object.entries(hrs).map(([k,v])=>({k:profOf(S,k).name,v})).sort((a,b)=>b.v-a.v)} max=${Math.max(12,...Object.values(hrs))} fmt=${fmtH}/><//>
          <${Card} title="Por que ficaram descobertas">${uncovered.length===0?html`<p className="text-sm text-soft">Todas as vagas do período têm candidato.</p>`:html`<ul className="space-y-2">${uncovered.map((x,i)=>{const s=shiftOf(S,x.shift);return html`<li key=${i} className="rounded-[18px] bg-dangerbg px-3.5 py-2.5"><p className="text-sm font-bold text-danger">${label(s)}, ${unitOf(S,s.unit).name}</p><ul className="mt-1 text-xs text-ink/80">${x.reasons.map((r,j)=>html`<li key=${j}>${r}</li>`)}</ul></li>`})}</ul>`}<//></div></div>`}
  </div>`;
}

/* ------------------------------------------------------------------ solicitações */
function Solicitacoes(){
  const {S,u}=useApp();const [tab,setTab]=useState('pend');
  const mine=S.reqs.filter(r=>can(S,u,'requests.decide',shiftOf(S,r.shift).unit));
  const pend=mine.filter(r=>r.status==='pendente').sort((a,b)=>a.created.localeCompare(b.created));
  const done=mine.filter(r=>r.status!=='pendente').sort((a,b)=>(b.decided||b.created).localeCompare(a.decided||a.created));
  const list=tab==='pend'?pend:done;
  return html`<div><${PageHead} title="Solicitações" desc="Substituições, cancelamentos e alterações pedidos pelos profissionais, e candidaturas a vagas abertas." actions=${html`<${Seg} size="sm" items=${[['pend','Pendentes',pend.length],['done','Analisadas',done.length]]} value=${tab} onChange=${setTab}/>`}/>
    ${list.length===0?html`<${Empty} title=${tab==='pend'?'Nenhuma solicitação pendente':'Nada analisado ainda'}>Entre como Carla Mendes e peça uma substituição para ver o pedido chegar aqui.<//>`:html`<div className="grid gap-4 lg:grid-cols-2">${list.map(r=>html`<${ReqItem} key=${r.id} r=${r} decide=${tab==='pend'}/>`)}</div>`}</div>`;
}
function ReqItem({r,decide}){
  const {S,run}=useApp();const s=shiftOf(S,r.shift),p=profOf(S,r.prof);
  const [mode,setMode]=useState(null);const [n,setN]=useState('');const [sub,setSub]=useState('');const [c,setC]=useState(null);const [bl,setBl]=useState(false);const [reason,setReason]=useState('');
  const cands=S.profs.filter(x=>x.active&&x.id!==r.prof&&(!s.cat||x.cat===s.cat));
  const freed=useMemo(()=>{if(r.kind==='candidatura'||!r.asg)return S;const D=structuredClone(S);const a=D.asg.find(x=>x.id===r.asg);if(a)a.status='removido';return D},[S,r]);
  const st=pid=>{const k=checks(freed,shiftOf(freed,s.id),pid);return k.blocking.length?'b':k.warnings.length?'w':''};
  const subCheck=sub&&r.kind!=='candidatura'?checks(freed,shiftOf(freed,s.id),sub):null;
  const go=ok=>{const x=run((D,U)=>A.decide(D,U,r.id,ok,n,ok?sub||null:null,reason),ok?'Solicitação aprovada.':'Solicitação recusada.');if(!x.ok&&x.checks){setC(x.checks);setBl(x.kind==='blocking')}};
  return html`<article className="rounded-[28px] bg-panel p-5 shadow-[0_1px_0_rgb(var(--c-line))]">
    <div className="flex items-start gap-3"><${Avatar} name=${p.name} size=${44}/><div className="min-w-0 flex-1"><p className="font-bold">${p.name}</p><p className="text-[13px] text-soft">pediu ${RK[r.kind].toLowerCase()}</p></div><${Badge} tone=${RST[r.status][1]}>${RST[r.status][0]}<//></div>
    <div className="mt-4 rounded-[20px] bg-navy p-4 text-onnavy"><p className="text-[12px] opacity-70">${cap(F(s.start,{weekday:'long',day:'2-digit',month:'2-digit'}))}</p><p className="thin text-[30px] leading-tight">${hm(s.start)}–${hm(s.end)}</p><p className="text-[13px] opacity-80">${unitOf(S,s.unit).name}${s.service?' / '+servOf(S,s.service).name:''}</p></div>
    ${r.reason&&html`<p className="mt-3 rounded-[18px] bg-panel2 px-4 py-2.5 text-sm">“${r.reason}”</p>`}${r.note&&html`<p className="mt-2 text-sm text-soft">Resposta${r.by?' de '+r.by:''}: ${r.note}</p>`}
    <p className="mt-2 text-xs text-faint">Enviada em ${F(r.created,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</p>
    ${decide&&!mode&&html`<div className="mt-4 flex gap-2"><${Btn} v="lime" onClick=${()=>setMode('ok')}>Aprovar<//><${Btn} onClick=${()=>setMode('no')}>Recusar<//></div>`}
    ${decide&&mode&&html`<div className="mt-4 space-y-3">
      ${mode==='ok'&&(r.kind==='substituicao'||r.kind==='cancelamento')&&html`<${Field} label="Substituto" id=${'sub'+r.id} hint="Passa pelas mesmas regras da escala."><select id=${'sub'+r.id} className=${inputCls} value=${sub} onChange=${e=>{setSub(e.target.value);setC(null);setReason('')}}>
        <option value="">Sem substituto agora (a vaga fica descoberta)</option>${cands.map(x=>{const k=st(x.id);return html`<option key=${x.id} value=${x.id} disabled=${k==='b'}>${x.name}${k==='b'?' (indisponível)':k==='w'?' (com alertas)':''}</option>`})}</select><//>`}
      ${subCheck&&!c&&html`<${Checks} c=${subCheck}/>`}${mode==='ok'&&r.kind==='alteracao'&&html`<p className="text-sm text-soft">Aprovar registra a decisão. Faça a alteração no calendário.</p>`}
      <${Field} label=${mode==='no'?'Motivo da recusa':'Mensagem ao profissional (opcional)'} id=${'n'+r.id}><textarea id=${'n'+r.id} className=${inputCls+' min-h-[56px]'} value=${n} onInput=${e=>setN(e.target.value)}></textarea><//>
      ${c&&html`<${Override} c=${c} reason=${reason} setReason=${setReason} blocking=${bl}/>`}
      <div className="flex justify-end gap-2"><${Btn} onClick=${()=>{setMode(null);setC(null)}}>Voltar<//>${mode==='ok'?html`<${Btn} v="lime" disabled=${bl||(c&&!reason.trim())} onClick=${()=>go(true)}>${c?'Autorizar e aprovar':'Confirmar aprovação'}<//>`:html`<${Btn} v="danger" disabled=${!n.trim()} onClick=${()=>go(false)}>Confirmar recusa<//>`}</div></div>`}</article>`;
}

/* ------------------------------------------------------------------ profissionais */
function Profissionais(){
  const {S,u,go}=useApp();const [q,setQ]=useState('');const [cat,setCat]=useState('');const [v,setV]=useState('');const [nw,setNw]=useState(false);
  const rows=S.profs.filter(p=>(!q||(p.name+' '+p.num).toLowerCase().includes(q.toLowerCase()))&&(!cat||p.cat===cat)&&(!v||p.validation===v)).sort((a,b)=>a.name.localeCompare(b.name));
  const T=today(),ws=weekStart(T);
  const wh=pid=>S.asg.filter(a=>a.prof===pid&&ACTIVE(a.status)).map(a=>shiftOf(S,a.shift)).filter(s=>s.status!=='cancelado'&&dkey(s.start)>=ws&&dkey(s.start)<addDays(ws,7)).reduce((t,s)=>t+hours(s.start,s.end,s.brk),0);
  return html`<div><${PageHead} title="Profissionais" desc="Equipe assistencial, validação de cadastro, competências e carga da semana." actions=${can(S,u,'professionals.manage')&&html`<${Btn} v="lime" icon="plus" onClick=${()=>setNw(true)}>Novo profissional<//>`}/>
    <div className="mb-4 grid gap-2 sm:grid-cols-[2fr_1fr_1fr]">
      <input id="pq" className=${inputCls+' bg-panel'} placeholder="Buscar por nome ou registro" aria-label="Buscar" value=${q} onInput=${e=>setQ(e.target.value)}/>
      <select id="pc" className=${inputCls+' bg-panel'} aria-label="Categoria" value=${cat} onChange=${e=>setCat(e.target.value)}><option value="">Todas as categorias</option>${Object.entries(CAT).map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select>
      <select id="pv" className=${inputCls+' bg-panel'} aria-label="Validação" value=${v} onChange=${e=>setV(e.target.value)}><option value="">Qualquer validação</option>${Object.entries(VST).map(([k,l])=>html`<option key=${k} value=${k}>${l[0]}</option>`)}</select></div>
    ${rows.length===0?html`<${Empty} title="Nenhum profissional encontrado"/>`:html`<div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">${rows.map(p=>{const h=wh(p.id),lim=p.maxWeek||S.rules.week;return html`<button key=${p.id} onClick=${()=>go({page:'prof',id:p.id})} className=${cx('group rounded-[26px] bg-panel p-5 text-left shadow-[0_1px_0_rgb(var(--c-line))] transition hover:ring-2 hover:ring-lime',!p.active&&'opacity-60')}>
      <div className="flex items-start gap-3"><${Avatar} name=${p.name} size=${46}/><div className="min-w-0 flex-1"><p className="truncate font-bold">${p.name}</p><p className="text-[13px] text-soft">${CAT[p.cat]}</p><p className="text-xs text-faint">${p.council} ${p.num}/${p.uf}</p></div><${Icon} n="ur" className="text-faint group-hover:text-teal"/></div>
      <div className="mt-4 flex flex-wrap gap-1.5"><${Badge} tone=${VST[p.validation][1]}>${VST[p.validation][0]}<//>${!p.active&&html`<${Badge}>Inativo<//>`}${S.users.some(x=>x.prof===p.id)&&html`<${Badge} tone="sky">Usa a Minha área<//>`}</div>
      <div className="mt-4"><div className="mb-1 flex justify-between text-[12px] text-faint"><span>Semana</span><span>${fmtH(h)} de ${fmtH(lim)}</span></div><div className="h-2 rounded-full bg-panel2"><div className=${cx('h-full rounded-full',h>lim?'bg-amber':'bg-lime')} style=${{width:Math.min(100,h/lim*100)+'%'}}></div></div></div></button>`})}</div>`}
    ${nw&&html`<${Modal} open wide onClose=${()=>setNw(false)} title="Novo profissional" desc="O cadastro começa com validação pendente até a verificação dos documentos."><${ProfForm} onDone=${id=>{setNw(false);if(id)go({page:'prof',id})}}/><//>`}</div>`;
}
function ProfForm({p,onDone}){
  const {S,run}=useApp();const [f,setF]=useState(()=>p?{...p,comps:p.comps.join(', ')}:{name:'',cat:'',council:'',num:'',uf:'SP',email:'',phone:'',comps:'',units:[]});
  const [err,setErr]=useState(null);const set=k=>e=>setF({...f,[k]:e.target.value});
  const submit=e=>{e.preventDefault();const r=run((D,U)=>A.saveProf(D,U,{...f,comps:f.comps.split(',').map(x=>x.trim()).filter(Boolean)}),p?'Cadastro atualizado.':'Profissional cadastrado.');if(r.ok)onDone&&onDone(r.data);else setErr(r.msg)};
  return html`<form onSubmit=${submit} className="grid gap-4 sm:grid-cols-6">
    <${Field} label="Nome completo" id="pf-n" className="sm:col-span-4"><input id="pf-n" required className=${inputCls} value=${f.name} onInput=${set('name')}/><//>
    <${Field} label="Categoria" id="pf-c" className="sm:col-span-2"><select id="pf-c" required className=${inputCls} value=${f.cat} onChange=${e=>setF({...f,cat:e.target.value,council:COUNCIL[e.target.value]||''})}><option value="" disabled>Selecione</option>${Object.entries(CAT).map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select><//>
    <${Field} label="E-mail" id="pf-e" className="sm:col-span-3"><input id="pf-e" type="email" className=${inputCls} value=${f.email} onInput=${set('email')}/><//>
    <${Field} label="Telefone" id="pf-t" className="sm:col-span-3"><input id="pf-t" className=${inputCls} value=${f.phone} onInput=${set('phone')}/><//>
    <${Field} label="Conselho" id="pf-co" className="sm:col-span-2"><input id="pf-co" className=${inputCls} value=${f.council} onInput=${set('council')}/><//>
    <${Field} label="Número do registro" id="pf-nu" className="sm:col-span-3"><input id="pf-nu" className=${inputCls} value=${f.num} onInput=${set('num')}/><//>
    <${Field} label="UF" id="pf-uf" className="sm:col-span-1"><input id="pf-uf" maxLength="2" className=${inputCls+' uppercase'} value=${f.uf} onInput=${set('uf')}/><//>
    <${Field} label="Competências" id="pf-cp" hint="Separe por vírgula. São comparadas com as exigidas em cada plantão." className="sm:col-span-6"><input id="pf-cp" className=${inputCls} value=${f.comps} onInput=${set('comps')}/><//>
    <fieldset className="sm:col-span-6"><legend className="mb-1.5 text-[13px] font-semibold text-soft">Unidades em que atua (vazio = qualquer)</legend><div className="flex flex-wrap gap-2">${S.units.map(x=>html`<label key=${x.id} className=${cx('cursor-pointer rounded-full px-3.5 py-1.5 text-sm font-semibold',f.units.includes(x.id)?'bg-lime text-onlime':'bg-panel2')}><input type="checkbox" className="sr-only" checked=${f.units.includes(x.id)} onChange=${e=>setF({...f,units:e.target.checked?[...f.units,x.id]:f.units.filter(y=>y!==x.id)})}/>${x.name}</label>`)}</div></fieldset>
    ${err&&html`<p role="alert" className="rounded-2xl bg-dangerbg px-4 py-2.5 text-sm text-danger sm:col-span-6">${err}</p>`}
    <div className="flex justify-end sm:col-span-6"><${Btn} type="submit" v="lime">${p?'Salvar alterações':'Cadastrar profissional'}<//></div></form>`;
}

  return html`<div className="space-y-5"><${PageHead} back=${()=>go({page:'profissionais'})} title=${p.name} desc=${`${CAT[p.cat]}, ${p.council} ${p.num}/${p.uf}`}
    actions=${html`${can(S,u,'documents.verify')&&html`<select id="val" aria-label="Validação" className=${inputCls+' h-10 w-48 bg-panel py-1.5'} value=${p.validation} onChange=${e=>run((D,U)=>A.validate(D,U,id,e.target.value),'Situação de validação atualizada.')}>${Object.entries(VST).map(([k,l])=>html`<option key=${k} value=${k}>${l[0]}</option>`)}</select>`}

    <div className="grid gap-3 sm:grid-cols-4">${[['Validação',html`<${Badge} tone=${VST[p.validation][1]}>${VST[p.validation][0]}<//>`],['E-mail',p.email||'Não informado'],['Telefone',p.phone||'Não informado'],['Unidades',p.units.length?p.units.map(x=>unitOf(S,x).name).join(', '):'Qualquer unidade']].map(([k,v])=>html`<div key=${k} className="rounded-[22px] bg-panel p-4 shadow-[0_1px_0_rgb(var(--c-line))]"><p className="text-[12px] text-faint">${k}</p><div className="mt-1 truncate text-sm font-semibold">${v}</div></div>`)}</div>
    <${Card} title="Competências"><div className="flex flex-wrap gap-2">${p.comps.length?p.comps.map(c=>html`<${Badge} key=${c} tone="ink" className="px-3 py-1 text-[13px]">${c}<//>`):html`<span className="text-sm text-soft">Não informadas</span>`}</div><//>

        <${Card} title="Plantões recentes">${asg.length===0?html`<p className="text-sm text-soft">Nenhum plantão atribuído.</p>`:html`<ul className="space-y-1.5">${asg.map(({a,s})=>html`<li key=${a.id}><button onClick=${()=>go({page:'escalas',shift:s.id,d:dkey(s.start)})} className="flex w-full items-center gap-3 rounded-[18px] bg-panel2 px-3.5 py-2.5 text-left text-sm hover:ring-2 hover:ring-lime">
          <span className="w-40 shrink-0 font-semibold">${cap(F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'}))} ${hm(s.start)}</span><span className="min-w-0 flex-1 truncate text-soft">${unitOf(S,s.unit).name}</span><${Badge} tone=${AST[a.status][1]}>${AST[a.status][0]}<//></button></li>`)}</ul>`}<//></div></div>
    ${edit&&html`<${Modal} open wide onClose=${()=>setEdit(false)} title="Editar cadastro"><${ProfForm} p=${p} onDone=${()=>setEdit(false)}/><//>`}</div>`;

function Avail({p,readOnly}){
  const {run}=useApp();const [slots,setSlots]=useState(p.avail.map(x=>({...x})));const [max,setMax]=useState(p.maxWeek||'');const [dirty,setDirty]=useState(false);
  const upd=fn=>{setSlots(fn);setDirty(true)};
  return html`<div className="space-y-4"><p className="text-sm text-soft">Disponibilidade não é escala: alterar aqui não muda plantões já publicados.</p>
    <div className="space-y-1.5">${[1,2,3,4,5,6,0].map(w=>{const ds=slots.map((s,i)=>({s,i})).filter(x=>x.s.wd===w);return html`<div key=${w} className="flex flex-wrap items-center gap-2 rounded-[18px] bg-panel2 px-3 py-2">
      <span className="w-20 text-sm font-bold">${WD[w]}</span>${!ds.length&&html`<span className="text-sm text-faint">Indisponível</span>`}
      ${ds.map(({s,i})=>html`<span key=${i} className="inline-flex items-center gap-1 rounded-full bg-panel px-2.5 py-1">
        <input type="time" aria-label="Início" className="w-[5.4rem] bg-transparent text-sm" disabled=${readOnly} value=${s.s} onChange=${e=>upd(xs=>xs.map((x,j)=>j===i?{...x,s:e.target.value}:x))}/><span className="text-faint">às</span>
        <input type="time" aria-label="Término" className="w-[5.4rem] bg-transparent text-sm" disabled=${readOnly} value=${s.e} onChange=${e=>upd(xs=>xs.map((x,j)=>j===i?{...x,e:e.target.value}:x))}/>
        ${!readOnly&&html`<button className="text-faint hover:text-danger" aria-label="Remover faixa" onClick=${()=>upd(xs=>xs.filter((_,j)=>j!==i))}><${Icon} n="x" s=${14}/></button>`}</span>`)}
      ${!readOnly&&html`<button className="ml-auto inline-flex items-center gap-1 rounded-full bg-panel px-3 py-1 text-[13px] font-semibold hover:bg-lime hover:text-onlime" onClick=${()=>upd(xs=>[...xs,{wd:w,s:'07:00',e:'19:00'}])}><${Icon} n="plus" s=${12}/>Faixa</button>`}</div>`})}</div>
    <div className="flex flex-wrap items-end gap-3"><${Field} label="Carga semanal máxima (h)" id=${'mx'+p.id} hint="Vazio = referência da instituição."><input id=${'mx'+p.id} type="number" min="1" max="168" disabled=${readOnly} className=${inputCls+' w-40'} value=${max} onInput=${e=>{setMax(e.target.value);setDirty(true)}}/><//>
      ${!readOnly&&html`<${Btn} v="lime" className="ml-auto" disabled=${!dirty} onClick=${()=>{const r=run((D,U)=>A.availability(D,U,p.id,slots,+max||null),'Disponibilidade salva. Plantões publicados não mudaram.');if(r.ok)setDirty(false)}}>Salvar disponibilidade<//>`}</div></div>`;
}
function Absences({p,readOnly}){
  const {S,run}=useApp();const list=S.abs.filter(a=>a.prof===p.id).sort((a,b)=>b.from.localeCompare(a.from));

  return html`<div className="space-y-4">${list.length===0?html`<p className="text-sm text-soft">Nenhum período registrado.</p>`:html`<ul className="space-y-1.5">${list.map(a=>html`<li key=${a.id} className="flex items-center gap-3 rounded-[18px] bg-panel2 px-3.5 py-2.5 text-sm">
      <${Badge} tone=${a.kind==='indisponivel'?'amber':'sky'}>${ABS[a.kind]}<//><span>${D2(a.from)} a ${F(a.to,{day:'2-digit',month:'2-digit',year:'numeric'})}</span>${a.note&&html`<span className="hidden truncate text-faint sm:inline">${a.note}</span>`}
      ${!readOnly&&html`<button className="ml-auto text-faint hover:text-danger" aria-label="Remover período" onClick=${()=>run((D,U)=>A.absenceRm(D,U,a.id),'Período removido.')}><${Icon} n="trash"/></button>`}</li>`)}</ul>`}
    ${!readOnly&&html`<div className="grid gap-3 rounded-[22px] bg-panel2 p-3 sm:grid-cols-3">
      <${Field} label="Tipo" id=${'ak'+p.id}><select id=${'ak'+p.id} className=${inputCls+' bg-panel'} value=${k} onChange=${e=>setK(e.target.value)}>${Object.entries(ABS).map(([x,l])=>html`<option key=${x} value=${x}>${l}</option>`)}</select><//>
      <${Field} label="De" id=${'af'+p.id}><input id=${'af'+p.id} type="date" className=${inputCls+' bg-panel'} value=${from} onChange=${e=>{setFrom(e.target.value);if(!to)setTo(e.target.value)}}/><//>
      <${Field} label="Até" id=${'at'+p.id}><input id=${'at'+p.id} type="date" className=${inputCls+' bg-panel'} value=${to} onChange=${e=>setTo(e.target.value)}/><//>
      <${Field} label="Observação" id=${'an'+p.id} className="sm:col-span-2"><input id=${'an'+p.id} className=${inputCls+' bg-panel'} value=${n} onInput=${e=>setN(e.target.value)}/><//>
      <div className="flex items-end"><${Btn} v="lime" className="w-full" disabled=${!from||!to} onClick=${()=>{const r=run((D,U)=>A.absence(D,U,p.id,k,from,to,n),'Período registrado. Plantões publicados não mudam: peça substituição se precisar.');if(r.ok){setFrom('');setTo('');setN('')}}}>Registrar<//></div></div>`}
    <p className="text-xs text-faint">Férias, licenças e afastamentos impedem novas escalas. “Indisponível” só gera alerta para a gestão.</p></div>`;
}

  const {S,u,run}=useApp();const [st,setSt]=useState(S.rolePerms);const [dirty,setDirty]=useState(false);const roles=['admin','gestor','rt'];let last='';
  return html`<div className="space-y-5"><${PageHead} title="Equipe e acessos" desc="Quem acessa a MedLink e o que cada perfil pode fazer."/>

      footer=${html`<${Btn} onClick=${()=>setCancel(null)}>Voltar<//><${Btn} v="danger" disabled=${!cr.trim()} onClick=${()=>{const r=run((D,U)=>A.immunizeCancel(D,U,cancel.id,cr),'Aplicação cancelada e estoque estornado.');if(r.ok)setCancel(null)}}>Cancelar aplicação<//>`}>

/* ------------------------------------------------------------------ relatórios */
function Relatorios(){
  const {S,u}=useApp();const T=today(),ws=weekStart(T);const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  const vis=visibleShifts(S,u).filter(s=>s.status!=='cancelado'&&s.status!=='rascunho');
  const cov=days.map(d=>{const l=vis.filter(s=>dkey(s.start)===d);let c=0,p=0,o=0;l.forEach(s=>{const a=S.asg.filter(x=>x.shift===s.id&&ACTIVE(x.status));const cf=a.filter(x=>x.status==='confirmado').length;c+=Math.min(cf,s.slots);p+=Math.min(a.length-cf,s.slots-cf);o+=Math.max(0,s.slots-a.length)});return{d,c,p,o}});
  const maxC=Math.max(1,...cov.map(x=>x.c+x.p+x.o));
  const hrs={};const cost={};vis.filter(s=>dkey(s.start)>=ws&&dkey(s.start)<addDays(ws,7)).forEach(s=>S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).forEach(a=>{const p=profOf(S,a.prof),h=hours(s.start,s.end,s.brk);hrs[p.name]=(hrs[p.name]||0)+h;cost[p.cat]=(cost[p.cat]||0)+h*(S.rates[p.cat]||0)}));
  const totalCost=Object.values(cost).reduce((t,v)=>t+v,0);
  const byVac={};S.imm.filter(i=>i.status==='registrado').forEach(i=>{const n=itemOf(S,i.item).name.replace('Vacina ','');byVac[n]=(byVac[n]||0)+1});
  const rec=S.rec.reduce((t,x)=>t+x.value,0),pay=S.pay.reduce((t,x)=>t+x.value,0);
  return html`<div className="space-y-5"><${PageHead} title="Relatórios" desc="Indicadores calculados a partir dos dados da demonstração."/>

      <label htmlFor=${'r-'+k} className="text-[13px] font-semibold text-soft">${l}</label><div className="mt-2 flex items-end gap-2"><input id=${'r-'+k} type="number" min=${mi} max=${ma} className="thin w-28 bg-transparent text-[48px] leading-none focus:outline-none" value=${r[k]} onInput=${e=>setR({...r,[k]:e.target.value})}/><span className="pb-2 text-xl text-faint">${un}</span></div>

function Notificacoes(){
  const {S,u,run,go}=useApp();const list=S.notifs.filter(n=>n.user===u.id);const unread=list.filter(n=>!n.read).length;
  return html`<div><${PageHead} title="Notificações" desc="Avisos deste perfil." actions=${unread>0&&html`<${Btn} onClick=${()=>run((D,U)=>A.readAll(D,U),'Notificações marcadas como lidas.')}>Marcar todas como lidas<//>`}/>
    ${list.length===0?html`<${Empty} title="Nenhuma notificação">Avisos de escala, solicitações e alertas aparecem aqui.<//>`:html`<ul className="space-y-2">${list.map(n=>html`<li key=${n.id}><button className="flex w-full items-start gap-3 rounded-[24px] bg-panel p-4 text-left shadow-[0_1px_0_rgb(var(--c-line))] transition hover:ring-2 hover:ring-lime" onClick=${()=>{run((D,U)=>A.read(D,U,n.id));n.link&&go(n.link)}}>
      <span className=${cx('grid h-10 w-10 shrink-0 place-items-center rounded-full',n.read?'bg-panel2 text-faint':'bg-lime text-onlime')}><${Icon} n="bell" s=${16}/></span>

}

function Manual({publicMode}){
  const {S,u,go}=useApp();const [q,setQ]=useState('');const [sel,setSel]=useState('inicio');
  const list=MANUAL.filter(m=>!q||(m.t+m.intro+m.steps.join(' ')).toLowerCase().includes(q.toLowerCase()));
  const cur=MANUAL.find(m=>m.id===sel)||list[0];
  const canOpen=m=>!publicMode&&u&&m.page&&navFor(S,u).some(g=>g.items.some(i=>i[0]===m.page));
  return html`<div className="space-y-5">${!publicMode&&html`<${PageHead} title="Manual de uso" desc="Como usar cada módulo da MedLink, passo a passo."/>`}
    <div className="grid gap-5 lg:grid-cols-[300px_1fr]">
      <aside className="space-y-3 lg:sticky lg:top-24 lg:self-start"><input id="man-q" className=${inputCls+' bg-panel'} placeholder="Buscar no manual" aria-label="Buscar no manual" value=${q} onInput=${e=>setQ(e.target.value)}/>
        <nav className="rounded-[26px] bg-panel p-2 shadow-[0_1px_0_rgb(var(--c-line))]">${list.map(m=>html`<button key=${m.id} onClick=${()=>setSel(m.id)} className=${cx('flex w-full items-center gap-3 rounded-full px-3 py-2 text-left text-sm font-semibold transition',cur&&cur.id===m.id?'bg-lime text-onlime':'hover:bg-panel2')}>
          <${Icon} n=${m.ic} s=${16}/>${m.t}</button>`)}${!list.length&&html`<p className="p-3 text-sm text-soft">Nada encontrado.</p>`}</nav></aside>
      ${cur&&html`<article className="anim rounded-[30px] bg-panel p-6 shadow-[0_1px_0_rgb(var(--c-line))] sm:p-8" key=${cur.id}>
        <div className="flex flex-wrap items-start justify-between gap-4"><div><${Badge} tone="lime">${cur.who}<//><h2 className="thin mt-3 text-[38px] leading-tight">${cur.t}</h2><p className="mt-2 max-w-2xl text-[16px] text-soft">${cur.intro}</p></div>
          ${canOpen(cur)&&html`<${Btn} v="ink" icon="ur" onClick=${()=>go({page:cur.page})}>Abrir módulo<//>`}</div>
        <ol className="mt-6 space-y-2.5">${cur.steps.map((s,i)=>html`<li key=${i} className="flex items-start gap-4 rounded-[22px] bg-panel2 p-4"><span className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-navy text-sm font-bold text-onnavy">${i+1}</span><span className="pt-1.5 text-[15px]">${s}</span></li>`)}</ol>

}
