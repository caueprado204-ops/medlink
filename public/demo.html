<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MedLink Demonstração</title>
<meta name="description" content="Demonstração navegável da MedLink com perfis de teste e dados fictícios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: app de gestão com barra lateral azul-marinho, área de trabalho clara e cartões de plantão com faixa de status. */
:root{
  --c-bg:245 247 250; --c-panel:255 255 255; --c-line:226 231 238; --c-ink:19 34 51; --c-soft:74 90 108; --c-faint:117 130 146;
  --c-navy:22 50 79; --c-teal:15 118 110; --c-tealsoft:236 248 246; --c-mint:209 250 229; --c-sky:224 242 254; --c-skyink:7 89 133;
  --c-amber:180 83 9; --c-amberbg:254 243 199; --c-danger:180 35 24; --c-dangerbg:254 228 226;
  --c-side:22 50 79; --c-sideink:201 215 230; --c-onaccent:255 255 255; --c-onnavy:255 255 255;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --c-bg:11 21 32; --c-panel:17 30 44; --c-line:38 55 74; --c-ink:226 233 241; --c-soft:165 180 197; --c-faint:122 139 158;
  --c-navy:214 228 242; --c-teal:52 186 170; --c-tealsoft:14 50 50; --c-mint:18 66 55; --c-sky:16 45 66; --c-skyink:140 200 240;
  --c-amber:245 176 76; --c-amberbg:58 40 12; --c-danger:248 120 108; --c-dangerbg:68 22 20;
  --c-side:8 17 27; --c-sideink:170 190 210; --c-onaccent:5 30 28; --c-onnavy:11 21 32; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --c-bg:11 21 32; --c-panel:17 30 44; --c-line:38 55 74; --c-ink:226 233 241; --c-soft:165 180 197; --c-faint:122 139 158;
  --c-navy:214 228 242; --c-teal:52 186 170; --c-tealsoft:14 50 50; --c-mint:18 66 55; --c-sky:16 45 66; --c-skyink:140 200 240;
  --c-amber:245 176 76; --c-amberbg:58 40 12; --c-danger:248 120 108; --c-dangerbg:68 22 20;
  --c-side:8 17 27; --c-sideink:170 190 210; --c-onaccent:5 30 28; --c-onnavy:11 21 32; color-scheme:dark;
}
html,body{height:100%}
body{background:rgb(var(--c-bg));color:rgb(var(--c-ink));font-family:var(--font-ui);font-size:15px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid rgb(var(--c-teal));outline-offset:2px;border-radius:4px}
dialog::backdrop{background:rgb(11 21 32 / .45)}
@keyframes slidein{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.anim{animation:slidein .16s ease-out}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#root{min-height:100%}
#boot{padding:48px 16px;color:rgb(var(--c-soft))}

  const now=Date.now();
  for(let d=0;d<14;d++){
    const k=addDays(W0,d); if(wdOf(k)===0) continue;
    const next=d>=7, past=t=>new Date(at(k,t)).getTime()<now;
    // Matriz manhã
    const a=mk({unit:'u1',service:'s1',start:at(k,'07:00'),end:at(k,'13:00'),cat:'tecnico_enfermagem',slots:1,comps:['Sala de vacinação']});
    const ta=tech[d%4];
    if(!(next&&ta==='p4')&&!(d===3)) as(a,ta, past('13:00')?'confirmado': (ta==='p1'?'aguardando_confirmacao':(next?'aguardando_confirmacao':'confirmado')));
    // Matriz tarde (enfermagem)
    const b=mk({unit:'u1',service:'s2',start:at(k,'13:00'),end:at(k,'19:00'),cat:'enfermeiro',slots:1,status:next&&d>=9?'rascunho':'publicado'});
    as(b,nurse[d%3], past('19:00')?'confirmado':(nurse[d%3]==='p5'&&!next?'aguardando_confirmacao':'confirmado'));
    // Taquaral
    if(wdOf(k)!==6){
      const c=mk({unit:'u2',service:'s3',start:at(k,'08:00'),end:at(k,'14:00'),cat:'tecnico_enfermagem',slots:2,comps:['Sala de vacinação'],status:next?'rascunho':'publicado'});
      const t1=tech[(d+1)%4]; if(!(next&&t1==='p4')) as(c,t1,'confirmado');
      if(d%3!==0){const t2=tech[(d+2)%4]; if(!(next&&t2==='p4')) as(c,t2,past('14:00')?'confirmado':'confirmado');}
    }
  }

  const fut=S.asg.filter(a=>a.prof==='p2'&&ACTIVE(a.status)).map(a=>({a,s:S.shifts.find(s=>s.id===a.shift)})).filter(x=>x.s.status!=='rascunho'&&new Date(x.s.start)>new Date(Date.now()+864e5)).sort((x,y)=>x.s.start.localeCompare(y.s.start))[0];

  // Notificações iniciais
  const carlaPend=S.asg.find(a=>a.prof==='p1'&&a.status==='aguardando_confirmacao');
  if(carlaPend){const s=S.shifts.find(x=>x.id===carlaPend.shift);push(S,'carla','Novo plantão na sua escala',`${F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'})} às ${hm(s.start)}. Confirme sua presença.`,{page:'meu'});}
  push(S,'helena','Cadastro aguardando validação','Bruno Tavares enviou o cadastro profissional.',{page:'prof',id:'p8'});
  // Auditoria inicial
  const t0=new Date(Date.now()-2*864e5).toISOString();
  S.audit.push({id:uid(),at:t0,actor:'Ana Ribeiro',action:'institution',entity:'inst',ref:null,reason:null,detail:'Clínica Vida Vacinas'});
  S.audit.push({id:uid(),at:new Date(Date.now()-864e5).toISOString(),actor:'Marcos Lima',action:'publish',entity:'shift',ref:null,reason:null,detail:'Escala da semana publicada'});

}

class Stop{constructor(kind,msg,checks){this.kind=kind;this.msg=msg;this.checks=checks}}
const shiftOf=(S,id)=>S.shifts.find(s=>s.id===id);
const profOf=(S,id)=>S.profs.find(p=>p.id===id);
const unitOf=(S,id)=>S.units.find(u=>u.id===id);
const servOf=(S,id)=>S.services.find(u=>u.id===id);
function recompute(S,sid){
  const s=shiftOf(S,sid); if(!s||s.status==='rascunho'||s.status==='cancelado') return s&&s.status;
  const a=S.asg.filter(x=>x.shift===sid);
  const act=a.filter(x=>ACTIVE(x.status)).length, pend=a.filter(x=>x.status==='aguardando_confirmacao').length, sub=a.filter(x=>x.status==='substituicao_solicitada').length;
  s.status= sub?'substituicao_solicitada': act<s.slots?'descoberto': pend?'aguardando_confirmacao':'confirmado';
  return s.status;
}
function checks(S,sh,pid,o={}){
  const B=[],W=[],p=profOf(S,pid); if(!p) return {blocking:['Profissional não encontrado.'],warnings:[]};
  const start=o.start||sh.start,end=o.end||sh.end,s0=+new Date(start),e0=+new Date(end);
  if(sh.status==='cancelado')B.push('Plantão cancelado.');
  if(!p.active)B.push('Profissional inativo.');
  if(p.validation==='rejeitado')B.push('Cadastro rejeitado na validação.');
  if(sh.cat&&sh.cat!==p.cat)B.push(`Este plantão exige ${CAT[sh.cat].toLowerCase()}.`);
  const act=S.asg.filter(a=>a.shift===sh.id&&ACTIVE(a.status));
  if(act.some(a=>a.prof===pid&&a.id!==o.ignore))B.push('Profissional já está neste plantão.');
  if(!o.ignore&&act.length>=sh.slots)B.push('Todas as vagas deste plantão já estão preenchidas.');
  const mine=S.asg.filter(a=>a.prof===pid&&ACTIVE(a.status)&&a.id!==o.ignore).map(a=>shiftOf(S,a.shift)).filter(s=>s&&s.id!==sh.id&&s.status!=='cancelado');
  const rest=S.rules.rest*36e5;
  mine.forEach(s=>{const a=+new Date(s.start),b=+new Date(s.end);
    if(a<e0&&b>s0)B.push(`Sobrepõe outro plantão em ${unitOf(S,s.unit).name} (${F(s.start,{day:'2-digit',month:'2-digit'})}, ${hm(s.start)}–${hm(s.end)}).`);
    else if(b>s0-rest&&a<e0+rest)W.push(`Descanso menor que ${S.rules.rest}h em relação ao plantão de ${F(s.start,{day:'2-digit',month:'2-digit'})} às ${hm(s.start)}.`);});
  S.abs.filter(x=>x.prof===pid&&x.from<=dkey(end)&&x.to>=dkey(start)).forEach(x=>{
    const per=`${F(x.from,{day:'2-digit',month:'2-digit'})} a ${F(x.to,{day:'2-digit',month:'2-digit'})}`;
    if(x.kind==='indisponivel')W.push(`Marcou indisponibilidade de ${per}.`); else B.push(`Em ${ABS[x.kind].toLowerCase()} de ${per}.`);});
  const miss=(sh.comps||[]).filter(c=>!p.comps.includes(c));
  if(miss.length)W.push('Competências não registradas: '+miss.join(', ')+'.');
  if(p.validation==='pendente'||p.validation==='em_analise')W.push('Cadastro profissional ainda não validado.');
  if(p.units.length&&!p.units.includes(sh.unit))W.push('Unidade fora das informadas pelo profissional.');
  if(p.avail.length){const w=new Date(start).getDay(),hs=hm(start),he=hm(end);
    const ok=p.avail.some(v=>v.wd===w&&v.s<=hs&&(v.e>v.s?(dkey(end)===dkey(start)&&v.e>=he):true));
    if(!ok)W.push('Fora da disponibilidade informada pelo profissional.');}
  const ws=weekStart(dkey(start)),we=addDays(ws,7);
  let wh=mine.filter(s=>dkey(s.start)>=ws&&dkey(s.start)<we).reduce((t,s)=>t+hours(s.start,s.end,s.brk),0)+hours(start,end,sh.brk);
  const lim=p.maxWeek||S.rules.week; if(wh>lim)W.push(`Carga na semana chegaria a ${fmtH(wh)} (referência: ${fmtH(lim)}).`);
  return {blocking:B,warnings:W};
}
function enforce(c,reason){
  if(c.blocking.length) throw new Stop('blocking',c.blocking[0],c);
  if(c.warnings.length&&!(reason||'').trim()) throw new Stop('warning','Esta alteração gera alertas. Informe uma justificativa para autorizar a exceção.',c);
}
function push(S,userId,title,body,link){S.notifs.unshift({id:uid(),user:userId,title,body,link,read:false,at:nowIso()})}

function noteProf(S,actor,pid,title,body){const u=S.users.find(x=>x.prof===pid);if(u&&u.id!==(actor&&actor.id))push(S,u.id,title,body,{page:'meu'})}
function log(S,u,action,entity,ref,reason,detail){S.audit.unshift({id:uid(),at:nowIso(),actor:u?u.name:'Sistema',action,entity,ref,reason:reason||null,detail:detail||null})}
const label=(S,s)=>`${F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'})}, ${hm(s.start)}–${hm(s.end)}`;

    const dur=hours(start,end,0); if(dur>S.rules.maxShift) throw new Stop('validation',`Duração acima do máximo configurado (${S.rules.maxShift}h).`);

  duplicate(S,u,id,dates){const s=shiftOf(S,id);need(S,u,'shifts.manage',s.unit);let n=0;

    const p=profOf(S,pid);p.avail=slots;p.maxWeek=maxWeek||null;log(S,u,'availability','prof',pid,null,p.name);},
  absence(S,u,pid,kind,from,to,noteTxt){if(!(u.prof===pid||can(S,u,'professionals.manage')))throw new Stop('permission','Sem permissão.');
    if(!from||!to)throw new Stop('validation','Informe as datas.');if(to<from)throw new Stop('validation','A data final deve ser igual ou posterior à inicial.');
    S.abs.push({id:uid(),prof:pid,kind,from,to,note:noteTxt});log(S,u,'absence','prof',pid,null,`${ABS[kind]}: ${F(from,{day:'2-digit',month:'2-digit'})} a ${F(to,{day:'2-digit',month:'2-digit'})}`);},
  absenceRm(S,u,id){const x=S.abs.find(a=>a.id===id);if(!(u.prof===x.prof||can(S,u,'professionals.manage')))throw new Stop('permission','Sem permissão.');S.abs=S.abs.filter(a=>a.id!==id);log(S,u,'absence_rm','prof',x.prof,null,ABS[x.kind]);},
  rules(S,u,r){need(S,u,'institution.manage');S.rules={rest:+r.rest,week:+r.week,maxShift:+r.maxShift};log(S,u,'rules','inst',null,null,`Descanso ${r.rest}h, semana ${r.week}h, máximo ${r.maxShift}h`);},
  perms(S,u,role,list){need(S,u,'members.manage');if(role==='admin')throw new Stop('permission','As permissões da administradora não podem ser alteradas.');S.rolePerms[role]=list;log(S,u,'perms','inst',null,null,ROLE[role]);},
  readAll(S,u){S.notifs.forEach(n=>{if(n.user===u.id)n.read=true})},
  read(S,u,id){const n=S.notifs.find(x=>x.id===id);if(n)n.read=true},
};

function Pips({S,s,sm}){

function App(){

  const [uid_,setUid]=useState(()=>{const v=loadUser();return v&&['ana','marcos','helena','carla','paulo'].includes(v)?v:null});
  const [page,setPage]=useState({page:'painel'});
  const [toasts,setToasts]=useState([]);
  const u=S.users.find(x=>x.id===uid_)||null;
  useEffect(()=>save(S),[S]);
  const toast=(msg,tone='success')=>{const id=uid();setToasts(t=>[...t,{id,msg,tone}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),tone==='error'?6000:3500)};
  const run=(fn,msg)=>{try{const D=structuredClone(S);const r=fn(D,u);setS(D);if(msg)toast(typeof msg==='function'?msg(r):msg);return {ok:true,data:r}}
    catch(e){if(e instanceof Stop){if(!e.checks)toast(e.msg,'error');return {ok:false,kind:e.kind,msg:e.msg,checks:e.checks}}console.error(e);toast('Algo deu errado nesta ação.','error');return {ok:false}}};
  const go=p=>{setPage(p);window.scrollTo(0,0)};
  const login=id=>{saveUser(id);setUid(id);const usr=S.users.find(x=>x.id===id);setPage({page:usr.role==='prof'?'meu':'painel'})};
  const logout=()=>{saveUser(null);setUid(null)};
  const reset=()=>{const s=seed();setS(s);toast('Demonstração reiniciada com os dados originais.')};
  const value={S,u,run,toast,go,page,login,logout,reset};
  return html`<${Ctx.Provider} value=${value}>
    ${u?html`<${Shell}/>`:html`<${Login}/>`}
    <div aria-live="polite" className="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[min(24rem,calc(100%-2rem))] flex-col gap-2">

}

        <span className="hidden text-sm text-soft sm:inline">Você está como <strong className="font-semibold text-ink">${u.name}</strong>, ${ROLE[u.role].toLowerCase()}</span>
        <div className="ml-auto flex items-center gap-1">
          <button onClick=${()=>go({page:'notificacoes'})} className="relative rounded p-2 text-soft hover:bg-bg hover:text-navy" aria-label=${'Notificações'+(unread?`, ${unread} não lidas`:'')}>
            <${Icon} n="bell" s=${20}/>${unread>0&&html`<span className="absolute right-1 top-1 min-w-[1.1rem] rounded-full bg-danger px-1 text-center text-[0.65rem] font-semibold leading-[1.1rem] text-white">${unread>9?'9+':unread}</span>`}</button>
          <${Button} size="sm" icon="out" onClick=${logout}>Trocar perfil<//>
        </div>
      </header>
      <main className="mx-auto max-w-[1400px] px-4 py-6 lg:px-8 lg:py-8"><${Router}/></main>
    </div></div>`;
}
function Router(){
  const {page}=useApp();
  switch(page.page){
    case 'escalas':return html`<${Escalas}/>`;
    case 'solicitacoes':return html`<${Solicitacoes}/>`;
    case 'profissionais':return html`<${Profissionais}/>`;
    case 'prof':return html`<${ProfDetail} id=${page.id}/>`;
    case 'meu':return html`<${MinhaArea}/>`;
    case 'equipe':return html`<${Equipe}/>`;
    case 'auditoria':return html`<${Auditoria}/>`;
    case 'configuracoes':return html`<${Config}/>`;
    case 'notificacoes':return html`<${Notificacoes}/>`;
    default:return html`<${Painel}/>`;
  }
}
const visibleShifts=(S,u)=>S.shifts.filter(s=>can(S,u,'shifts.view',s.unit));

/* ------------------------------------------------------------------ painel */
function Painel(){
  const {S,u,go}=useApp();
  if(!can(S,u,'shifts.view')&&!can(S,u,'professionals.view'))return html`<${MinhaArea}/>`;
  const now=new Date(),T=today(),lim=addDays(T,7);
  const up=visibleShifts(S,u).filter(s=>s.status!=='cancelado'&&new Date(s.end)>now&&dkey(s.start)<lim);
  const open=up.filter(s=>s.status==='descoberto').sort((a,b)=>a.start.localeCompare(b.start));
  const waiting=up.filter(s=>s.status==='aguardando_confirmacao'||s.status==='substituicao_solicitada');
  const drafts=visibleShifts(S,u).filter(s=>s.status==='rascunho'&&new Date(s.end)>now);
  const toValidate=S.profs.filter(p=>p.active&&(p.validation==='pendente'||p.validation==='em_analise'));
  const reqs=S.reqs.filter(r=>r.status==='pendente'&&can(S,u,'requests.decide',shiftOf(S,r.shift).unit));
  const ws=weekStart(T),we=addDays(ws,7);
  const load=S.profs.filter(p=>p.active).map(p=>({p,h:S.asg.filter(a=>a.prof===p.id&&ACTIVE(a.status)).map(a=>shiftOf(S,a.shift)).filter(s=>s.status!=='cancelado'&&dkey(s.start)>=ws&&dkey(s.start)<we).reduce((t,s)=>t+hours(s.start,s.end,s.brk),0)})).filter(x=>x.h>0).sort((a,b)=>b.h-a.h);
  const maxH=Math.max(S.rules.week,...load.map(x=>x.h));
  const Stat=({label,value,tone,onClick})=>html`<button onClick=${onClick} className="rounded-md border border-line bg-panel px-4 py-3 text-left transition hover:border-teal/50">
    <p className="text-sm text-soft">${label}</p><p className=${cx('mt-1 text-[1.75rem] font-semibold leading-tight',tone==='danger'&&value?'text-danger':tone==='amber'&&value?'text-amber':'text-navy')}>${value}</p></button>`;
  return html`<div>
    <${PageHead} title="Painel" desc=${`Próximos 7 dias em ${S.inst.name}${u.units?', Unidade Taquaral':''}.`} actions=${can(S,u,'shifts.view')&&html`<${Button} variant="primary" icon="cal" onClick=${()=>go({page:'escalas'})}>Abrir escalas<//>`}/>
    <div className="mb-6 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
      <${Stat} label="Plantões descobertos" value=${open.length} tone="danger" onClick=${()=>go({page:'escalas',view:'lista',st:'descoberto'})}/>
      <${Stat} label="Com pendência de confirmação" value=${waiting.length} tone="amber" onClick=${()=>go({page:'escalas',view:'lista'})}/>
      <${Stat} label="Rascunhos não publicados" value=${drafts.length} onClick=${()=>go({page:'escalas',view:'lista',st:'rascunho'})}/>
      <${Stat} label="Cadastros a validar" value=${toValidate.length} tone="amber" onClick=${()=>go({page:'profissionais'})}/>
    </div>
    <div className="grid items-start gap-6 xl:grid-cols-[1.4fr_1fr]">
      <${Panel} title="Vagas em aberto">
        ${open.length===0?html`<${Empty} title="Nenhuma vaga descoberta nos próximos 7 dias">Plantões publicados sem profissional suficiente aparecem aqui.<//>`:html`<ul className="divide-y divide-line">
          ${open.slice(0,8).map(s=>{const f=s.slots-S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).length;return html`<li key=${s.id}><button onClick=${()=>go({page:'escalas',shift:s.id,d:dkey(s.start)})} className="flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-bg">
            <div className="w-28 shrink-0"><p className="text-sm font-medium">${cap(F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'}))}</p><p className="text-xs text-soft">${hm(s.start)}–${hm(s.end)}</p></div>
            <div className="min-w-0 flex-1"><p className="truncate text-sm">${unitOf(S,s.unit).name}${s.service?' / '+servOf(S,s.service).name:''}</p><p className="text-xs text-faint">${s.cat?CAT[s.cat]:'Qualquer categoria'}</p></div>
            <${Badge} tone="danger">${f} ${f===1?'vaga':'vagas'}<//></button></li>`})}</ul>`}
      <//>
      <div className="space-y-6">
        ${can(S,u,'requests.decide')&&html`<${Panel} title="Solicitações pendentes" action=${html`<button className="text-sm text-teal hover:underline" onClick=${()=>go({page:'solicitacoes'})}>Ver todas</button>`}>
          ${reqs.length===0?html`<${Empty} title="Nada para aprovar"/>`:html`<ul className="divide-y divide-line">${reqs.map(r=>{const s=shiftOf(S,r.shift);return html`<li key=${r.id} className="flex items-center justify-between gap-3 px-4 py-3 text-sm">
            <span className="min-w-0"><span className="block truncate font-medium">${profOf(S,r.prof).name}</span><span className="text-xs text-soft">${RK[r.kind]}, ${label(S,s)}</span></span>
            <button className="shrink-0 text-teal hover:underline" onClick=${()=>go({page:'solicitacoes'})}>Analisar</button></li>`})}</ul>`}<//>`}
        <${Panel} title="Horas escaladas nesta semana">
          ${load.length===0?html`<${Empty} title="Ninguém escalado nesta semana"/>`:html`<ul className="space-y-2.5 px-4 py-4">${load.map(({p,h})=>html`<li key=${p.id} className="grid grid-cols-[minmax(0,9rem)_1fr_3rem] items-center gap-3 text-sm">
            <span className="truncate">${p.name}</span>
            <span className="relative h-2 rounded-full bg-bg"><span className=${cx('absolute inset-y-0 left-0 rounded-full',h>(p.maxWeek||S.rules.week)?'bg-amber':'bg-teal')} style=${{width:(h/maxH*100)+'%'}}></span>
              <span className="absolute inset-y-[-3px] w-px bg-faint" style=${{left:(S.rules.week/maxH*100)+'%'}} title=${'Referência de '+S.rules.week+'h'}></span></span>
            <span className="text-right text-soft">${fmtH(h)}</span></li>`)}
            <li className="pt-1 text-xs text-faint">A linha vertical marca a referência de ${S.rules.week}h semanais configurada.</li></ul>`}
        <//>
      </div>
    </div></div>`;
}

/* ------------------------------------------------------------------ escalas */
function Escalas(){
  const {S,u,run,go,page,toast}=useApp();
  const [view,setView]=useState(page.view||'semana');
  const [anchor,setAnchor]=useState(page.d||today());
  const [fUnit,setFUnit]=useState(u.units?u.units[0]:'');
  const [fSt,setFSt]=useState(page.st||'');
  const [openId,setOpenId]=useState(page.shift||null);
  const [form,setForm]=useState(null);
  const [drag,setDrag]=useState(null);
  const [pm,setPm]=useState(null);const [pmReason,setPmReason]=useState('');
  useEffect(()=>{if(page.shift){setOpenId(page.shift);if(page.d)setAnchor(page.d)}},[page]);
  const T=today();
  let days=[];
  if(view==='dia')days=[anchor];
  else if(view==='semana'){const w=weekStart(anchor);for(let i=0;i<7;i++)days.push(addDays(w,i))}
  else if(view==='mes'){const m1=anchor.slice(0,8)+'01';let d=weekStart(m1);const nm=parseKey(m1);nm.setMonth(nm.getMonth()+1);const end=weekStart(addDays(key(nm),6));while(d<end){days.push(d);d=addDays(d,1)}}
  else {for(let i=0;i<14;i++)days.push(addDays(anchor,i))}
  const from=days[0],to=addDays(days[days.length-1],1);
  const list=visibleShifts(S,u).filter(s=>dkey(s.start)>=from&&dkey(s.start)<to&&(!fUnit||s.unit===fUnit)&&(!fSt||s.status===fSt)).sort((a,b)=>a.start.localeCompare(b.start));
  const byDay={};list.forEach(s=>{(byDay[dkey(s.start)]=byDay[dkey(s.start)]||[]).push(s)});
  const drafts=list.filter(s=>s.status==='rascunho'&&new Date(s.end)>new Date()&&can(S,u,'shifts.publish',s.unit));
  const canManage=can(S,u,'shifts.manage');
  const step=dir=>{if(view==='dia')setAnchor(addDays(anchor,dir));else if(view==='semana')setAnchor(addDays(anchor,7*dir));else if(view==='lista')setAnchor(addDays(anchor,14*dir));else{const d=parseKey(anchor.slice(0,8)+'01');d.setMonth(d.getMonth()+dir);setAnchor(key(d))}};
  const title=view==='dia'?cap(F(anchor,{weekday:'long',day:'numeric',month:'long'})):view==='mes'?cap(F(anchor,{month:'long',year:'numeric'})):`${F(from,{day:'numeric',month:'short'})} a ${F(days[days.length-1],{day:'numeric',month:'short',year:'numeric'})}`;
  const doMove=(s,date,reason)=>{if(dkey(s.start)===date)return;const r=run((D,U)=>A.move(D,U,s.id,date,reason),'Plantão movido.');
    if(r.ok){setPm(null);setPmReason('')}else if(r.checks)setPm({s,date,c:r.checks,blocking:r.kind==='blocking'})};
  const dnd=date=>canManage&&view!=='lista'?{onDragOver:e=>{e.preventDefault();setDrag(date)},onDragLeave:()=>setDrag(d=>d===date?null:d),
    onDrop:e=>{e.preventDefault();setDrag(null);const s=shiftOf(S,e.dataTransfer.getData('text/plain'));if(!s)return;if(s.status==='cancelado')return toast('Plantão cancelado não pode ser movido.','error');if(!can(S,u,'shifts.manage',s.unit))return toast('Seu perfil não gerencia esta unidade.','error');doMove(s,date)}}:{};
  const card=(s,compact)=>html`<${ShiftCard} key=${s.id} S=${S} s=${s} compact=${compact} onOpen=${()=>setOpenId(s.id)} draggable=${canManage&&s.status!=='cancelado'&&can(S,u,'shifts.manage',s.unit)}/>`;
  const open=openId&&shiftOf(S,openId);
  return html`<div>
    <div className="mb-5 flex flex-wrap items-center gap-3">
      <h1 className="mr-auto text-[1.75rem] font-semibold leading-tight text-navy">${title}</h1>
      ${drafts.length>0&&html`<${Button} variant="navy" icon="send" onClick=${()=>run((D,U)=>A.publish(D,U,drafts.map(d=>d.id)),n=>`${n} ${n===1?'plantão publicado':'plantões publicados'}. Os profissionais escalados foram avisados.`)}>Publicar ${drafts.length} ${drafts.length===1?'rascunho':'rascunhos'}<//>`}
      ${canManage&&html`<${Button} variant="primary" icon="plus" onClick=${()=>setForm({date:view==='dia'?anchor:(T>=from&&T<to?T:from)})}>Novo plantão<//>`}
    </div>
    <div className="mb-4 flex flex-wrap items-center gap-2">
      <div className="inline-flex rounded border border-line bg-panel p-0.5" role="group" aria-label="Visualização">
        ${[['dia','Dia'],['semana','Semana'],['mes','Mês'],['lista','Lista']].map(([v,l])=>html`<button key=${v} onClick=${()=>setView(v)} aria-pressed=${view===v} className=${cx('rounded-sm px-3 py-1.5 text-sm',view===v?'bg-navy text-onnavy':'text-soft hover:text-navy')}>${l}</button>`)}
      </div>
      <${Button} size="sm" variant="ghost" onClick=${()=>step(-1)} aria-label="Período anterior"><${Icon} n="left"/><//>
      <${Button} size="sm" onClick=${()=>setAnchor(T)}>Hoje<//>
      <${Button} size="sm" variant="ghost" onClick=${()=>step(1)} aria-label="Próximo período"><${Icon} n="right"/><//>
      <div className="ml-auto flex flex-wrap gap-2">
        ${!u.units&&html`<select id="f-unit" aria-label="Unidade" className=${inputCls+' h-9 w-auto py-1 text-sm'} value=${fUnit} onChange=${e=>setFUnit(e.target.value)}><option value="">Todas as unidades</option>${S.units.map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select>`}
        <select id="f-st" aria-label="Situação" className=${inputCls+' h-9 w-auto py-1 text-sm'} value=${fSt} onChange=${e=>setFSt(e.target.value)}><option value="">Todas as situações</option>${Object.entries(SST).map(([k,v])=>html`<option key=${k} value=${k}>${v[0]}</option>`)}</select>
      </div>
    </div>
    <div className="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-soft">
      <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-teal"></span>Confirmado</span>
      <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full bg-amber"></span>Aguardando</span>
      <span className="inline-flex items-center gap-1.5"><span className="h-2 w-2 rounded-full border-[1.5px] border-danger"></span>Vaga aberta</span>
      <span className="inline-flex items-center gap-1.5"><span className="h-3 w-5 rounded-sm border border-dashed border-faint"></span>Rascunho</span>
      ${canManage&&view!=='lista'&&html`<span className="hidden text-faint md:inline">Arraste um plantão para outro dia para movê-lo.</span>`}
    </div>

    ${view==='semana'&&html`<div className="grid gap-2 md:grid-cols-7">${days.map(d=>html`<section key=${d} ...${dnd(d)} className=${cx('flex min-h-[200px] flex-col rounded-md border bg-panel',d===T?'border-teal':'border-line',drag===d&&'bg-tealsoft ring-2 ring-teal')}>
      <header className="flex items-center justify-between border-b border-line px-2.5 py-2"><span className="text-sm"><span className="capitalize text-soft">${F(d,{weekday:'short'}).replace('.','')}</span> <span className=${cx('font-semibold',d===T?'text-teal':'text-navy')}>${F(d,{day:'2-digit',month:'2-digit'})}</span></span>
        ${canManage&&html`<button onClick=${()=>setForm({date:d})} className="rounded p-1 text-faint hover:bg-bg hover:text-teal" aria-label=${'Novo plantão em '+d}><${Icon} n="plus"/></button>`}</header>
      <div className="flex-1 space-y-1.5 p-1.5">${(byDay[d]||[]).map(s=>card(s))}</div></section>`)}</div>`}

    ${view==='dia'&&html`<section className="rounded-md border border-line bg-panel p-3"><div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">${(byDay[anchor]||[]).map(s=>card(s))}</div>
      ${!(byDay[anchor]||[]).length&&html`<${Empty} title="Nenhum plantão neste dia"/>`}</section>`}

    ${view==='mes'&&html`<div className="overflow-x-auto"><div className="grid min-w-[720px] grid-cols-7 border-l border-t border-line bg-panel">
      ${[1,2,3,4,5,6,0].map(d=>html`<div key=${'h'+d} className="border-b border-r border-line px-2 py-1.5 text-xs text-soft">${WDS[d]}</div>`)}
      ${days.map(d=>{const l=byDay[d]||[];const inM=d.slice(0,7)===anchor.slice(0,7);return html`<div key=${d} ...${dnd(d)} className=${cx('min-h-[112px] border-b border-r border-line p-1.5',!inM&&'bg-bg/70',drag===d&&'bg-tealsoft ring-2 ring-inset ring-teal')}>
        <button onClick=${()=>{setView('dia');setAnchor(d)}} className=${cx('mb-1 rounded-sm px-1 text-xs',d===T?'bg-navy font-semibold text-onnavy':inM?'text-ink hover:bg-navy/10':'text-faint')}>${+d.slice(8)}</button>
        <div className="space-y-1">${l.slice(0,4).map(s=>card(s,true))}${l.length>4&&html`<button className="text-xs text-teal hover:underline" onClick=${()=>{setView('dia');setAnchor(d)}}>+${l.length-4} plantões</button>`}</div></div>`})}
    </div></div>`}

    ${view==='lista'&&html`<div className="overflow-x-auto rounded-md border border-line bg-panel">${list.length===0?html`<${Empty} title="Nenhum plantão com estes filtros"/>`:html`<table className="w-full min-w-[760px] text-sm">
      <thead><tr className="text-left text-xs text-soft">${['Data','Horário','Local','Categoria','Escalados','Situação'].map(h=>html`<th key=${h} className="border-b border-line px-4 py-2.5 font-medium">${h}</th>`)}</tr></thead>
      <tbody>${list.map(s=>{const act=S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status));return html`<tr key=${s.id} className="cursor-pointer hover:bg-bg" onClick=${()=>setOpenId(s.id)}>
        <td className="border-b border-line px-4 py-3 whitespace-nowrap">${cap(F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'}))}</td>
        <td className="border-b border-line px-4 py-3 font-medium text-navy">${hm(s.start)}–${hm(s.end)}</td>
        <td className="border-b border-line px-4 py-3">${unitOf(S,s.unit).name}${s.service&&html`<span className="text-faint"> / ${servOf(S,s.service).name}</span>`}</td>
        <td className="border-b border-line px-4 py-3">${s.cat?CAT[s.cat]:'Qualquer'}</td>
        <td className="border-b border-line px-4 py-3"><div className="flex items-center gap-2"><${Pips} S=${S} s=${s}/><span className="truncate text-soft">${act.map(a=>profOf(S,a.prof).name.split(' ')[0]).join(', ')||'Ninguém'}</span></div></td>
        <td className="border-b border-line px-4 py-3"><${Badge} tone=${SST[s.status][1]}>${SST[s.status][0]}<//></td></tr>`})}</tbody></table>`}</div>`}

    ${open&&html`<${ShiftDetail} key=${open.id} s=${open} onClose=${()=>setOpenId(null)} onEdit=${()=>{setForm({shift:open});setOpenId(null)}}/>`}
    ${form&&html`<${ShiftForm} init=${form} onClose=${()=>setForm(null)} onSaved=${id=>setOpenId(id)}/>`}
    ${pm&&html`<${Modal} open onClose=${()=>{setPm(null);setPmReason('')}} title=${pm.blocking?'Não foi possível mover':'Confirmar mudança de data'} desc=${`Plantão das ${hm(pm.s.start)} para ${F(pm.date,{weekday:'long',day:'numeric',month:'long'})}.`}
      footer=${html`<${Button} onClick=${()=>{setPm(null);setPmReason('')}}>${pm.blocking?'Fechar':'Cancelar'}<//>${!pm.blocking&&html`<${Button} variant="primary" disabled=${!pmReason.trim()} onClick=${()=>doMove(pm.s,pm.date,pmReason)}>Autorizar exceção e mover<//>`}`}>
      <${Override} c=${pm.c} reason=${pmReason} setReason=${setPmReason} blocking=${pm.blocking}/><//>`}
  </div>`;
}

function ShiftCard({S,s,compact,onOpen,draggable}){
  const act=S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status));
  const draft=s.status==='rascunho',canc=s.status==='cancelado',flag=act.some(a=>a.reason);
  const edge=canc?'border-l-line':draft?'border-l-faint':s.status==='confirmado'?'border-l-teal':s.status==='descoberto'?'border-l-danger':'border-l-amber';
  const ds=e=>{e.dataTransfer.setData('text/plain',s.id);e.dataTransfer.effectAllowed='move'};
  if(compact)return html`<button type="button" onClick=${onOpen} draggable=${draggable} onDragStart=${ds} className=${cx('flex w-full items-center gap-1.5 rounded-sm border border-l-[3px] border-line bg-panel px-1.5 py-0.5 text-left text-xs hover:bg-bg',edge,draft&&'border-dashed',canc&&'line-through opacity-50')}>
    <span className="font-medium">${hm(s.start)}</span><span className="min-w-0 flex-1 truncate text-soft">${s.service?servOf(S,s.service).name:unitOf(S,s.unit).name}</span><${Pips} S=${S} s=${s} sm/></button>`;
  return html`<button type="button" onClick=${onOpen} draggable=${draggable} onDragStart=${ds} className=${cx('w-full rounded border border-l-[3px] border-line bg-panel px-2.5 py-2 text-left transition hover:bg-bg',edge,draft&&'border-dashed bg-bg/50',canc&&'opacity-55',draggable&&'cursor-grab active:cursor-grabbing')}>
    <div className="flex items-center justify-between gap-2"><span className=${cx('text-sm font-semibold text-navy',canc&&'line-through')}>${hm(s.start)}–${hm(s.end)}</span><${Pips} S=${S} s=${s}/></div>
    <p className="mt-0.5 truncate text-xs text-soft">${unitOf(S,s.unit).name}${s.service?' / '+servOf(S,s.service).name:''}</p>
    ${s.cat&&html`<p className="truncate text-xs text-faint">${CAT[s.cat]}</p>`}
    ${act.length>0&&html`<ul className="mt-1.5 space-y-0.5">${act.slice(0,3).map(a=>html`<li key=${a.id} className="flex items-center gap-1.5 truncate text-xs"><span className=${cx('h-1.5 w-1.5 shrink-0 rounded-full',a.status==='confirmado'?'bg-teal':'bg-amber')}></span><span className="truncate">${profOf(S,a.prof).name}</span></li>`)}</ul>`}
    ${(draft||canc||s.status==='substituicao_solicitada'||flag)&&html`<div className="mt-1.5 flex flex-wrap items-center gap-1.5 text-[0.7rem]">
      ${(draft||canc||s.status==='substituicao_solicitada')&&html`<span className="font-medium text-soft">${SST[s.status][0]}</span>`}
      ${flag&&html`<span className="inline-flex items-center gap-0.5 text-amber" title="Escala com exceção autorizada"><${Icon} n="alert" s=${12}/>exceção</span>`}</div>`}
  </button>`;
}

function ShiftForm({init,onClose,onSaved}){
  const {S,u,run}=useApp();
  const sh=init.shift;
  const units=S.units.filter(x=>can(S,u,'shifts.manage',x.id));

  const dates=[];if(from&&to&&to>=from)for(let d=from;d<=to&&dates.length<61;d=addDays(d,1))if(days.includes(wdOf(d))&&d!==base)dates.push(d);

      <input type="checkbox" className="sr-only" checked=${days.includes(d)} onChange=${e=>setDays(e.target.checked?[...days,d]:days.filter(x=>x!==d))}/>${WDS[d]}</label>`)}</div>
    <div className="mt-3 flex items-center justify-between gap-2"><span className="text-sm text-soft">${dates.length} ${dates.length===1?'cópia':'cópias'}</span>

  const up=active.filter(x=>new Date(x.s.end)>now).sort((a,b)=>a.s.start.localeCompare(b.s.start));
  const next=up[0];const ws=weekStart(T);const week=[...Array(7)].map((_,i)=>addDays(ws,i));

      <${Panel} title="Esta semana" action=${html`<span className="text-sm text-soft">${fmtH(wh)} na semana</span>`}><ul className="divide-y divide-line">${week.map(d=>{const it=active.filter(x=>dkey(x.s.start)===d);return html`<li key=${d} className=${cx('flex items-start gap-3 px-4 py-2 text-sm',d===T&&'bg-tealsoft/60')}>

      <${Badge} tone=${RST[r.status][1]}>${RST[r.status][0]}<//>${r.status==='pendente'&&html`<${Button} size="sm" variant="ghost" onClick=${()=>run((D,U)=>A.withdraw(D,U,r.id),'Solicitação retirada.')}>Retirar<//>`}</li>`})}</ul>`}<//>
    <div className="grid gap-6 xl:grid-cols-2"><${Panel} title="Minha disponibilidade"><div className="p-4"><${Avail} p=${p}/></div><//>
      <div className="space-y-6"><${Panel} title="Férias e afastamentos"><div className="p-4"><${Absences} p=${p}/></div><//>
        <${Panel} title="Histórico">${hist.length===0?html`<p className="px-4 py-6 text-sm text-soft">Sem plantões anteriores.</p>`:html`<ul className="divide-y divide-line">${hist.map(x=>html`<li key=${x.a.id} className="flex items-center gap-3 px-4 py-2.5 text-sm"><span className="w-28">${cap(F(x.s.start,{weekday:'short',day:'2-digit',month:'2-digit'}))}</span><span className="min-w-0 flex-1 truncate text-soft">${unitOf(S,x.s.unit).name}</span><span className="text-xs text-faint">${x.s.status==='cancelado'?'Cancelado':new Date(x.s.end)<=now&&x.a.status==='confirmado'?'Realizado':AST[x.a.status][0]}</span></li>`)}</ul>`}<//></div></div>
  </div>`;
}
function MyActions({a,compact}){
  const {run}=useApp();const [mode,setMode]=useState(null);const [r,setR]=useState('');const reset=()=>{setMode(null);setR('')};
  if(a.status==='substituicao_solicitada')return html`<p className="mt-2 text-sm text-soft">Seu pedido de substituição está com a gestão. Até a aprovação, o plantão continua sob sua responsabilidade.</p>`;
  return html`<div className=${compact?'mt-2':'mt-4'}>${!mode&&html`<div className="flex flex-wrap gap-2">
    ${a.status==='aguardando_confirmacao'&&html`<${Button} size="sm" variant="primary" icon="check" onClick=${()=>run((D,U)=>A.confirm(D,U,a.id),'Presença confirmada.')}>Confirmar presença<//><${Button} size="sm" onClick=${()=>setMode('recusar')}>Não posso<//>`}
    ${a.status==='confirmado'&&html`<${Button} size="sm" onClick=${()=>setMode('substituicao')}>Pedir substituição<//><${Button} size="sm" variant="ghost" onClick=${()=>setMode('alteracao')}>Pedir alteração<//>`}</div>`}
    ${mode&&html`<div className="space-y-2 rounded-md border border-line bg-bg/60 p-3"><p className="text-sm">${mode==='recusar'?'Recusar este plantão. A gestão é avisada para buscar outra pessoa.':mode==='substituicao'?'Plantões confirmados só mudam com aprovação. Você continua escalado até a resposta.':'Descreva a alteração desejada. A gestão analisa e responde.'}</p>
      <textarea className=${inputCls+' min-h-[56px]'} aria-label="Motivo" placeholder="Motivo" value=${r} onInput=${e=>setR(e.target.value)}></textarea>
      <div className="flex justify-end gap-2"><${Button} size="sm" onClick=${reset}>Voltar<//><${Button} size="sm" variant=${mode==='recusar'?'danger':'primary'} disabled=${!r.trim()} onClick=${()=>{const x=run((D,U)=>mode==='recusar'?A.decline(D,U,a.id,r):A.request(D,U,a.id,mode,r),mode==='recusar'?'Plantão recusado. A gestão foi avisada.':'Solicitação enviada para aprovação.');if(x.ok)reset()}}>${mode==='recusar'?'Recusar plantão':'Enviar solicitação'}<//></div></div>`}</div>`;
}

/* ------------------------------------------------------------------ administração */
function Equipe(){
  const {S,u,run}=useApp();const [st,setSt]=useState(S.rolePerms);const [dirty,setDirty]=useState(false);
  const roles=['admin','gestor','rt'];let last='';
  return html`<div className="space-y-6"><${PageHead} title="Equipe e acessos" desc="Quem acessa a MedLink nesta instituição e o que cada perfil pode fazer."/>
    <${Panel} title="Pessoas com acesso"><div className="overflow-x-auto"><table className="w-full min-w-[560px] text-sm"><thead><tr className="text-left text-xs text-soft">${['Pessoa','Perfil','Unidades'].map(h=>html`<th key=${h} className="border-b border-line px-4 py-2.5 font-medium">${h}</th>`)}</tr></thead>
      <tbody>${S.users.map(x=>html`<tr key=${x.id}><td className="border-b border-line px-4 py-3"><span className="block font-medium">${x.name}${x.id===u.id&&html`<span className="ml-1.5 text-xs font-normal text-faint">(você)</span>`}</span><span className="text-xs text-faint">${x.email}</span></td>
        <td className="border-b border-line px-4 py-3">${ROLE[x.role]}</td><td className="border-b border-line px-4 py-3">${x.role==='prof'?'Minha área':x.units?x.units.map(id=>unitOf(S,id).name).join(', '):'Todas as unidades'}</td></tr>`)}</tbody></table></div><//>
    <${Panel} title="Permissões por perfil" action=${dirty&&html`<${Button} size="sm" variant="primary" onClick=${()=>{let ok=true;['gestor','rt'].forEach(r=>{if(ok)ok=run((D,U)=>A.perms(D,U,r,st[r])).ok});if(ok){setDirty(false)}}}>Salvar permissões<//>`}>
      <div className="overflow-x-auto"><table className="w-full min-w-[620px] text-sm"><thead><tr className="text-left text-xs text-soft"><th className="border-b border-line px-4 py-2.5 font-medium">Permissão</th>${roles.map(r=>html`<th key=${r} className="border-b border-line px-4 py-2.5 text-center font-medium">${ROLE[r]}</th>`)}</tr></thead>
      <tbody>${Object.entries(PERMS).map(([k,[l,g]])=>{const head=g!==last?(last=g,html`<tr key=${'g'+g}><td colSpan="4" className="bg-bg px-4 py-1.5 text-xs font-medium text-soft">${g}</td></tr>`):null;
        return [head,html`<tr key=${k}><td className="border-b border-line px-4 py-2.5">${l}</td>${roles.map(r=>html`<td key=${r} className="border-b border-line px-4 py-2.5 text-center">
          <input type="checkbox" className="h-4 w-4 accent-teal" aria-label=${l+': '+ROLE[r]} checked=${(st[r]||[]).includes(k)} disabled=${r==='admin'}
            onChange=${e=>{setSt({...st,[r]:e.target.checked?[...st[r],k]:st[r].filter(x=>x!==k)});setDirty(true)}}/></td>`)}</tr>`]})}</tbody></table></div>
      <p className="px-4 py-3 text-xs text-faint">A administradora sempre tem todas as permissões. Experimente tirar “Publicar escalas” do gestor e entrar como Marcos.</p><//></div>`;
}
function Auditoria(){
  const {S}=useApp();const [ent,setEnt]=useState('');const rows=S.audit.filter(a=>!ent||a.entity===ent);
  return html`<div><${PageHead} title="Auditoria" desc="Registro permanente das ações: quem fez, quando, o que mudou e o motivo informado."/>
    <div className="mb-4"><select id="aud" aria-label="Tipo de registro" className=${inputCls+' w-auto'} value=${ent} onChange=${e=>setEnt(e.target.value)}><option value="">Todos os registros</option>${Object.entries(ENT).map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select></div>
    <div className="overflow-x-auto rounded-md border border-line bg-panel">${rows.length===0?html`<${Empty} title="Nenhum registro"/>`:html`<table className="w-full min-w-[760px] text-sm"><thead><tr className="text-left text-xs text-soft">${['Quando','Quem','Ação','Registro','Detalhes'].map(h=>html`<th key=${h} className="border-b border-line px-4 py-2.5 font-medium">${h}</th>`)}</tr></thead>
      <tbody>${rows.slice(0,200).map(a=>html`<tr key=${a.id} className="align-top"><td className="whitespace-nowrap border-b border-line px-4 py-3">${F(a.at,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})}</td>
        <td className="border-b border-line px-4 py-3">${a.actor}</td><td className="border-b border-line px-4 py-3">${ACT[a.action]||a.action}</td><td className="border-b border-line px-4 py-3">${ENT[a.entity]||a.entity}</td>
        <td className="max-w-md border-b border-line px-4 py-3 text-soft">${a.reason&&html`<span className="block text-ink">Motivo: ${a.reason}</span>`}${a.detail}</td></tr>`)}</tbody></table>`}</div></div>`;
}
function Config(){
  const {S,run}=useApp();const [r,setR]=useState(S.rules);
  return html`<div><${PageHead} title="Configurações" desc="Regras usadas na validação das escalas. Mude e veja os alertas mudarem ao escalar alguém."/>
    <${Panel} title="Regras de escala"><div className="grid gap-4 p-4 sm:grid-cols-3">
      <${Field} label="Descanso mínimo entre plantões (h)" id="r1" hint="Abaixo disso, gera alerta e exige justificativa."><input id="r1" type="number" min="0" max="48" className=${inputCls} value=${r.rest} onInput=${e=>setR({...r,rest:e.target.value})}/><//>
      <${Field} label="Carga semanal de referência (h)" id="r2" hint="O profissional pode informar um limite menor."><input id="r2" type="number" min="1" max="168" className=${inputCls} value=${r.week} onInput=${e=>setR({...r,week:e.target.value})}/><//>
      <${Field} label="Duração máxima de um plantão (h)" id="r3" hint="Restrição obrigatória."><input id="r3" type="number" min="1" max="36" className=${inputCls} value=${r.maxShift} onInput=${e=>setR({...r,maxShift:e.target.value})}/><//></div>
      <div className="flex flex-wrap items-center justify-between gap-3 border-t border-line px-4 py-3"><p className="text-xs text-faint">Valores padrão configuráveis. Confirme as regras de jornada dos seus contratos e convenções.</p><${Button} variant="primary" onClick=${()=>run((D,U)=>A.rules(D,U,r),'Regras salvas.')}>Salvar regras<//></div><//>
    <${Panel} title="Instituição" className="mt-6"><dl className="grid gap-3 px-4 py-4 text-sm sm:grid-cols-3"><div><dt className="text-faint">Nome</dt><dd>${S.inst.name}</dd></div><div><dt className="text-faint">Tipo</dt><dd>${S.inst.type}</dd></div><div><dt className="text-faint">Unidades</dt><dd>${S.units.map(x=>x.name).join(', ')}</dd></div></dl><//></div>`;
}
function Notificacoes(){
  const {S,u,run,go}=useApp();const list=S.notifs.filter(n=>n.user===u.id);const unread=list.filter(n=>!n.read).length;
  return html`<div><${PageHead} title="Notificações" desc="Alterações de escala, solicitações e pendências deste perfil." actions=${unread>0&&html`<${Button} size="sm" onClick=${()=>run((D,U)=>A.readAll(D,U),'Notificações marcadas como lidas.')}>Marcar todas como lidas<//>`}/>
    <${Panel}>${list.length===0?html`<${Empty} title="Nenhuma notificação">Avisos sobre escalas e solicitações deste perfil aparecem aqui.<//>`:html`<ul className="divide-y divide-line">${list.map(n=>html`<li key=${n.id}><button className="flex w-full gap-3 px-4 py-3 text-left hover:bg-bg" onClick=${()=>{run((D,U)=>A.read(D,U,n.id));n.link&&go(n.link)}}>
      <span className=${cx('mt-1.5 h-2 w-2 shrink-0 rounded-full',n.read?'bg-transparent':'bg-teal')}></span><span className="min-w-0 flex-1"><span className=${cx('block text-sm',!n.read&&'font-semibold')}>${n.title}</span>${n.body&&html`<span className="block text-sm text-soft">${n.body}</span>`}<span className="mt-0.5 block text-xs text-faint">${F(n.at,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span></span></button></li>`)}</ul>`}<//></div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body>
