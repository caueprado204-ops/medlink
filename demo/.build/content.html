function checks(S,sh,pid,o={}){
  const B=[],W=[],p=profOf(S,pid);if(!p)return{blocking:['Profissional não encontrado.'],warnings:[]};
  const start=o.start||sh.start,end=o.end||sh.end,s0=+new Date(start),e0=+new Date(end);
  if(sh.status==='cancelado')B.push('Plantão cancelado.');
  if(!p.active)B.push('Profissional inativo.');
  if(p.validation==='rejeitado')B.push('Cadastro rejeitado na validação.');
  if(sh.cat&&sh.cat!==p.cat)B.push(`Este plantão exige ${CAT[sh.cat].toLowerCase()}.`);
  const act=S.asg.filter(a=>a.shift===sh.id&&ACTIVE(a.status));
  if(act.some(a=>a.prof===pid&&a.id!==o.ignore))B.push('Profissional já está neste plantão.');
  if(!o.ignore&&act.length>=sh.slots)B.push('Todas as vagas deste plantão já estão preenchidas.');
  const mine=S.asg.filter(a=>a.prof===pid&&ACTIVE(a.status)&&a.id!==o.ignore).map(a=>shiftOf(S,a.shift)).filter(s=>s&&s.id!==sh.id&&s.status!=='cancelado');
  const rest=S.rules.rest*36e5;
  mine.forEach(s=>{const a=+new Date(s.start),b=+new Date(s.end);
    if(a<e0&&b>s0)B.push(`Sobrepõe outro plantão em ${unitOf(S,s.unit).name} (${D2(s.start)}, ${hm(s.start)}–${hm(s.end)}).`);
    else if(b>s0-rest&&a<e0+rest)W.push(`Descanso menor que ${S.rules.rest}h em relação ao plantão de ${D2(s.start)} às ${hm(s.start)}.`);});
  S.abs.filter(x=>x.prof===pid&&x.from<=dkey(end)&&x.to>=dkey(start)).forEach(x=>{const per=`${D2(x.from)} a ${D2(x.to)}`;
    if(x.kind==='indisponivel')W.push(`Marcou indisponibilidade de ${per}.`);else B.push(`Em ${ABS[x.kind].toLowerCase()} de ${per}.`);});
  const miss=(sh.comps||[]).filter(c=>!p.comps.includes(c));if(miss.length)W.push('Competências não registradas: '+miss.join(', ')+'.');
  if(p.validation==='pendente'||p.validation==='em_analise')W.push('Cadastro profissional ainda não validado.');
  if(p.units.length&&!p.units.includes(sh.unit))W.push('Unidade fora das informadas pelo profissional.');
  if(p.avail.length){const w=new Date(start).getDay(),hs=hm(start),he=hm(end);
    if(!p.avail.some(v=>v.wd===w&&v.s<=hs&&(v.e>v.s?(dkey(end)===dkey(start)&&v.e>=he):true)))W.push('Fora da disponibilidade informada pelo profissional.');}
  const ws=weekStart(dkey(start)),we=addDays(ws,7);
  const wh=mine.filter(s=>dkey(s.start)>=ws&&dkey(s.start)<we).reduce((t,s)=>t+hours(s.start,s.end,s.brk),0)+hours(start,end,sh.brk);
  const lim=p.maxWeek||S.rules.week;if(wh>lim)W.push(`Carga na semana chegaria a ${fmtH(wh)} (referência: ${fmtH(lim)}).`);
  return {blocking:B,warnings:W,weekHours:wh};
}

function proposeSchedule(S,u,from,to,unit,allowWarnings){
  const D=structuredClone(S);const out=[];
  const target=D.shifts.filter(s=>s.status!=='cancelado'&&dkey(s.start)>=from&&dkey(s.start)<=to&&(!unit||s.unit===unit)&&can(D,u,'shifts.manage',s.unit)&&new Date(s.start)>new Date()).sort((a,b)=>a.start.localeCompare(b.start));
  target.forEach(s=>{let open=s.slots-D.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).length;
    while(open>0){
      const cands=D.profs.filter(p=>p.active&&(!s.cat||p.cat===s.cat)).map(p=>({p,c:checks(D,s,p.id)})).filter(x=>!x.c.blocking.length&&(allowWarnings||!x.c.warnings.length));
      if(!cands.length){
        const why=D.profs.filter(p=>p.active&&(!s.cat||p.cat===s.cat)).map(p=>({p,c:checks(D,s,p.id)}));
        const reasons=why.map(x=>`${x.p.name.split(' ')[0]}: ${(x.c.blocking[0]||x.c.warnings[0]||'').replace(/\.$/,'')}`).slice(0,4);
        out.push({shift:s.id,prof:null,reasons:reasons.length?reasons:['Nenhum profissional ativo da categoria exigida.']});break;}
      cands.forEach(x=>{x.score=x.c.warnings.length*20+x.c.weekHours});
      cands.sort((a,b)=>a.score-b.score);const best=cands[0];
      D.asg.push({id:'tmp'+uid(),shift:s.id,prof:best.p.id,status:'aguardando_confirmacao',reason:null,warnings:[],ended:null});
      out.push({shift:s.id,prof:best.p.id,warnings:best.c.warnings,hours:best.c.weekHours});open--;}
  });
  return out;
}

const A={
  saveShift(S,u,f){
    const isNew=!f.id,old=isNew?null:shiftOf(S,f.id);
    need(S,u,'shifts.manage',f.unit);if(old)need(S,u,'shifts.manage',old.unit);
    if(!f.date||!f.start||!f.end)throw new Stop('validation','Informe data e horários.');
    const start=at(f.date,f.start);let end=at(f.date,f.end);if(f.end<=f.start)end=at(addDays(f.date,1),f.end);
    const dur=hours(start,end,0);if(dur>S.rules.maxShift)throw new Stop('validation',`Duração acima do máximo configurado (${S.rules.maxShift}h).`);
    const slots=Math.max(1,Math.min(50,+f.slots||1)),brk=Math.max(0,+f.brk||0);
    if(brk/60>=dur)throw new Stop('validation','O intervalo não pode ser maior que o plantão.');
    if(isNew){const s={id:'sh'+uid(),unit:f.unit,service:f.service||null,start,end,brk,cat:f.cat||null,slots,comps:f.comps,notes:f.notes,status:'rascunho',cancelReason:null};S.shifts.push(s);log(S,u,'create','shift',s.id,null,label(s));return s.id;}
    const act=S.asg.filter(a=>a.shift===old.id&&ACTIVE(a.status));
    if(slots<act.length)throw new Stop('validation',`Há ${act.length} profissionais escalados; remova atribuições antes de reduzir as vagas.`);
    if(start!==old.start||end!==old.end||f.unit!==old.unit||(f.cat||null)!==old.cat){const tmp={...old,unit:f.unit,cat:f.cat||null,brk};let W=[];
      act.forEach(a=>{const c=checks(S,tmp,a.prof,{ignore:a.id,start,end});if(c.blocking.length)enforce(c);W=W.concat(c.warnings.map(w=>profOf(S,a.prof).name.split(' ')[0]+': '+w))});
      enforce({blocking:[],warnings:W},f.override);}
    const moved=start!==old.start;
    Object.assign(old,{unit:f.unit,service:f.service||null,start,end,brk,cat:f.cat||null,slots,comps:f.comps,notes:f.notes});
    recompute(S,old.id);log(S,u,f.moved?'move':'update','shift',old.id,f.override,label(old));
    if(moved&&old.status!=='rascunho')act.forEach(a=>noteProf(S,u,a.prof,'Plantão alterado','Novo horário: '+label(old)));
    return old.id;
  },
  move(S,u,id,date,reason){const s=shiftOf(S,id);return A.saveShift(S,u,{id,unit:s.unit,service:s.service,date,start:hm(s.start),end:hm(s.end),brk:s.brk,cat:s.cat,slots:s.slots,comps:s.comps,notes:s.notes,override:reason,moved:true})},
  duplicate(S,u,id,dates){const s=shiftOf(S,id);need(S,u,'shifts.manage',s.unit);let n=0;
    dates.forEach(d=>{if(d===dkey(s.start))return;const st=at(d,hm(s.start));S.shifts.push({...s,id:'sh'+uid(),start:st,end:new Date(+new Date(st)+(new Date(s.end)-new Date(s.start))).toISOString(),status:'rascunho',cancelReason:null});n++});
    log(S,u,'duplicate','shift',s.id,null,`${n} cópias de ${label(s)}`);return n;},
  publish(S,u,ids){let n=0;ids.forEach(id=>{const s=shiftOf(S,id);if(!s||s.status!=='rascunho'||new Date(s.end)<new Date())return;need(S,u,'shifts.publish',s.unit);
    s.status='publicado';recompute(S,id);n++;S.asg.filter(a=>a.shift===id&&ACTIVE(a.status)).forEach(a=>noteProf(S,u,a.prof,'Novo plantão na sua escala',label(s)+'. Confirme sua presença.'));});

  cancel(S,u,id,reason){const s=shiftOf(S,id);need(S,u,'shifts.manage',s.unit);if(!reason.trim())throw new Stop('validation','Informe o motivo do cancelamento.');

  confirm(S,u,aid){const a=A.myAsg(S,u,aid);if(a.status!=='aguardando_confirmacao')throw new Stop('validation','Este plantão não está aguardando confirmação.');

  decline(S,u,aid,reason){const a=A.myAsg(S,u,aid),s=shiftOf(S,a.shift);

  request(S,u,aid,kind,reason){const a=A.myAsg(S,u,aid),s=shiftOf(S,a.shift);

  apply(S,u,sid){const s=shiftOf(S,sid),p=profOf(S,u.prof);
    if(!['descoberto','publicado'].includes(s.status)||new Date(s.start)<new Date())throw new Stop('validation','Este plantão não está aberto para candidaturas.');
    if(s.cat&&s.cat!==p.cat)throw new Stop('validation','Este plantão exige outra categoria profissional.');
    if(S.reqs.some(r=>r.shift===sid&&r.prof===p.id&&r.kind==='candidatura'&&r.status==='pendente'))throw new Stop('validation','Você já se candidatou a este plantão.');
    S.reqs.push({id:'r'+uid(),shift:sid,asg:null,prof:p.id,kind:'candidatura',reason:null,status:'pendente',prev:null,created:nowIso()});
    log(S,u,'apply','req',sid,null,label(s));note(S,u,'requests.decide','Nova candidatura a plantão',`${u.name}: ${label(s)}`,{page:'solicitacoes'},s.unit);},
  withdraw(S,u,rid){const r=S.reqs.find(x=>x.id===rid);if(!r||r.prof!==u.prof||r.status!=='pendente')throw new Stop('validation','A solicitação já foi analisada.');
    r.status='cancelada';if(r.kind==='substituicao'){const a=S.asg.find(x=>x.id===r.asg);if(a&&a.status==='substituicao_solicitada')a.status=r.prev||'confirmado';recompute(S,r.shift);}
    log(S,u,'withdraw','req',r.shift,null,RK[r.kind]);},
  decide(S,u,rid,approve,txt,sub,reason){const r=S.reqs.find(x=>x.id===rid),s=shiftOf(S,r.shift);need(S,u,'requests.decide',s.unit);
    if(r.status!=='pendente')throw new Stop('validation','A solicitação já foi analisada.');
    if(!approve&&!txt.trim())throw new Stop('validation','Informe o motivo da recusa.');
    if(approve){
      if(r.kind==='candidatura')A.assign(S,u,s.id,r.prof,reason,true,true);
      else if(r.kind!=='alteracao'){const a=S.asg.find(x=>x.id===r.asg);const prev=a.status;a.status='removido';a.ended=r.kind==='substituicao'?'Substituição aprovada':'Cancelamento aprovado';
        if(sub){try{A.assign(S,u,s.id,sub,reason,false,true)}catch(e){a.status=prev;throw e}}
        if(recompute(S,s.id)==='descoberto')note(S,u,'shifts.manage','Plantão descoberto',label(s),{page:'escalas',shift:s.id},s.unit);}
    }else if(r.kind==='substituicao'){const a=S.asg.find(x=>x.id===r.asg);if(a&&a.status==='substituicao_solicitada')a.status=r.prev||'confirmado';recompute(S,s.id);}
    r.status=approve?'aprovada':'recusada';r.note=txt||null;r.decided=nowIso();r.by=u.name;
    log(S,u,approve?'approve':'reject','req',s.id,txt,`${RK[r.kind]} de ${profOf(S,r.prof).name}`);
    noteProf(S,u,r.prof,approve?'Solicitação aprovada':'Solicitação recusada',txt||label(s));},
  saveProf(S,u,f){need(S,u,'professionals.manage');if((f.name||'').trim().length<3)throw new Stop('validation','Informe o nome completo.');

    S.profs.push(p);log(S,u,'prof_create','prof',p.id,null,p.name);note(S,u,'documents.verify','Cadastro aguardando validação',p.name+' foi cadastrado(a).',{page:'prof',id:p.id});return p.id;},

  /* estoque */
  stockMove(S,u,f){need(S,u,'stock.manage');const it=itemOf(S,f.item);const qty=Math.round(+f.qty);
    if(!qty||qty<=0)throw new Stop('validation','Informe uma quantidade maior que zero.');if(!(f.reason||'').trim())throw new Stop('validation','Informe o motivo ou a referência da movimentação.');
    let lot=f.lot&&lotOf(S,f.lot);
    if(f.type==='entrada'){if(it.lotc&&!f.newLot&&!lot)throw new Stop('validation','Informe o lote.');
      if(f.newLot){if(!f.exp)throw new Stop('validation','Informe a validade do lote.');lot={id:'l'+uid(),item:it.id,lot:f.newLot,exp:f.exp,qty:0,unit:f.unit||'u1',status:'disponivel'};S.lots.push(lot);}
      if(!lot){lot=S.lots.find(l=>l.item===it.id);}
      lot.qty+=qty;}
    else{if(!lot)throw new Stop('validation','Selecione o lote.');if(lot.qty<qty)throw new Stop('validation',`Saldo insuficiente no lote ${lot.lot}: ${lot.qty} ${it.unit}.`);lot.qty-=qty;}
    S.moves.unshift({id:uid(),at:nowIso(),item:it.id,lot:lot.id,type:f.type,qty,reason:f.reason,ref:{entrada:'Entrada',saida:'Consumo',perda:'Perda',ajuste:'Ajuste de inventário'}[f.type],user:u.name});
    log(S,u,'stock_move','stock',null,f.reason,`${f.type} de ${qty} ${it.unit}: ${it.name} (${lot.lot})`);
    if(itemQty(S,it.id)<it.min)note(S,u,'stock.manage','Estoque baixo',`${it.name}: ${itemQty(S,it.id)} ${it.unit} (mínimo ${it.min}).`,{page:'estoque'});},
  immunize(S,u,f){need(S,u,'vaccines.apply');const pt=patOf(S,f.patient);if(!pt)throw new Stop('validation','Selecione o paciente.');if(!pt.active)throw new Stop('blocking','Paciente inativo.');
    if(!f.vac||!VAC[f.vac])throw new Stop('validation','Selecione a vacina.');
    const lot=lotOf(S,f.lot);if(!lot||itemOf(S,lot.item).vac!==f.vac)throw new Stop('validation','Selecione o lote utilizado.');
    if(lot.status!=='disponivel')throw new Stop('blocking','Este lote está em avaliação após ocorrência de temperatura e não pode ser usado.');
    if(lot.exp<today())throw new Stop('blocking','Lote vencido. Selecione outro lote.');if(lot.qty<1)throw new Stop('blocking','Lote sem saldo.');
    if(!f.dose)throw new Stop('validation','Informe a dose.');if(!f.via||!f.site)throw new Stop('validation','Informe a via e o local de aplicação.');
    const prof=u.prof||f.prof;if(!prof)throw new Stop('validation','Informe o profissional que aplicou.');
    const W=[];const dup=S.imm.find(i=>i.patient===pt.id&&i.status==='registrado'&&VAC[i.vac]&&VAC[i.vac].g===VAC[f.vac].g&&i.dose===f.dose&&!['Dose anual','Dose por gestação','Dose adicional'].includes(f.dose));
    if(dup)W.push(`Já existe ${f.dose.toLowerCase()} de ${VAC[f.vac].n} registrada em ${D2(dup.at)}. Confira a caderneta.`);
    enforce({blocking:[],warnings:W},f.reason);
    const im={id:'im'+uid(),at:nowIso(),patient:pt.id,vac:f.vac,item:lot.item,lot:lot.id,dose:f.dose,via:f.via,site:f.site,prof,unit:lot.unit,status:'registrado',origin:'aplicada',place:null,strategy:f.strategy||'Rotina',notes:(f.notes||'').trim(),reason:W.length?f.reason:null};
    S.imm.unshift(im);lot.qty-=1;S.moves.unshift({id:uid(),at:im.at,item:lot.item,lot:lot.id,type:'saida',qty:1,reason:`Aplicação em ${pt.name}`,ref:'Vacinação',user:u.name});
    log(S,u,'immunize','vaccine',pt.id,im.reason,`${pt.name}: ${VAC[f.vac].n}, ${f.dose}, lote ${lot.lot}, ${f.via.toLowerCase()}, ${f.site.toLowerCase()}`);
    if(itemQty(S,lot.item)<itemOf(S,lot.item).min)note(S,u,'stock.manage','Estoque baixo',`${itemOf(S,lot.item).name}: ${itemQty(S,lot.item)} doses.`,{page:'estoque'});return im.id;},
  immExternal(S,u,f){need(S,u,'vaccines.apply');const pt=patOf(S,f.patient);if(!pt)throw new Stop('validation','Selecione o paciente.');
    if(!f.vac||!f.dose||!f.date)throw new Stop('validation','Informe vacina, dose e data da aplicação.');if(f.date>today())throw new Stop('validation','A data não pode estar no futuro.');
    if(!(f.place||'').trim())throw new Stop('validation','Informe onde a dose foi aplicada (como consta na caderneta).');
    S.imm.push({id:'im'+uid(),at:at(f.date,'12:00'),patient:pt.id,vac:f.vac,item:null,lot:null,lotText:(f.lotText||'').trim()||null,dose:f.dose,via:VAC[f.vac].via,site:'Não informado',prof:u.prof||null,unit:null,status:'registrado',origin:'externa',place:f.place.trim(),strategy:'Transcrição',notes:'',by:u.name});
    S.imm.sort((a,b)=>b.at.localeCompare(a.at));log(S,u,'imm_external','vaccine',pt.id,null,`${pt.name}: ${VAC[f.vac].n}, ${f.dose}, ${D2(f.date)} (${f.place})`);},
  immunizeCancel(S,u,id,reason){need(S,u,'vaccines.manage');if(!reason.trim())throw new Stop('validation','Informe o motivo do cancelamento.');
    const im=S.imm.find(x=>x.id===id);if(im.status!=='registrado')return;im.status='cancelado';im.cancelReason=reason;const lot=lotOf(S,im.lot);
    if(lot){lot.qty+=1;S.moves.unshift({id:uid(),at:nowIso(),item:im.item,lot:im.lot,type:'estorno',qty:1,reason:`Estorno: ${reason}`,ref:'Vacinação',user:u.name});}
    log(S,u,'immunize_cancel','vaccine',im.patient,reason,`${VAC[im.vac].n}, ${patOf(S,im.patient).name}`);},
  reading(S,u,eq,temp){need(S,u,'coldchain.manage');const e=S.equip.find(x=>x.id===eq);const t=+String(temp).replace(',','.');
    if(Number.isNaN(t))throw new Stop('validation','Informe a temperatura.');
    S.readings.push({id:uid(),eq,at:nowIso(),temp:t,user:u.name});log(S,u,'reading','cold',null,null,`${e.name}: ${t.toLocaleString('pt-BR')} °C`);
    if(t<e.min||t>e.max){const lots=S.lots.filter(l=>l.unit===e.unit&&itemOf(S,l.item).cat==='Vacina'&&l.status==='disponivel').slice(0,2);
      S.occ.unshift({id:'oc'+uid(),eq,at:nowIso(),temp:t,status:'aberta',action:'',lots:lots.map(l=>l.id),note:null});lots.forEach(l=>l.status='em_avaliacao');
      note(S,u,'coldchain.manage','Ocorrência de temperatura',`${e.name}: ${t.toLocaleString('pt-BR')} °C, fora da faixa ${e.min}–${e.max} °C.`,{page:'temperatura'});return 'fora';}
    return 'ok';},
  occurrence(S,u,id,status,txt){need(S,u,'coldchain.manage');const o=S.occ.find(x=>x.id===id);if(!(txt||'').trim())throw new Stop('validation','Descreva as medidas adotadas ou o parecer técnico.');
    o.status=status;o.action=o.action||txt;o.note=txt;

    log(S,u,'occurrence','cold',id,txt,{em_avaliacao:'Em avaliação',liberado:'Lotes liberados após avaliação técnica',descartado:'Lotes descartados'}[status]);},
  visit(S,u,f){need(S,u,'homecare.manage');if(!f.patient||!f.prof||!f.date||!f.start)throw new Stop('validation','Preencha paciente, profissional, data e horário.');

  orgSave(S,u,kind,f){need(S,u,'org.manage');const L=orgList(S,kind);const nm=(f.name||'').trim();if(nm.length<2)throw new Stop('validation','Informe o nome.');

  /* ---------------- procedimentos */
  procAssign(S,u,f){if(!(can(S,u,'procedures.verify')||can(S,u,'homecare.manage')))throw new Stop('permission','Seu perfil não agenda procedimentos.');

    noteProf(S,u,f.prof,'Procedimento agendado para você',`${f.type}, ${patOf(S,f.patient).name}, ${D2(f.date)} às ${f.start}. Confirme a realização na Minha área.`);return x.id;},
  procRegister(S,u,f){need(S,u,'procedures.register');if(!u.prof)throw new Stop('permission','Apenas profissionais registram procedimentos realizados.');
    if(!f.patient||!f.type)throw new Stop('validation','Selecione paciente e procedimento.');if((f.notes||'').trim().length<5)throw new Stop('validation','Descreva o que foi realizado.');

    log(S,u,'proc_done','proc',f.patient,null,`${f.type}: ${patOf(S,f.patient).name}`);note(S,u,'procedures.verify','Procedimento aguardando conferência',`${u.name}: ${f.type}, ${patOf(S,f.patient).name}`,{page:'procedimentos'});},
  procDone(S,u,id,notes){const x=S.procs.find(y=>y.id===id);if(!x||x.prof!==u.prof)throw new Stop('permission','Procedimento não encontrado na sua lista.');
    if(!['agendado','devolvido'].includes(x.status))throw new Stop('validation','Este procedimento já foi registrado.');if((notes||'').trim().length<5)throw new Stop('validation','Descreva o que foi realizado.');
    x.status='realizado';x.notes=notes.trim();x.doneAt=nowIso();log(S,u,'proc_done','proc',x.patient,null,`${x.type}: ${patOf(S,x.patient).name}`);

  procNot(S,u,id,reason){const x=S.procs.find(y=>y.id===id);if(!x||x.prof!==u.prof)throw new Stop('permission','Procedimento não encontrado na sua lista.');
    if(!(reason||'').trim())throw new Stop('validation','Informe por que não foi realizado.');x.status='nao_realizado';x.notes=reason.trim();x.doneAt=nowIso();
    log(S,u,'proc_not','proc',x.patient,reason,`${x.type}: ${patOf(S,x.patient).name}`);note(S,u,'procedures.verify','Procedimento não realizado',`${u.name}: ${x.type}, ${patOf(S,x.patient).name}. ${reason}`,{page:'procedimentos'});},
  procVerify(S,u,id,ok,txt){need(S,u,'procedures.verify');const x=S.procs.find(y=>y.id===id);if(!['realizado','nao_realizado'].includes(x.status))throw new Stop('validation','Nada para conferir neste procedimento.');
    if(!ok&&!(txt||'').trim())throw new Stop('validation','Diga o que precisa ser corrigido.');

    log(S,u,ok?'proc_ok':'proc_back','proc',x.patient,ok?null:txt,`${x.type}: ${patOf(S,x.patient).name}`);
    noteProf(S,u,x.prof,ok?'Procedimento conferido':'Procedimento devolvido para correção',`${x.type}, ${patOf(S,x.patient).name}${ok?'':'. '+txt}`);},
  /* ---------------- enfermagem estética */
  aesAppt(S,u,f){need(S,u,'aesthetic.manage');if(!f.patient||!f.cat||!f.prof||!f.date||!f.start)throw new Stop('validation','Preencha cliente, procedimento, profissional, data e horário.');
    const c=S.aesCat.find(x=>x.id===f.cat);const end=m=>{const[h,mi]=m.split(':').map(Number);const t=h*60+mi+c.dur;return pad(Math.floor(t/60))+':'+pad(t%60)};
    const clash=S.aesAppts.find(a=>a.prof===f.prof&&a.date===f.date&&!['cancelado','faltou'].includes(a.status)&&a.start<end(f.start)&&end(a.start)>f.start);
    if(clash)throw new Stop('blocking',`${profOf(S,f.prof).name} já tem atendimento às ${clash.start} neste dia.`);
    const pkg=S.aesPkgs.find(k=>k.patient===f.patient&&k.cat===f.cat&&k.status==='ativo');
    S.aesAppts.push({id:'aa'+uid(),patient:f.patient,cat:f.cat,date:f.date,start:f.start,prof:f.prof,status:'agendado',pkg:pkg?pkg.id:null,consent:false,notes:'',products:'',doneAt:null});
    log(S,u,'aes_appt','aes',f.patient,null,`${c.name}: ${patOf(S,f.patient).name}, ${D2(f.date)} ${f.start}`);noteProf(S,u,f.prof,'Novo atendimento de estética',`${c.name}, ${patOf(S,f.patient).name}, ${D2(f.date)} às ${f.start}`);},
  aesStatus(S,u,id,st){const a=S.aesAppts.find(x=>x.id===id);if(!(can(S,u,'aesthetic.manage')||(u.prof===a.prof&&can(S,u,'aesthetic.perform'))))throw new Stop('permission','Sem permissão.');
    a.status=st;log(S,u,'aes_status','aes',a.patient,null,`${aesCatOf(S,a.cat).name}: ${patOf(S,a.patient).name}, ${{confirmado:'confirmado',cancelado:'cancelado',faltou:'falta registrada'}[st]||st}`);},
  aesAnam(S,u,pid,f){if(!(can(S,u,'aesthetic.perform')||can(S,u,'aesthetic.manage')))throw new Stop('permission','Sem permissão.');if(!(f.complaint||'').trim())throw new Stop('validation','Informe a queixa principal.');
    patOf(S,pid).aes={at:today(),complaint:f.complaint.trim(),reported:(f.reported||'').trim(),notes:(f.notes||'').trim()};log(S,u,'aes_anam','aes',pid,null,patOf(S,pid).name);},
  aesSession(S,u,id,f){need(S,u,'aesthetic.perform');const a=S.aesAppts.find(x=>x.id===id);const pt=patOf(S,a.patient);
    if(!['agendado','confirmado'].includes(a.status))throw new Stop('validation','Este atendimento não está em aberto.');
    if(!pt.aes)throw new Stop('blocking','Registre a anamnese estética do cliente antes da primeira sessão.');
    if(!f.consent)throw new Stop('blocking','Confirme que o termo de consentimento foi assinado pelo cliente.');
    if((f.notes||'').trim().length<10)throw new Stop('validation','Descreva a sessão (mínimo de 10 caracteres).');
    a.status='realizado';a.consent=true;a.notes=f.notes.trim();a.products=(f.products||'').trim();a.doneAt=nowIso();a.by=u.name;
    const k=a.pkg&&S.aesPkgs.find(x=>x.id===a.pkg);if(k){k.used=Math.min(k.total,k.used+1);if(k.used>=k.total)k.status='concluido'}
    log(S,u,'aes_session','aes',pt.id,null,`${aesCatOf(S,a.cat).name}: ${pt.name}${k?` (sessão ${k.used} de ${k.total})`:''}`);},
  aesPkg(S,u,f){need(S,u,'aesthetic.manage');const c=aesCatOf(S,f.cat);if(!f.patient||!c)throw new Stop('validation','Selecione cliente e procedimento.');
    const n=Math.max(1,Math.round(+f.total||0)),v=+String(f.price).replace(/\./g,'').replace(',','.');if(!v||v<=0)throw new Stop('validation','Informe o valor do pacote.');

function childStatus(S,pt){
  if(!pt.birth)return null;const am=ageMonths(pt.birth);if(am>=120)return null;
  const recs=S.imm.filter(i=>i.patient===pt.id&&i.status==='registrado');
  return CAL_CHILD.map(row=>({...row,items:row.items.map(([v,dose,core,note])=>{
    const r=recs.find(i=>VAC[i.vac]&&VAC[i.vac].g===VAC[v].g&&i.dose===dose);
    const due=addMonthsKey(pt.birth,row.m);let st=r?'aplicada':!core?'condicional':am>=row.m+1?'atrasada':am>=row.m?'agora':'prevista';
    if(!r&&v==='rota'&&((dose==='1ª dose'&&am>=12)||(dose==='2ª dose'&&am>=24)))st='janela';
    return {v,dose,core,note,rec:r,due,st}})}));
}

  useEffect(()=>{if(u&&page.page==='inicio'&&!isManager(S,u))setPage({page:'meu'})},[uidv]);
  const setTheme=t=>{setThemeS(t);lsSet(TKEY,t);if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)};
  const toast=(msg,tone='ok')=>{const id=uid();setToasts(t=>[...t,{id,msg,tone}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),tone==='error'?6000:3400)};
  const run=(fn,msg)=>{try{const D=structuredClone(S);const r=fn(D,u);setS(D);if(msg)toast(typeof msg==='function'?msg(r):msg);return{ok:true,data:r}}
    catch(e){if(e instanceof Stop){if(!e.checks)toast(e.msg,'error');return{ok:false,kind:e.kind,msg:e.msg,checks:e.checks}}console.error(e);toast('Algo deu errado nesta ação.','error');return{ok:false}}};
  const go=p=>{setPage(p);window.scrollTo({top:0,behavior:'smooth'})};

  const value={S,u,run,toast,go,page,login,logout,reset,theme,setTheme,openPicker:()=>setPicker(true),setRoute};
  return html`<${Ctx.Provider} value=${value}>

  const doMove=(s,date,reason)=>{if(dkey(s.start)===date)return;const r=run((D,U)=>A.move(D,U,s.id,date,reason),'Plantão movido.');if(r.ok){setPm(null);setPmR('')}else if(r.checks)setPm({s,date,c:r.checks,blocking:r.kind==='blocking'})};

/* grade de horários: dias em colunas, plantões posicionados pelo horário, cores por setor */
function TimeGrid({S,days,byDay,T,onOpen,dnd,drag,canManage,onNew}){
  const H=58;const all=days.flatMap(d=>byDay[d]||[]);
  const sh=v=>{const d=new Date(v);return d.getHours()+d.getMinutes()/60};
  let h0=6,h1=20;all.forEach(s=>{h0=Math.min(h0,Math.floor(sh(s.start)));const e=dkey(s.end)!==dkey(s.start)?24:Math.ceil(sh(s.end));h1=Math.max(h1,e)});h1=Math.min(24,h1);
  const hrs=[];for(let h=h0;h<h1;h++)hrs.push(h);
  const [nowT,setNow]=useState(Date.now());useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),60000);return()=>clearInterval(t)},[]);
  const nowH=sh(new Date(nowT).toISOString());const one=days.length===1;
  const lay=list=>{const ev=list.map(s=>{const a=sh(s.start),b=dkey(s.end)!==dkey(s.start)?24:sh(s.end);return{s,a,b:Math.max(b,a+.5)}}).sort((x,y)=>x.a-y.a);const ends=[];
    ev.forEach(e=>{let l=ends.findIndex(t=>t<=e.a+.001);if(l<0){l=ends.length;ends.push(0)}ends[l]=e.b;e.l=l});ev.forEach(e=>{e.n=Math.max(1,...ev.filter(o=>o.a<e.b&&o.b>e.a).map(o=>o.l+1))});return ev};
  return html`<div className="card-sh overflow-hidden rounded-[24px] bg-panel"><div className="no-scrollbar overflow-x-auto"><div style=${{minWidth:one?0:days.length*150+64}}>
    <div className="grid border-b border-line/70 bg-panel" style=${{gridTemplateColumns:`64px repeat(${days.length},minmax(0,1fr))`}}>
      <div className="px-2 py-3 text-[11px] font-semibold text-faint">${days.length>1?'GMT-3':''}</div>
      ${days.map(d=>html`<div key=${d} className="p-1.5"><div className=${cx('flex items-center justify-center gap-2 rounded-2xl px-2 py-2.5',d===T?'bg-navy text-onnavy':'bg-panel2')}>
        <span className=${cx('text-[11px] font-bold uppercase',d===T?'opacity-80':'text-faint')}>${F(d,{weekday:'short'}).replace('.','')}</span><span className="text-[22px] font-semibold leading-none">${F(d,{day:'2-digit'})}</span>
        <span className=${cx('text-[11px]',d===T?'opacity-70':'text-faint')}>${(byDay[d]||[]).length||''}</span></div></div>`)}</div>
    <div className="relative grid" style=${{gridTemplateColumns:`64px repeat(${days.length},minmax(0,1fr))`}}>
      <div className="relative">${hrs.map(h=>html`<div key=${h} className="pr-2 text-right text-[11px] font-semibold text-faint" style=${{height:H}}><span className="-translate-y-2 inline-block">${pad(h)}:00</span></div>`)}</div>
      ${days.map(d=>{const ev=lay(byDay[d]||[]);return html`<div key=${d} ...${dnd(d)} className=${cx('hours-bg relative border-l border-line/60 transition',d===T&&'bg-p3/10',drag===d&&'bg-p4/30')} style=${{'--hh':H+'px',height:hrs.length*H}}
          onDoubleClick=${e=>{if(!canManage)return;const r=e.currentTarget.getBoundingClientRect();onNew(d,Math.min(23,h0+Math.floor((e.clientY-r.top)/H)))}}>
        ${d===T&&nowH>=h0&&nowH<=h1&&html`<div className="pointer-events-none absolute inset-x-0 z-10 border-t-2 border-dashed border-danger/70" style=${{top:(nowH-h0)*H}}><span className="absolute -left-1 -top-[5px] h-2 w-2 rounded-full bg-danger"></span></div>`}
        ${ev.map(({s,a,b,l,n})=>html`<div key=${s.id} className="absolute px-1" style=${{top:(a-h0)*H+2,height:Math.max(34,(b-a)*H-4),left:`${l/n*100}%`,width:`${100/n}%`}}><${ShiftCard} S=${S} s=${s} grid onOpen=${()=>onOpen(s.id)} draggable=${canManage&&s.status!=='cancelado'&&s.status!=='rascunho'||canManage&&s.status==='rascunho'}/></div>`)}
      </div>`})}</div></div></div>
    ${canManage&&html`<p className="border-t border-line/60 px-4 py-2 text-[12px] text-faint">Arraste um plantão para outro dia para movê-lo. Dê dois cliques em um horário vazio para criar um plantão.</p>`}</div>`;
}

    ${(draft||canc||s.status==='substituicao_solicitada'||flag)&&html`<div className="mt-1.5 flex flex-wrap gap-1">${(draft||canc||s.status==='substituicao_solicitada')&&html`<span className="rounded-full bg-panel px-2 py-0.5 text-[10px] font-bold text-soft">${SST[s.status][0]}</span>`}
      ${flag&&html`<span className="inline-flex items-center gap-0.5 rounded-full bg-amberbg px-2 py-0.5 text-[10px] font-bold text-amber"><${Icon} n="alert" s=${10}/>exceção</span>`}</div>`}</button>`;

function ShiftForm({init,onClose,onSaved}){
  const {S,u,run}=useApp();const sh=init.shift;const units=S.units.filter(x=>!x.archived&&can(S,u,'shifts.manage',x.id));
  const [f,setF]=useState(()=>sh?{id:sh.id,unit:sh.unit,service:sh.service||'',date:dkey(sh.start),start:hm(sh.start),end:hm(sh.end),brk:sh.brk,cat:sh.cat||'',slots:sh.slots,comps:sh.comps.join(', '),notes:sh.notes||''}
    :{unit:units[0]&&units[0].id,service:'',date:init.date,start:init.start||'07:00',end:init.start?pad((+init.start.slice(0,2)+6)%24)+':00':'13:00',brk:15,cat:'tecnico_enfermagem',slots:1,comps:'Sala de vacinação',notes:''});
  const [c,setC]=useState(null);const [bl,setBl]=useState(false);const [reason,setReason]=useState('');const [err,setErr]=useState(null);
  const set=k=>e=>{setF({...f,[k]:e.target.value});if(bl){setC(null);setBl(false)}};

function ReqItem({r,decide}){
  const {S,run}=useApp();const s=shiftOf(S,r.shift),p=profOf(S,r.prof);
  const [mode,setMode]=useState(null);const [n,setN]=useState('');const [sub,setSub]=useState('');const [c,setC]=useState(null);const [bl,setBl]=useState(false);const [reason,setReason]=useState('');
  const cands=S.profs.filter(x=>x.active&&x.id!==r.prof&&(!s.cat||x.cat===s.cat));
  const freed=useMemo(()=>{if(r.kind==='candidatura'||!r.asg)return S;const D=structuredClone(S);const a=D.asg.find(x=>x.id===r.asg);if(a)a.status='removido';return D},[S,r]);
  const st=pid=>{const k=checks(freed,shiftOf(freed,s.id),pid);return k.blocking.length?'b':k.warnings.length?'w':''};
  const subCheck=sub&&r.kind!=='candidatura'?checks(freed,shiftOf(freed,s.id),sub):null;
  const go=ok=>{const x=run((D,U)=>A.decide(D,U,r.id,ok,n,ok?sub||null:null,reason),ok?'Solicitação aprovada.':'Solicitação recusada.');if(!x.ok&&x.checks){setC(x.checks);setBl(x.kind==='blocking')}};
  return html`<article className="rounded-[28px] bg-panel p-5 card-sh">
    <div className="flex items-start gap-3"><${Avatar} name=${p.name} size=${44}/><div className="min-w-0 flex-1"><p className="font-bold">${p.name}</p><p className="text-[13px] text-soft">pediu ${RK[r.kind].toLowerCase()}</p></div><${Badge} tone=${RST[r.status][1]}>${RST[r.status][0]}<//></div>
    <div className="mt-4 rounded-[20px] bg-navy p-4 text-onnavy"><p className="text-[12px] opacity-70">${cap(F(s.start,{weekday:'long',day:'2-digit',month:'2-digit'}))}</p><p className="thin text-[30px] leading-tight">${hm(s.start)}–${hm(s.end)}</p><p className="text-[13px] opacity-80">${unitOf(S,s.unit).name}${s.service?' / '+servOf(S,s.service).name:''}</p></div>
    ${r.reason&&html`<p className="mt-3 rounded-[18px] bg-panel2 px-4 py-2.5 text-sm">“${r.reason}”</p>`}${r.note&&html`<p className="mt-2 text-sm text-soft">Resposta${r.by?' de '+r.by:''}: ${r.note}</p>`}
    <p className="mt-2 text-xs text-faint">Enviada em ${F(r.created,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</p>
    ${decide&&!mode&&html`<div className="mt-4 flex gap-2"><${Btn} v="lime" onClick=${()=>setMode('ok')}>Aprovar<//><${Btn} onClick=${()=>setMode('no')}>Recusar<//></div>`}
    ${decide&&mode&&html`<div className="mt-4 space-y-3">
      ${mode==='ok'&&(r.kind==='substituicao'||r.kind==='cancelamento')&&html`<${Field} label="Substituto" id=${'sub'+r.id} hint="Passa pelas mesmas regras da escala."><select id=${'sub'+r.id} className=${inputCls} value=${sub} onChange=${e=>{setSub(e.target.value);setC(null);setReason('')}}>
        <option value="">Sem substituto agora (a vaga fica descoberta)</option>${cands.map(x=>{const k=st(x.id);return html`<option key=${x.id} value=${x.id} disabled=${k==='b'}>${x.name}${k==='b'?' (indisponível)':k==='w'?' (com alertas)':''}</option>`})}</select><//>`}
      ${subCheck&&!c&&html`<${Checks} c=${subCheck}/>`}${mode==='ok'&&r.kind==='alteracao'&&html`<p className="text-sm text-soft">Aprovar registra a decisão. Faça a alteração no calendário.</p>`}
      <${Field} label=${mode==='no'?'Motivo da recusa':'Mensagem ao profissional (opcional)'} id=${'n'+r.id}><textarea id=${'n'+r.id} className=${inputCls+' min-h-[56px]'} value=${n} onInput=${e=>setN(e.target.value)}></textarea><//>
      ${c&&html`<${Override} c=${c} reason=${reason} setReason=${setReason} blocking=${bl}/>`}
      <div className="flex justify-end gap-2"><${Btn} onClick=${()=>{setMode(null);setC(null)}}>Voltar<//>${mode==='ok'?html`<${Btn} v="lime" disabled=${bl||(c&&!reason.trim())} onClick=${()=>go(true)}>${c?'Autorizar e aprovar':'Confirmar aprovação'}<//>`:html`<${Btn} v="danger" disabled=${!n.trim()} onClick=${()=>go(false)}>Confirmar recusa<//>`}</div></div>`}</article>`;
}

/* ------------------------------------------------------------------ profissionais */

  const T=today(),ws=weekStart(T);
  const wh=pid=>S.asg.filter(a=>a.prof===pid&&ACTIVE(a.status)).map(a=>shiftOf(S,a.shift)).filter(s=>s.status!=='cancelado'&&dkey(s.start)>=ws&&dkey(s.start)<addDays(ws,7)).reduce((t,s)=>t+hours(s.start,s.end,s.brk),0);
  return html`<div><${PageHead} title="Profissionais" desc="Equipe assistencial, validação de cadastro, competências e carga da semana." actions=${can(S,u,'professionals.manage')&&html`<${Btn} v="lime" icon="plus" onClick=${()=>setNw(true)}>Novo profissional<//>`}/>

      <select id="pv" className=${inputCls+' bg-panel'} aria-label="Validação" value=${v} onChange=${e=>setV(e.target.value)}><option value="">Qualquer validação</option>${Object.entries(VST).map(([k,l])=>html`<option key=${k} value=${k}>${l[0]}</option>`)}</select></div>
    ${rows.length===0?html`<${Empty} title="Nenhum profissional encontrado"/>`:html`<div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">${rows.map(p=>{const h=wh(p.id),lim=p.maxWeek||S.rules.week;return html`<button key=${p.id} onClick=${()=>go({page:'prof',id:p.id})} className=${cx('group rounded-[26px] bg-panel p-5 text-left card-sh transition hover:ring-2 hover:ring-lime',!p.active&&'opacity-60')}>
      <div className="flex items-start gap-3"><${Avatar} name=${p.name} size=${46}/><div className="min-w-0 flex-1"><p className="truncate font-bold">${p.name}</p><p className="text-[13px] text-soft">${CAT[p.cat]}</p><p className="text-xs text-faint">${p.council} ${p.num}/${p.uf}</p></div><${Icon} n="ur" className="text-faint group-hover:text-teal"/></div>
      <div className="mt-4 flex flex-wrap gap-1.5"><${Badge} tone=${VST[p.validation][1]}>${VST[p.validation][0]}<//>${!p.active&&html`<${Badge}>Inativo<//>`}${S.users.some(x=>x.prof===p.id)&&html`<${Badge} tone="sky">Usa a Minha área<//>`}</div>
      <div className="mt-4"><div className="mb-1 flex justify-between text-[12px] text-faint"><span>Semana</span><span>${fmtH(h)} de ${fmtH(lim)}</span></div><div className="h-2 rounded-full bg-panel2"><div className=${cx('h-full rounded-full',h>lim?'bg-amber':'bg-lime')} style=${{width:Math.min(100,h/lim*100)+'%'}}></div></div></div></button>`})}</div>`}
    ${nw&&html`<${Modal} open wide onClose=${()=>setNw(false)} title="Novo profissional" desc="O cadastro começa com validação pendente até a verificação dos documentos."><${ProfForm} onDone=${id=>{setNw(false);if(id)go({page:'prof',id})}}/><//>`}</div>`;
}

    <${Field} label="Telefone" id="pf-t" className="sm:col-span-3"><input id="pf-t" className=${inputCls} value=${f.phone} onInput=${set('phone')}/><//>
    <${Field} label="Conselho" id="pf-co" className="sm:col-span-2"><input id="pf-co" className=${inputCls} value=${f.council} onInput=${set('council')}/><//>
    <${Field} label="Número do registro" id="pf-nu" className="sm:col-span-3"><input id="pf-nu" className=${inputCls} value=${f.num} onInput=${set('num')}/><//>
    <${Field} label="UF" id="pf-uf" className="sm:col-span-1"><input id="pf-uf" maxLength="2" className=${inputCls+' uppercase'} value=${f.uf} onInput=${set('uf')}/><//>
    <${Field} label="Competências" id="pf-cp" hint="Separe por vírgula. São comparadas com as exigidas em cada plantão." className="sm:col-span-6"><input id="pf-cp" className=${inputCls} value=${f.comps} onInput=${set('comps')}/><//>

    ${err&&html`<p role="alert" className="rounded-2xl bg-dangerbg px-4 py-2.5 text-sm text-danger sm:col-span-6">${err}</p>`}
    <div className="flex justify-end sm:col-span-6"><${Btn} type="submit" v="lime">${p?'Salvar alterações':'Cadastrar profissional'}<//></div></form>`;
}

  return html`<div className="space-y-5"><${PageHead} back=${()=>go({page:'profissionais'})} title=${p.name} desc=${`${CAT[p.cat]}, ${p.council} ${p.num}/${p.uf}`}
    actions=${html`${can(S,u,'documents.verify')&&html`<select id="val" aria-label="Validação" className=${inputCls+' h-10 w-48 bg-panel py-1.5'} value=${p.validation} onChange=${e=>run((D,U)=>A.validate(D,U,id,e.target.value),'Situação de validação atualizada.')}>${Object.entries(VST).map(([k,l])=>html`<option key=${k} value=${k}>${l[0]}</option>`)}</select>`}
      ${manage&&html`<${Btn} icon="pencil" onClick=${()=>setEdit(true)}>Editar<//><${Btn} v=${p.active?'danger':'soft'} onClick=${()=>run((D,U)=>A.setActive(D,U,id,!p.active),p.active?'Profissional desativado. Plantões já publicados não mudam.':'Profissional reativado.')}>${p.active?'Desativar':'Reativar'}<//><${Btn} v="danger" icon="trash" onClick=${()=>setDel(true)}>Excluir<//>`}`}/>
    <div className="grid gap-3 sm:grid-cols-4">${[['Validação',html`<${Badge} tone=${VST[p.validation][1]}>${VST[p.validation][0]}<//>`],['E-mail',p.email||'Não informado'],['Telefone',p.phone||'Não informado'],['Unidades',p.units.length?p.units.map(x=>unitOf(S,x).name).join(', '):'Qualquer unidade']].map(([k,v])=>html`<div key=${k} className="rounded-[22px] bg-panel p-4 card-sh"><p className="text-[12px] text-faint">${k}</p><div className="mt-1 truncate text-sm font-semibold">${v}</div></div>`)}</div>

          <span className="w-40 shrink-0 font-semibold">${cap(F(s.start,{weekday:'short',day:'2-digit',month:'2-digit'}))} ${hm(s.start)}</span><span className="min-w-0 flex-1 truncate text-soft">${unitOf(S,s.unit).name}</span><${Badge} tone=${AST[a.status][1]}>${AST[a.status][0]}<//></button></li>`)}</ul>`}<//></div></div>
    ${edit&&html`<${Modal} open wide onClose=${()=>setEdit(false)} title="Editar cadastro"><${ProfForm} p=${p} onDone=${()=>setEdit(false)}/><//>`}

function Avail({p,readOnly}){
  const {run}=useApp();const [slots,setSlots]=useState(p.avail.map(x=>({...x})));const [max,setMax]=useState(p.maxWeek||'');const [dirty,setDirty]=useState(false);
  const upd=fn=>{setSlots(fn);setDirty(true)};
  return html`<div className="space-y-4"><p className="text-sm text-soft">Disponibilidade não é escala: alterar aqui não muda plantões já publicados.</p>
    <div className="space-y-1.5">${[1,2,3,4,5,6,0].map(w=>{const ds=slots.map((s,i)=>({s,i})).filter(x=>x.s.wd===w);return html`<div key=${w} className="flex flex-wrap items-center gap-2 rounded-[18px] bg-panel2 px-3 py-2">
      <span className="w-20 text-sm font-bold">${WD[w]}</span>${!ds.length&&html`<span className="text-sm text-faint">Indisponível</span>`}
      ${ds.map(({s,i})=>html`<span key=${i} className="inline-flex items-center gap-1 rounded-full bg-panel px-2.5 py-1">
        <input type="time" aria-label="Início" className="w-[5.4rem] bg-transparent text-sm" disabled=${readOnly} value=${s.s} onChange=${e=>upd(xs=>xs.map((x,j)=>j===i?{...x,s:e.target.value}:x))}/><span className="text-faint">às</span>
        <input type="time" aria-label="Término" className="w-[5.4rem] bg-transparent text-sm" disabled=${readOnly} value=${s.e} onChange=${e=>upd(xs=>xs.map((x,j)=>j===i?{...x,e:e.target.value}:x))}/>
        ${!readOnly&&html`<button className="text-faint hover:text-danger" aria-label="Remover faixa" onClick=${()=>upd(xs=>xs.filter((_,j)=>j!==i))}><${Icon} n="x" s=${14}/></button>`}</span>`)}
      ${!readOnly&&html`<button className="ml-auto inline-flex items-center gap-1 rounded-full bg-panel px-3 py-1 text-[13px] font-semibold hover:bg-lime hover:text-onlime" onClick=${()=>upd(xs=>[...xs,{wd:w,s:'07:00',e:'19:00'}])}><${Icon} n="plus" s=${12}/>Faixa</button>`}</div>`})}</div>
    <div className="flex flex-wrap items-end gap-3"><${Field} label="Carga semanal máxima (h)" id=${'mx'+p.id} hint="Vazio = referência da instituição."><input id=${'mx'+p.id} type="number" min="1" max="168" disabled=${readOnly} className=${inputCls+' w-40'} value=${max} onInput=${e=>{setMax(e.target.value);setDirty(true)}}/><//>
      ${!readOnly&&html`<${Btn} v="lime" className="ml-auto" disabled=${!dirty} onClick=${()=>{const r=run((D,U)=>A.availability(D,U,p.id,slots,+max||null),'Disponibilidade salva. Plantões publicados não mudaram.');if(r.ok)setDirty(false)}}>Salvar disponibilidade<//>`}</div></div>`;
}

      <${Field} label="De" id=${'af'+p.id}><input id=${'af'+p.id} type="date" className=${inputCls+' bg-panel'} value=${from} onChange=${e=>{setFrom(e.target.value);if(!to)setTo(e.target.value)}}/><//>
      <${Field} label="Até" id=${'at'+p.id}><input id=${'at'+p.id} type="date" className=${inputCls+' bg-panel'} value=${to} onChange=${e=>setTo(e.target.value)}/><//>

      <div className="flex items-end"><${Btn} v="lime" className="w-full" disabled=${!from||!to} onClick=${()=>{const r=run((D,U)=>A.absence(D,U,p.id,k,from,to,n),'Período registrado. Plantões publicados não mudam: peça substituição se precisar.');if(r.ok){setFrom('');setTo('');setN('')}}}>Registrar<//></div></div>`}
    <p className="text-xs text-faint">Férias, licenças e afastamentos impedem novas escalas. “Indisponível” só gera alerta para a gestão.</p></div>`;
}

    <div className="grid gap-5 xl:grid-cols-[1.6fr_1fr]">

        <div className="grid gap-3 md:grid-cols-2">${list.map(c=>html`<article key=${c.id} className="rounded-[24px] bg-panel2 p-4">
          <div className="flex items-start gap-3"><${Avatar} name=${c.name} size=${42}/><div className="min-w-0 flex-1"><p className="font-bold">${c.name}</p><p className="text-[13px] text-soft">${CAT[c.cat]}</p></div><${Badge} tone=${TST[c.status][1]}>${TST[c.status][0]}<//></div>
          <p className="mt-3 flex items-center gap-1.5 text-[13px] text-soft"><${Icon} n="pin" s=${13}/>${c.region}</p><p className="mt-1 flex items-center gap-1.5 text-[13px] text-soft"><${Icon} n="clock" s=${13}/>${c.avail}</p>
          <div className="mt-3 flex flex-wrap gap-1">${c.comps.map(x=>html`<span key=${x} className="rounded-full bg-panel px-2.5 py-0.5 text-[11px] font-semibold">${x}</span>`)}</div>
          ${next[c.status]&&html`<div className="mt-4 flex gap-2"><${Btn} size="sm" v="lime" onClick=${()=>run((D,U)=>A.talent(D,U,c.id,next[c.status][0]),`${c.name}: ${TST[next[c.status][0]][0].toLowerCase()}.`)}>${next[c.status][1]}<//>${c.status!=='disponivel'&&html`<${Btn} size="sm" className="bg-panel" onClick=${()=>run((D,U)=>A.talent(D,U,c.id,'recusado'),'Processo encerrado.')}>Encerrar<//>`}</div>`}
          <button className="mt-3 text-[12.5px] font-semibold text-faint hover:text-danger" onClick=${()=>run((D,U)=>A.candRemove(D,U,c.id),c.name+' removido do banco.')}>Remover do banco</button></article>`)}</div><//>
      <${Card} title="Oportunidades abertas"><ul className="space-y-2">${S.opps.map(o=>html`<li key=${o.id} className="rounded-[20px] bg-navy p-4 text-onnavy"><p className="font-bold">${o.title}</p><p className="mt-1 text-[13px] opacity-75">${unitOf(S,o.unit).name}, ${o.period}</p>

        <p className="mt-3 text-xs text-faint">Cadastro no banco não cria vínculo de trabalho nem autoriza compartilhar dados sem consentimento.</p><//></div>

        <div className="grid gap-4 sm:grid-cols-2"><${Field} label="Unidade" id="op-u"><select id="op-u" className=${inputCls} value=${f.unit} onChange=${e=>setF({...f,unit:e.target.value})}>${S.units.map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//>
          <${Field} label="Categoria" id="op-c"><select id="op-c" className=${inputCls} value=${f.cat} onChange=${e=>setF({...f,cat:e.target.value})}>${Object.entries(CAT).map(([k,l])=>html`<option key=${k} value=${k}>${l}</option>`)}</select><//></div>
        <div className="grid gap-4 sm:grid-cols-[2fr_1fr]"><${Field} label="Período" id="op-p"><input id="op-p" className=${inputCls} placeholder="Ex.: manhãs, segunda a sexta" value=${f.period} onInput=${e=>setF({...f,period:e.target.value})}/><//>
          <${Field} label="Vagas" id="op-s"><input id="op-s" type="number" min="1" className=${inputCls} value=${f.slots} onInput=${e=>setF({...f,slots:e.target.value})}/><//></div></div><//>`}</div>`;

/* ------------------------------------------------------------------ equipe */
function Equipe(){
  const {S,u,run}=useApp();const [st,setSt]=useState(S.rolePerms);const [dirty,setDirty]=useState(false);const roles=['admin','gestor','rt','prof'];let last='';
  return html`<div className="space-y-5"><${PageHead} title="Equipe e acessos" desc="Quem acessa a MedLink e o que cada perfil pode fazer."/>
    <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">${S.users.map(x=>html`<div key=${x.id} className="rounded-[24px] bg-panel p-4 card-sh"><${Avatar} name=${x.name} size=${44}/><p className="mt-3 font-bold">${x.name}${x.id===u.id?' (você)':''}</p><p className="text-[13px] text-soft">${ROLE[x.role]}</p><p className="mt-1 text-xs text-faint">${x.role==='prof'?'Minha área':x.units?'Unidade Taquaral':'Todas as unidades'}</p></div>`)}</div>
    <${Card} title="Permissões por perfil" sub="A administradora sempre tem tudo. Tire uma permissão de um perfil e entre com ele para ver o efeito." action=${dirty&&html`<${Btn} v="lime" size="sm" onClick=${()=>{let ok=true;['gestor','rt','prof'].forEach(r=>{if(ok)ok=run((D,U)=>A.perms(D,U,r,st[r])).ok});if(ok)setDirty(false);if(ok){setDirty(false)}}}>Salvar permissões<//>`}>
      <${Table} minW=${620} cols=${['Permissão',...roles.map(r=>ROLE[r])]} rows=${Object.entries(PERMS).flatMap(([k,[l,g]])=>{const head=g!==last?(last=g,html`<tr key=${'g'+g}><td colSpan="5" className="px-2 pb-1 pt-4 text-[11px] font-bold uppercase tracking-wider text-faint">${g}</td></tr>`):null;
        return [head,html`<tr key=${k}><${TD}>${l}<//>${roles.map(r=>html`<${TD} key=${r} className="text-center"><input type="checkbox" className="h-4 w-4" aria-label=${l+': '+ROLE[r]} checked=${(st[r]||[]).includes(k)} disabled=${r==='admin'} onChange=${e=>{setSt({...st,[r]:e.target.checked?[...st[r],k]:st[r].filter(x=>x!==k)});setDirty(true)}}/><//>`)}</tr>`]})}/><//></div>`;
}

/* ------------------------------------------------------------------ minha área */
function MinhaArea(){
  const {S,u,run,go,page}=useApp();const p=profOf(S,u.prof);const [tab,setTab]=useState(page.tab||'escala');const [reg,setReg]=useState(false);const [doing,setDoing]=useState(null);
  useEffect(()=>{if(page.tab)setTab(page.tab);if(page.nw&&page.tab==='procs')setReg(true)},[page]);
  if(!p)return html`<${Empty} title="Este perfil não tem cadastro profissional">Entre como Carla Mendes ou Paulo Santos para ver a área do profissional.<//>`;
  const now=new Date(),T=today();const mine=S.asg.filter(a=>a.prof===p.id).map(a=>({a,s:shiftOf(S,a.shift)})).filter(x=>x.s&&x.s.status!=='rascunho');
  const active=mine.filter(x=>ACTIVE(x.a.status)&&x.s.status!=='cancelado');const up=active.filter(x=>new Date(x.s.end)>now).sort((a,b)=>a.s.start.localeCompare(b.s.start));
  const next=up[0];const ws=weekStart(T);const week=[...Array(7)].map((_,i)=>addDays(ws,i));
  const wh=active.filter(x=>dkey(x.s.start)>=ws&&dkey(x.s.start)<addDays(ws,7)).reduce((t,x)=>t+hours(x.s.start,x.s.end,x.s.brk),0);
  const myIds=new Set(active.map(x=>x.s.id));const applied=new Set(S.reqs.filter(r=>r.prof===p.id&&r.kind==='candidatura'&&r.status==='pendente').map(r=>r.shift));
  const opps=S.shifts.filter(s=>['descoberto','publicado'].includes(s.status)&&new Date(s.start)>now&&dkey(s.start)<addDays(T,30)&&!myIds.has(s.id)&&(!s.cat||s.cat===p.cat)).map(s=>({s,open:s.slots-S.asg.filter(a=>a.shift===s.id&&ACTIVE(a.status)).length})).filter(x=>x.open>0).sort((a,b)=>a.s.start.localeCompare(b.s.start));
  const reqs=S.reqs.filter(r=>r.prof===p.id).sort((a,b)=>b.created.localeCompare(a.created));
  const visits=S.visits.filter(v=>v.prof===p.id&&v.status!=='cancelado'&&v.date>=addDays(T,-1)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const procs=S.procs.filter(x=>x.prof===p.id).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const todo=procs.filter(x=>x.status==='agendado'||x.status==='devolvido');const pendConf=up.filter(x=>x.a.status==='aguardando_confirmacao');
  const todayShift=active.find(x=>dkey(x.s.start)===T&&x.a.status==='confirmado'&&new Date(x.s.end)>new Date(now-6*36e5));
  const rel=k=>{const d=daysTo(k);return d===0?'Hoje':d===1?'Amanhã':d===-1?'Ontem':cap(F(k,{weekday:'long',day:'numeric',month:'short'}))};
  const TASKS=[['Confirmar plantões',pendConf.length,'cal',5,'escala','Plantões publicados esperando sua resposta'],['Procedimentos a realizar',todo.filter(x=>x.status==='agendado').length,'clip',2,'procs','Agendados para você'],
    ['Devolvidos para correção',todo.filter(x=>x.status==='devolvido').length,'alert',6,'procs','A responsável técnica pediu ajuste'],['Atendimentos domiciliares',visits.filter(v=>v.date===T).length,'home',4,'home','Visitas de hoje']];
  return html`<div className="space-y-5">
    <div className="flex flex-wrap items-end justify-between gap-4"><div><p className="text-[13px] font-semibold text-soft">${cap(F(T,{weekday:'long',day:'numeric',month:'long'}))}</p><h1 className="text-[30px] font-semibold leading-tight tracking-tight sm:text-[38px]">${greet()}, ${p.name.split(' ')[0]}</h1><p className="text-[14.5px] text-soft">${CAT[p.cat]} em ${S.inst.name}.</p></div>
      <div className="flex flex-wrap gap-2">${can(S,u,'vaccines.apply')&&html`<${Btn} v="ink" icon="syringe" onClick=${()=>go({page:'vacinacao'})}>Registrar vacina<//>`}${can(S,u,'procedures.register')&&html`<${Btn} v="lime" icon="clip" onClick=${()=>setReg(true)}>Registrar procedimento<//>`}</div></div>
    <div className="grid gap-5 xl:grid-cols-[1.2fr_1fr]">
      <section className="rounded-[26px] bg-navy p-6 text-onnavy">${next?html`<div className="flex flex-wrap items-start justify-between gap-3"><p className="text-[13px] opacity-70">Próximo plantão, ${rel(dkey(next.s.start)).toLowerCase()}</p><span className=${cx('rounded-full px-3 py-1 text-xs font-bold',next.a.status==='confirmado'?'bg-lime text-onlime':'bg-amberbg text-amber')}>${AST[next.a.status][0]}</span></div>
        <p className="thin mt-1 whitespace-nowrap text-[42px] leading-none sm:text-[56px]">${hm(next.s.start)}<span className="opacity-50">–${hm(next.s.end)}</span></p>
        <p className="mt-3 font-bold">${unitOf(S,next.s.unit).name}${next.s.service?' / '+servOf(S,next.s.service).name:''}</p><p className="text-[13px] opacity-70">${unitOf(S,next.s.unit).addr}</p>
        ${todayShift&&todayShift.a.id===next.a.id&&html`<div className="mt-4 flex flex-wrap items-center gap-2 rounded-[18px] bg-onnavy/10 p-3"><${Icon} n="login" s=${16}/><span className="text-sm">Ponto: ${next.a.inAt?'entrada '+hm(next.a.inAt):'entrada não registrada'}${next.a.outAt?', saída '+hm(next.a.outAt):''}</span>
          <span className="ml-auto flex gap-2">${!next.a.inAt&&html`<${Btn} size="sm" v="lime" onClick=${()=>run((D,U)=>A.punch(D,U,next.a.id,'in'),'Entrada registrada.')}>Registrar entrada<//>`}${next.a.inAt&&!next.a.outAt&&html`<${Btn} size="sm" v="lime" onClick=${()=>run((D,U)=>A.punch(D,U,next.a.id,'out'),'Saída registrada.')}>Registrar saída<//>`}</span></div>`}
        <${MyActions} a=${next.a} dark/>`
        :html`<p className="thin text-[34px]">Sem plantões agendados</p><p className="mt-2 opacity-75">Quando a gestão publicar uma escala com você, ela aparece aqui.</p>`}</section>
      <div className="grid grid-cols-2 gap-3">${TASKS.map(([t,n,ic,tn,tb,sub])=>html`<button key=${t} onClick=${()=>setTab(tb)} className=${cx('group flex min-h-[140px] flex-col justify-between rounded-[22px] p-4 text-left text-onp transition hover:-translate-y-0.5 hover:shadow-lg',PASTEL[tn])}>
        <span className="flex items-start justify-between"><span className="grid h-10 w-10 place-items-center rounded-xl bg-white/60"><${Icon} n=${ic} s=${18}/></span><span className="grid h-9 w-9 place-items-center rounded-full border border-current/30 transition group-hover:bg-white/60"><${Icon} n="ur" s=${15}/></span></span>
        <span><span className="block text-[34px] font-semibold leading-none">${n}</span><span className="mt-1 block text-[14px] font-bold leading-tight">${t}</span><span className="block text-[11.5px] opacity-70">${sub}</span></span></button>`)}</div></div>
    <${Card} title="Esta semana" icon="cal" tone=${3} action=${html`<${Badge} tone="lime">${fmtH(wh)} escaladas<//>`}><div className="no-scrollbar -mx-1 flex gap-2 overflow-x-auto px-1">${week.map(d=>{const it=active.filter(x=>dkey(x.s.start)===d);return html`<div key=${d} className=${cx('min-w-[118px] flex-1 rounded-[18px] p-3',d===T?'bg-navy text-onnavy':'bg-panel2')}>
        <p className=${cx('text-[11px] font-bold uppercase',d===T?'opacity-70':'text-faint')}>${F(d,{weekday:'short'}).replace('.','')}</p><p className="text-[22px] font-semibold leading-none">${F(d,{day:'2-digit'})}</p>
        <div className="mt-2 space-y-1">${it.length?it.map(x=>html`<p key=${x.a.id} className=${cx('rounded-lg px-2 py-1 text-[11.5px] font-bold text-onp',PASTEL[svcTone(S,x.s)])}>${hm(x.s.start)}–${hm(x.s.end)}</p>`):html`<p className="text-[12px] opacity-60">Folga</p>`}</div></div>`})}</div><//>
    <${Seg} items=${[['escala','Minha escala',up.length],['procs','Procedimentos',todo.length],['opps','Oportunidades',opps.length],['home','Domiciliares',visits.length],['reqs','Solicitações',reqs.filter(r=>r.status==='pendente').length],['disp','Disponibilidade e férias']]} value=${tab} onChange=${setTab}/>
    ${tab==='escala'&&html`<div className="grid gap-3 md:grid-cols-2">${up.length===0?html`<${Empty} title="Nenhum plantão futuro"/>`:up.map(x=>html`<article key=${x.a.id} className="card-sh min-w-0 rounded-[22px] bg-panel p-5">
      <div className="flex items-start justify-between gap-3"><div className="min-w-0"><p className="text-[13px] text-soft">${cap(F(x.s.start,{weekday:'long',day:'2-digit',month:'2-digit'}))}</p><p className="thin whitespace-nowrap text-[26px] leading-tight sm:text-[30px]">${hm(x.s.start)}–${hm(x.s.end)}</p><p className="text-[13px] text-soft">${unitOf(S,x.s.unit).name}${x.s.service?' / '+servOf(S,x.s.service).name:''}</p></div><${Badge} tone=${AST[x.a.status][1]}>${AST[x.a.status][0]}<//></div>
      ${(x.a.inAt||x.a.outAt)&&html`<p className="mt-2 text-[12.5px] text-soft">Ponto: entrada ${x.a.inAt?hm(x.a.inAt):'—'}, saída ${x.a.outAt?hm(x.a.outAt):'—'}</p>`}<${MyActions} a=${x.a}/></article>`)}</div>`}
    ${tab==='procs'&&html`<div className="space-y-4">
      <div className="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${todo.length===0?html`<${Empty} title="Nenhum procedimento pendente">Procedimentos agendados para você aparecem aqui para confirmar a realização.<//>`:todo.map(x=>{const pt=patOf(S,x.patient);return html`<article key=${x.id} className=${cx('rounded-[22px] p-4 text-onp',x.status==='devolvido'?'bg-p6':'bg-p2')}>
        <div className="flex items-start justify-between gap-2"><span className="rounded-full bg-white/70 px-2.5 py-0.5 text-[11.5px] font-bold">${rel(x.date)}, ${x.start}</span><span className="rounded-full bg-white/70 px-2.5 py-0.5 text-[11.5px] font-bold">${PST[x.status][0]}</span></div>
        <p className="mt-2.5 text-[17px] font-bold leading-tight">${x.type}</p><p className="text-[13px] opacity-80">${pt.name}, ${ageLabel(pt.birth)}</p>
        ${pt.allergies.length>0&&html`<p className="mt-1.5 rounded-xl bg-white/80 px-2.5 py-1 text-[12px] font-bold text-danger">Alergia: ${pt.allergies.join(', ')}</p>`}
        ${x.returnNote&&html`<p className="mt-1.5 rounded-xl bg-white/80 px-2.5 py-1.5 text-[12.5px]"><b>Correção pedida:</b> ${x.returnNote}</p>`}
        <div className="mt-3 flex flex-wrap gap-2"><button className="h-9 rounded-full bg-[#111318] px-4 text-[13px] font-bold text-white" onClick=${()=>setDoing({x,mode:'done',t:x.notes||''})}>${x.status==='devolvido'?'Corrigir e reenviar':'Confirmar realização'}</button>
          ${x.status==='agendado'&&html`<button className="h-9 rounded-full bg-white/75 px-4 text-[13px] font-bold" onClick=${()=>setDoing({x,mode:'not',t:''})}>Não realizado</button>`}<button className="h-9 rounded-full bg-white/50 px-3 text-[13px] font-bold" onClick=${()=>go({page:'paciente',id:pt.id})}>Prontuário</button></div></article>`})}</div>
      <${Card} title="Histórico de procedimentos" icon="clip" tone=${1}>${procs.filter(x=>!['agendado','devolvido'].includes(x.status)).length===0?html`<p className="text-sm text-soft">Nada registrado ainda.</p>`:html`<ul className="space-y-1.5">${procs.filter(x=>!['agendado','devolvido'].includes(x.status)).reverse().map(x=>html`<li key=${x.id} className="flex flex-wrap items-center gap-3 rounded-2xl bg-panel2 px-3.5 py-2.5 text-sm">
        <span className="w-24 shrink-0 font-semibold">${D2(x.date)} ${x.start}</span><span className="min-w-0 flex-1"><b>${x.type}</b> <span className="text-soft">· ${patOf(S,x.patient).name}</span></span><${Badge} tone=${PST[x.status][1]}>${PST[x.status][0]}<//></li>`)}</ul>`}<//></div>`}
    ${tab==='opps'&&html`<div className="grid gap-3 md:grid-cols-2 xl:grid-cols-3">${opps.length===0?html`<${Empty} title="Nenhuma vaga aberta para a sua categoria"/>`:opps.slice(0,12).map(({s,open})=>html`<article key=${s.id} className=${cx('rounded-[22px] p-5 text-onp',PASTEL[svcTone(S,s)])}>
      <p className="text-[13px] opacity-75">${cap(F(s.start,{weekday:'long',day:'2-digit',month:'2-digit'}))}</p><p className="thin text-[30px] leading-tight">${hm(s.start)}–${hm(s.end)}</p><p className="text-[13px] opacity-75">${unitOf(S,s.unit).name}${s.service?' / '+servOf(S,s.service).name:''}</p>
      <div className="mt-4 flex items-center justify-between"><span className="rounded-full bg-white/80 px-2.5 py-0.5 text-xs font-bold text-danger">${open} ${open===1?'vaga':'vagas'}</span>${applied.has(s.id)?html`<span className="rounded-full bg-white/80 px-2.5 py-0.5 text-xs font-bold">Candidatura enviada</span>`:html`<button className="h-9 rounded-full bg-[#111318] px-4 text-[13px] font-bold text-white" onClick=${()=>run((D,U)=>A.apply(D,U,s.id),'Candidatura enviada para a gestão.')}>Candidatar-me</button>`}</div></article>`)}</div>`}
    ${tab==='home'&&html`<div className="grid gap-3 md:grid-cols-2">${visits.length===0?html`<${Empty} title="Nenhum atendimento domiciliar"/>`:visits.map(v=>{const pt=S.patients.find(x=>x.id===v.patient);return html`<article key=${v.id} className="card-sh rounded-[22px] bg-panel p-5">
      <div className="flex items-start justify-between gap-3"><div><p className="text-[13px] text-soft">${rel(v.date)}, ${v.start}–${v.end}</p><p className="mt-0.5 text-lg font-bold">${pt.name}</p><p className="text-[13px] text-soft">${v.service}</p><p className="mt-1 flex items-center gap-1 text-[13px] text-faint"><${Icon} n="pin" s=${13}/>${pt.addr}, ${pt.region}</p></div><${Badge} tone=${HVS[v.status][1]}>${HVS[v.status][0]}<//></div>
      <div className="mt-4 flex flex-wrap gap-2">${v.status==='agendado'&&html`<${Btn} size="sm" v="lime" onClick=${()=>run((D,U)=>A.visitStatus(D,U,v.id,'em_andamento'),'Atendimento iniciado.')}>Iniciar atendimento<//>`}
        ${v.status==='em_andamento'&&html`<${Btn} size="sm" v="lime" icon="check" onClick=${()=>run((D,U)=>A.visitStatus(D,U,v.id,'concluido','Atendimento realizado conforme agendado.'),'Atendimento concluído. Registre a evolução no prontuário.')}>Concluir<//>`}

          <div className="mt-3 flex flex-wrap items-center justify-between gap-2"><p className="flex items-center gap-1.5 text-[12px] text-faint"><${Icon} n="lock" s=${12}/>Depois de assinado, o registro não pode ser editado nem apagado. Correções viram adendo.</p>
            <${Btn} v="lime" icon="check" disabled=${ev.text.trim().length<10} onClick=${()=>{const r=run((D,U)=>A.record(D,U,{patient:id,...ev}),'Evolução assinada e registrada.');if(r.ok)setEv({...ev,text:''})}}>Assinar e registrar<//></div></div>`}
        ${evol.length===0?html`<${Empty} title="Nenhuma evolução registrada"/>`:html`<ul className="space-y-3">${evol.map(e=>html`<li key=${e.id} className="rounded-[20px] border border-line/70 p-4"><div className="flex items-start gap-3"><${Avatar} name=${e.author} size=${36}/><div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-center gap-2"><p className="font-bold">${e.author}</p><span className="text-[12px] text-faint">${e.cat}</span><${Badge} tone="p2">${e.kind}<//><span className="ml-auto text-[12px] text-faint">${F(e.at,{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
          <p className="mt-1.5 whitespace-pre-wrap text-[14.5px]">${e.text}</p>

          ${e.author===u.name&&(ad===e.id?html`<div className="mt-2 flex flex-wrap gap-2"><input className=${inputCls+' h-10 flex-1 py-1.5'} placeholder="Texto do adendo" aria-label="Adendo" value=${adT} onInput=${x=>setAdT(x.target.value)}/><${Btn} size="sm" onClick=${()=>setAd(null)}>Voltar<//><${Btn} size="sm" v="lime" onClick=${()=>{const r=run((D,U)=>A.addendum(D,U,e.id,adT),'Adendo registrado.');if(r.ok){setAd(null);setAdT('')}}}>Salvar adendo<//></div>`

      ${tab==='acessos'&&html`<div><p className="mb-3 text-sm text-soft">Quem acessou ou alterou este prontuário. Registro exigido para rastreabilidade (LGPD).</p><${Table} minW=${560} cols=${['Quando','Quem','Ação','Detalhe']} rows=${access.map(a=>html`<tr key=${a.id}><${TD} className="whitespace-nowrap">${F(a.at,{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}<//><${TD}><span className="flex items-center gap-2"><${Avatar} name=${a.actor} size=${24}/>${a.actor}</span><//><${TD} className="font-semibold">${ACT[a.action]||a.action}<//><${TD} className="text-soft">${a.detail}<//></tr>`)}/></div>`}

/* ------------------------------------------------------------------ procedimentos (gestão e conferência) */
const PCOL=[['agendado','Agendados',3],['realizado','Aguardando conferência',1],['devolvido','Devolvidos para correção',6],['conferido','Conferidos',4]];
function ProcAssign({onClose}){
  const {S,run}=useApp();const [f,setF]=useState({patient:'',type:(S.procCat.find(p=>!p.archived)||{}).name||'',prof:'',date:today(),start:'10:00',unit:S.units[0].id});
  return html`<${Modal} open wide onClose=${onClose} title="Agendar procedimento" desc="O profissional recebe o aviso e confirma a realização pela Minha área. Depois, a responsável técnica confere."
    footer=${html`<${Btn} onClick=${onClose}>Cancelar<//><${Btn} v="lime" onClick=${()=>{const r=run((D,U)=>A.procAssign(D,U,f),'Procedimento agendado e profissional avisado.');if(r.ok)onClose()}}>Agendar<//>`}>
    <div className="grid gap-4 sm:grid-cols-2"><div className="sm:col-span-2"><p className="mb-1.5 text-[13px] font-semibold text-soft">Paciente</p><${PatientPicker} id="pa-p" value=${f.patient} onChange=${id=>setF({...f,patient:id})}/></div>
      <${Field} label="Procedimento" id="pa-t"><select id="pa-t" className=${inputCls} value=${f.type} onChange=${e=>setF({...f,type:e.target.value})}>${S.procCat.filter(p=>!p.archived).map(p=>html`<option key=${p.id}>${p.name}</option>`)}</select><//>
      <${Field} label="Profissional" id="pa-pr"><select id="pa-pr" className=${inputCls} value=${f.prof} onChange=${e=>setF({...f,prof:e.target.value})}><option value="">Selecione</option>${S.profs.filter(p=>p.active&&p.cat!=='medico'&&p.cat!=='farmaceutico').map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select><//>
      <${Field} label="Data" id="pa-d"><input id="pa-d" type="date" className=${inputCls} value=${f.date} onChange=${e=>setF({...f,date:e.target.value})}/><//>
      <${Field} label="Horário" id="pa-h"><input id="pa-h" type="time" className=${inputCls} value=${f.start} onChange=${e=>setF({...f,start:e.target.value})}/><//>
      <${Field} label="Unidade" id="pa-u"><select id="pa-u" className=${inputCls} value=${f.unit} onChange=${e=>setF({...f,unit:e.target.value})}>${S.units.filter(x=>!x.archived).map(x=>html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select><//></div><//>`;
}
function Procedimentos(){
  const {S,u,run}=useApp();const T=today();const [prof,setProf]=useState('');const [per,setPer]=useState('semana');const [nw,setNw]=useState(false);const [back,setBack]=useState(null);
  const verify=can(S,u,'procedures.verify');
  const list=S.procs.filter(x=>(!prof||x.prof===prof)&&(per==='todos'||(per==='hoje'?x.date===T:x.date>=addDays(T,-6))));
  const col=k=>list.filter(x=>k==='realizado'?(x.status==='realizado'||x.status==='nao_realizado'):x.status===k).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return html`<div className="space-y-5"><${PageHead} title="Procedimentos" desc="O profissional registra e confirma o que realizou; a responsável técnica confere ou devolve para correção. Tudo entra no prontuário."
    actions=${(verify||can(S,u,'homecare.manage'))&&html`<${Btn} v="lime" icon="plus" onClick=${()=>setNw(true)}>Agendar procedimento<//>`}/>
    <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">${PCOL.map(([k,l,tn])=>html`<${Kpi} key=${k} icon=${k==='conferido'?'check':k==='devolvido'?'left':k==='realizado'?'clock':'cal'} tone=${tn} title=${l} sub=${per==='hoje'?'Hoje':per==='semana'?'Últimos 7 dias':'Todos'} value=${col(k).length}/>`)}</div>
    <div className="flex flex-wrap items-center gap-2"><${Seg} size="sm" items=${[['hoje','Hoje'],['semana','7 dias'],['todos','Todos']]} value=${per} onChange=${setPer}/>
      <select aria-label="Profissional" className=${selCls+' card-sh h-10 sm:ml-auto'} value=${prof} onChange=${e=>setProf(e.target.value)}><option value="">Todos os profissionais</option>${S.profs.filter(p=>S.procs.some(x=>x.prof===p.id)).map(p=>html`<option key=${p.id} value=${p.id}>${p.name}</option>`)}</select></div>
    <div className="no-scrollbar -mx-4 overflow-x-auto px-4 pb-2"><div className="grid min-w-[1000px] grid-cols-4 gap-4">${PCOL.map(([k,l,tn])=>{const xs=col(k);return html`<section key=${k} className="rounded-[22px] bg-panel/60 p-2.5 ring-1 ring-line/70">
      <header className="flex items-center justify-between px-2 pb-2.5 pt-1"><span className="flex items-center gap-2 text-sm font-bold"><span className=${cx('h-2.5 w-2.5 rounded-full',PASTEL[tn])}></span>${l}</span><span className="rounded-full bg-panel2 px-2 text-[12px] font-bold">${xs.length}</span></header>
      <div className="space-y-2.5">${xs.length===0?html`<p className="rounded-2xl border border-dashed border-line px-3 py-6 text-center text-[13px] text-faint">Nada aqui</p>`:xs.map(x=>{const pt=patOf(S,x.patient),pr=profOf(S,x.prof);return html`<article key=${x.id} className=${cx('rounded-[18px] p-3.5 text-onp',PASTEL[tn])}>
        <div className="flex flex-wrap gap-1"><span className="rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-bold">#${x.type.split(' ')[0].toLowerCase()}</span><span className="rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-bold">${D2(x.date)} ${x.start}</span>${x.status==='nao_realizado'&&html`<span className="rounded-full bg-white px-2 py-0.5 text-[11px] font-bold text-danger">não realizado</span>`}</div>
        <p className="mt-2 font-bold leading-tight">${x.type}</p><p className="text-[13px] opacity-80">${pt.name}</p>
        ${x.notes&&html`<p className="mt-1.5 line-clamp-3 rounded-xl bg-white/55 px-2.5 py-1.5 text-[12.5px]">${x.notes}</p>`}${x.returnNote&&html`<p className="mt-1.5 rounded-xl bg-white/80 px-2.5 py-1.5 text-[12.5px]"><b>Correção pedida:</b> ${x.returnNote}</p>`}
        <div className="mt-3 flex items-center gap-2"><${Avatar} name=${pr.name} size=${26}/><span className="min-w-0 flex-1 truncate text-[12.5px] font-semibold">${pr.name}</span>${x.verifiedBy&&html`<span className="text-[11px] opacity-70">por ${x.verifiedBy.split(' ')[0]}</span>`}</div>
        ${verify&&k==='realizado'&&html`<div className="mt-3 flex gap-2"><button className="h-8 flex-1 rounded-full bg-[#111318] text-[12.5px] font-bold text-white" onClick=${()=>run((D,U)=>A.procVerify(D,U,x.id,true),'Procedimento conferido.')}>Conferir</button><button className="h-8 flex-1 rounded-full bg-white/80 text-[12.5px] font-bold" onClick=${()=>setBack(x)}>Devolver</button></div>`}</article>`})}</div></section>`})}</div></div>
    ${nw&&html`<${ProcAssign} onClose=${()=>setNw(false)}/>`}
    <${Confirm} open=${!!back} title="Devolver para correção" desc=${back?`${back.type}, ${patOf(S,back.patient).name}. O profissional recebe o aviso e corrige pela Minha área.`:''} okLabel="Devolver" tone="ink" needReason onClose=${()=>setBack(null)} onOk=${r=>{const x=run((D,U)=>A.procVerify(D,U,back.id,false,r),'Procedimento devolvido.');if(x.ok)setBack(null)}}/></div>`;
}

const aesClients=S=>S.patients.filter(p=>p.aes||S.aesAppts.some(a=>a.patient===p.id)||S.aesPkgs.some(k=>k.patient===p.id));
function AesSession({a,onClose}){
  const {S,run}=useApp();const pt=patOf(S,a.patient),c=aesCatOf(S,a.cat),k=a.pkg&&S.aesPkgs.find(x=>x.id===a.pkg);

const GRAU={1:['Grau I','p4','Independente, mesmo com equipamentos de autoajuda'],2:['Grau II','p1','Ajuda em até três atividades de autocuidado'],3:['Grau III','p6','Ajuda em todas as atividades de autocuidado e/ou comprometimento cognitivo']};

  const mins=(+now.slice(0,2)*60+ +now.slice(3))-(+t.slice(0,2)*60+ +t.slice(3));return {r,t,m,late:!m&&mins>60,due:!m&&mins>=-30}})).sort((a,b)=>a.t.localeCompare(b.t))};

    actions=${html`${care&&html`<${Btn} icon="alert" onClick=${()=>setOcc({patient:'',kind:'Queda',desc:'',actions:''})}>Registrar intercorrência<//>`}${manage&&html`<${Btn} v="lime" icon="plus" onClick=${()=>setAdm({patient:'',room:'',bed:'',grau:'2',contact:'',diet:'Dieta geral'})}>Admitir residente<//>`}`}/>

function AreaChart({evals}){
  const w=520,h=170,pd=28;const vals=evals.map(wArea);const mx=Math.max(...vals,1);
  const x=i=>evals.length===1?w/2:pd+i*(w-pd*2)/(evals.length-1),y=v=>h-pd-(v/mx)*(h-pd*2);
  return html`<svg viewBox=${`0 0 ${w} ${h}`} className="h-44 w-full" role="img" aria-label="Evolução da área da lesão">
    ${[0,.5,1].map(f=>html`<line key=${f} x1=${pd} x2=${w-pd} y1=${y(mx*f)} y2=${y(mx*f)} stroke="rgb(var(--c-line))" strokeDasharray="3 4"/>`)}
    <path d=${`M${x(0)},${h-pd} `+vals.map((v,i)=>`L${x(i)},${y(v)}`).join(' ')+` L${x(vals.length-1)},${h-pd} Z`} fill="rgb(var(--c-p6) / .35)"/>
    <polyline points=${vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ')} fill="none" stroke="rgb(var(--c-ink))" strokeWidth="2.5" strokeLinejoin="round"/>
    ${vals.map((v,i)=>html`<g key=${i}><circle cx=${x(i)} cy=${y(v)} r="5" fill="rgb(var(--c-panel))" stroke="rgb(var(--c-ink))" strokeWidth="2.5"/><text x=${x(i)} y=${y(v)-12} textAnchor="middle" fontSize="12" fontWeight="700" fill="rgb(var(--c-ink))">${v.toLocaleString('pt-BR')}</text>
      <text x=${x(i)} y=${h-8} textAnchor="middle" fontSize="11" fill="rgb(var(--c-faint))">${D2(evals[i].at)}</text></g>`)}</svg>`;
}
